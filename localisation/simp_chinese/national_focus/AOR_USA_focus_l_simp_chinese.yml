l_simp_chinese:  

USA_Thomas_Woodrow_Wilson:0"和气的学者总统"

 USA_WhiteHouseReport:0"白宫评估报告"
 USA_WhiteHouseReport_desc:0"我们非常清楚的知道1919年的美国是什么样的现状:世界大战肆虐的4年,原本以为会从中获取巨大利益的我们，并没有等来属于美元的黄金时代。国内风云涌起的工人运动时刻冲击着企业家们不安的心理,生产陷入停滞，经济衰退。西部的动乱愈演愈烈，南方的野心家们也在时刻妄图撕碎脆弱的平衡。是时候该做出改变了，我们的威尔逊总统!"

 USA_challenge:0"直面挑战"
 USA_challenge_desc:0"自南北战争结束以来,美国从没有遭遇过如今天迫在眉睫的经济危机，也没有经历过如此紧张的社会氛围。而被推在风口浪尖上的威尔逊总统，心中已经慢慢扶起了他的一项改革计划……是时候该让我们的“白宫小子”们面对挑战了"

 USA_SanFrancisco:0"旧金山加急"
 USA_SanFrancisco_desc:0"果然,在这混乱的时期中，可恶的“牛仔”又在从中作祟了。西部呈几何式增长的匪徒袭击案件让我们不得不再度陷入悲观-西部叛乱势力再次发起了对联邦政府新一轮进攻,而且规模比我们想象的要大的多。潘兴将军已经发来急电，而身处在东海岸的我们也自然要为这帮西海岸的英雄们想出对策。"

 USA_Eagle:0"美利坚的雄鹰"
 USA_Eagle_desc:0"自七八十年代的“牛仔”动乱以来，西部的美利坚公民与士兵们已经对这些烧杀抢掠、无恶不作的叛乱者焦头烂额极了。有些人选择回到了东部的故乡，而有些人则逆行前进-潘兴将军和他的士兵们就是这么一群人。他们在西海岸一呆就是20多年,以身化作白宫的西部雄鹰时刻围剿来自沙漠中的反动分子。而如今混乱的局面下，我们更应该支持与鼓励潘兴将军与其部队在西部的作战热情,并希望他们能为我们带来更大的胜利。"

 USA_Watchman:0"西部的守望者"
 USA_Watchman_desc:0"虽然潘兴将军是一个实打实的爱国者，可是我们不得不对他的20万大军有所忌惮;毕竟，远在天边的军队，是政府中存在的最不稳定因素。我们倒不如把目光放在那些西部中真实生活的人-如美国铁路安保公司，西部联合武装力量集团这些佣兵组织;或者是初来乍到但极快扎根的劳动骑士团。他们中的大部分成员都是生活生长在西部的美国公民，早已对这片土地如漆似胶，情投意合。利用他们熟悉的地形与分散的战术去对抗同样分散的“牛仔”组织，并保障西部铁路线的运输安全，是这些西部守望者们力所能及的事;而白宫政府自然会对他们给予一定支持。"

 USA_Railway:0"武装铁路网计划"
 USA_Railway_desc:0"事实证明，西部人关于机动性的想法不是吹的。这些佣兵公司们很快就提出了一项计划:由相对应的公司提供资金去改装运输火车，使其本身就具有作战性,而无需浪费不利于作战的车厢或者专门制造装甲列车保证运输。同时，随着西部石油工业的日益发展，佣兵们的载具也应该从原始的马匹变成先进的摩托车或者卡车。这会为佣兵公司的重型武器提供更好的发挥平台。"

 USA_West:0"西部无穷，狂野无限"
 USA_West_desc:0"尽管西部的事情告一段落，但我们仍然不可否认:尽管合众国的西部是一个充满了机遇和财富的地方，但西部又以极端的混乱阻碍着寻梦人们的前进。究竟是谁造成这种状况的，已经无法评说了。"

 USA_Detroit:0"底特律红色风暴"
 USA_Detroit_desc:0"自5月1日以来的五大湖地区一直经历着难以想象的工人罢工浪潮，而在最近，底特律的罢工工人们居然用暴力手段夺取了警察局的武器，在与军、警、骑士团发生激烈交火后占领了底特律市的大部分地区。在美国历史上，从来没有一次罢工能够占领一个城市，况且是一座巨型工业城市。为此，威尔逊总统不得不暂时搁置改革计划,转而全力应对此次前所未有的工人暴动活动。"

 USA_Analysis:0"分析工人运动"
 USA_Analysis_desc:0"分析工人运动:很简单，美利坚从来没有如此有计划有预谋的工人暴动出现;那么相对应的，必然有一个工人的幕后组织去指使他们与联邦政府作对;但同时我们也不能忽视工人和那帮企业家的关系。我们要尽快分析这次工人暴动的成因,并将矛头指向我们可以查找的几个毒瘤残渣为止。"

 USA_Arrest:0"揪出幕后黑手"
 USA_Arrest_desc:0"很遗憾，令我们惊奇的是，这次的工人暴动虽然内部组织多种多样,而且工人们也自发成立了一个底特律的工人组织的临时政府;但我们始终不能在他们之间找到一个真正有总体领导力的组织。不过,既然他们敢成群地反抗我们，我们自然能将这项罪名转移给其他人，比如，左翼联盟。"

 USA_MartialLaw:0"颁布戒严令"
 USA_MartialLaw_desc:0"美国历史上颁布过不少戒严令，且大部分都发生于工人罢工期间。而这次的戒严令非同寻常，我们不仅要打起十分的精神去应对这次暴动，更要利用戒严令去控制整个北方混乱的局面-包括那些无法无天的企业家们。"

 USA_Mobilize:0"动员一切武装力量"
 USA_Mobilize_desc:0"团结力量大,美利坚什么都不缺，就缺团结。而应对今天的暴动，威尔逊总统鼓励军、警、民、团们携手共进，向五大湖与底特律大步进军。而其中仍在底特律战斗的劳动骑士团是我们方针的重中之重-我们需要动员劳动骑士团发动重兵前往底特律去救援他们的总部人员;当然，这会让劳动骑士团损失不少军事力量。"

 USA_Appease:0"安抚企业"
 USA_Appease_desc:0"企业是美利坚的根，如果白宫政府是船帆,那么这些企业们就是船身。底特律的工人们在战斗中烧毁了许多企业、工厂，为了维护美利坚的根基，同时赔偿底特律众多企业的损失,国会只得拿出那点可怜的预算去尽量安抚他们了。但最重要的是稳定他们的情绪,避免市场上更加恐怖的连锁反应发生。"

 USA_Morgan:0"与摩根商谈"
 USA_Morgan_desc:0"摩根大通被戏称为美国真正的国家银行。但撇开偏见不谈，摩根大通的控制者以及它的摩根家族的确是美国最有权势的几大家族之一，且绝大部分都精通商业经济学。威尔逊这次紧急召见摩根,便是商谈底特律事件中如何安抚企业和将来后底特律时期的市场稳定事宜;尤其是谈论摩根大通控股的卡内基公司受到的损失与未来指导意见。不过话说回来，这已经不是摩根大通第1次救市了。"

 USA_EndTheCrisis:0"再一次结束危机"
 USA_EndTheCrisis_desc:0"令世界所震惊的底特律红色风暴终于终止下来了,这令威尔逊和白宫的十分欣喜。但是经过此次事件后，威尔逊明白,美利坚合众国将会迎来更加难以想象的暴风骤雨,底特律的危机只不过是又一次大危机的前兆。"

 USA_IntelligenceStation:0"路易斯安那情报站"
 USA_IntelligenceStation_desc:0"谁说一个割裂的南北政党操控的国家机关就没有情报系统了?无非就是北边的情报机关支持北边的总统,南边的情报机关支持南边的总统罢了。这次威尔逊所收到的通知是他忠诚的北方人为他提供的有利情报:信息显示，南方部分州县趁美国处于经济哀退期间开始鼓动极端思想,妄图将我们党派之间的矛盾转为南方民众对我们联邦政府之间的矛盾,并最终促使南方的独立;不过对于这种事情的处理，威尔逊早有准备。"

 USA_Criticize:0"批评迪克西激进派"
 USA_Criticize_desc:0"进入20世纪，报纸与电报媒体的发展极大的促进了合众国人民的生活福祉,但是信息的快速传输，也使人的理性思维失去了直觉;这正是南方激进派的手段。而我们也要以其人之道还之其人之身,利用这些媒体的口和手去抨击南方的这些无耻之徒。"

 USA_Mission:0"联邦协约国使团"
 USA_Mission_desc:0"美利坚作为协约国的一员,自然有能力去质问协约国成员对美国国内事务是否有何干涉。作为协约国领头羊-英法两国可能不会将事情真正透露给我们;但是我们可以通过公开召集协约国代表商谈的这种方式，去震慑南方的那些想依靠外国主子存活的叛徒。"

 USA_Peace:0"期盼和平到来"
 USA_Peace_desc:0"协约国使团的商谈会议并没有取得什么实质性进展;但是在商谈期间。南方的反动声音却逐渐的消沉下来了。在会议的最后,英法两国公使代表表示期盼美利坚可以成功度过这次危机,而我们也希望通过美利坚的手可以达成世界和平的目的-包括美国国内。"

 USA_NewYear:0"§R过个好年，美国人§!"
 USA_NewYear_desc:0"§R令人期盼的圣诞节来临了,危机的结束,使得未知的1920、美利坚的灰色前景更加扑朔迷离,令人恐惧。而今年过后,美利坚的兴衰与否,与1919年的圣诞节亳无关系，所以,祝圣诞快乐,美国!§!"

 USA_PlanOfOperation:0"潘兴将军的作战计划"
 USA_PlanOfOperation_desc:0"姜还是老的辣，拥有丰富作战经验的潘兴将军，很快就拟定了一份关于进攻叛乱组织的大篇幅计划;并决定动用新式武器-坦克来进攻“牛仔”们。相信在潘兴将军的指挥下，这些西部的悍匪必将灰飞烟灭!"
 USA_Arrest.tt:0"§Y左翼联盟的支持率下降!§!"
 USA_Peace.tt:0"§Y迪克西党的支持率下降!§!" 



USA_2:0"美利坚威尔逊1920年国策"

USA_White_House:0"白宫跨年演讲"
USA_White_House_desc:0"经过了惊心动魄的1919年，美利坚迎来了1920年新的挑战。但美国公民们似乎因没有希望的未来生活，而继续冷漠地苟活。威尔逊总统明白要改变些什么，他预备在春季发表一场白宫演讲，以此来唤醒这些沉睡的美国人对未来的期待。愿总统已经做好一切准备，不要在这个动荡的社会中再次上演1863年圣诞的悲剧了……"

USA_Beautiful_Country:0"《美丽国家计划》"
USA_Beautiful_Country_desc:0"威尔逊在白宫演讲提出的《美丽国家计划》并没有预想中那样，犹如一颗重磅炸弹在死水间泛起一阵波澜-民众表示了不可置信，国内外的媒体则表达了他们对总统执行国家计划而导致美国失控的担忧；而国内的企业组织们对此暂时没有态度表达。威尔逊的骰子已经投下，没有后路可走。"

USA_Pick_up:0 "拾起社会的碎片"
USA_Pick_up_desc:0"我们当然承认，美利坚的社会就是一地渣子的社会，你可以在这里找到各种各样的布道士：他们宣传种族仇恨、宣传内部分裂，带着各种奇怪服饰，甚至是一堆拿着热武器的骑士同志们，都能代替警察去维护秩序。\n而在另一面，多少无家可归的工人冻死他乡，多少家庭因为各种变故而支离破碎；种种问题，美国政府都没有做到应尽的责任。趁着国会还没有把钱乱花的份上，威尔逊总统得赶紧制定一些交互措施啊。"

USA_Compensate_them:0"对他们作出补偿"
USA_Compensate_them_desc:0"美国的工人自然是这个国家中最辛苦的-除了南方的黑人工人以外。他们无时无刻都在受着暴发户们的气去干某些人难以想象的困难工作。从南北战争结束以来，美国政府从来没有关心过他们，对于各种所谓的保障措施也熟视无睹。\n如今一次又一次的工人动乱，却让我们警醒起来。如果我们的政府再不有所作为，那么这些家伙必将煽动起更大的风暴去摧毁美国的一切！不过就是钱解决的事儿，批吧……"

USA_Cleaning_again:0"再一次清扫"
USA_Cleaning_again_desc:0"不过，对着他们怜悯又有什么用呢？千千万万个反抗政府的人，不过终究是被几个别有用心的利己主义者给利用起来-既然是如此，那么将他们抓出来，枭首示众，难道不是对社会稳定的最好帮助吗？威尔逊总统当然想要救助社会，但现在他却无力执行天使的任务，值得拿起手中的枪械，为冥界带来盛宴了。§R反贼们，你们等着，美利坚保证你们每个人脑袋都能开花！§!"

USA_Eradicating_the_Cancer:0"根治毒瘤"
USA_Eradicating_the_Cancer_desc:0"这些人无一例外，我们都可以一一细数他们的罪行。犯下了无知之罪的极端组织，妄想之罪的激进民主“党派”，还有那些一天到晚只是盲目着煽动破坏的左翼团体。\n让我们来看看它们吧，看看他们的所作所为，都是些什么天理难容的人！事实已经证明，§R他们就是美利坚暗藏在深处着毒伤疤和脓疮，他们都应该外科手术式的打击，并且立刻从我们的土地上被清除出去。§!"

USA_Take_care:0"护理伤疤"
USA_Take_care_desc:0"虽然美利坚的国家体量在日复一日的膨胀，但他那骇人的伤疤也随之而愈发溃烂。南北冲突、世界大战、亦或是之前的五大湖红色浩劫，一遍又一遍的冲击这个已经不堪重负的国家，让他脓血直流。威尔逊若想成功取回白宫的政府公信力，就必须得付出行动，先把眼前的这堆烂摊子处理才好。"

USA_Negotiate:0"与协约交涉"
USA_Negotiate_desc:0"自大战结束以来，世界各主要国家就靠着以英法为首脑的“协约国”这一组织团结在一起，共同防卫着所谓“邪恶势力”的反扑。但是随着战后复苏，本应该大快朵颐的美国经济却陷入到了更深的泥潭中：渗透进银行骨头中的金本位无时无刻在限制着美国政府的经济实力以及社会资金流动的能力。我们应与对岸的超级大国展开交涉，试图劝说他们废除金本位，促进世界贸易的真正恢复。"

USA_imprisoned:0"退出禁锢之家庭"
USA_imprisoned_desc:0"可惜，不列颠和法兰西的意见不合，最终导致了计划的全面破产。法兰西在自身难保的状态下也要想方设法将我们制衡在美洲大陆上，英国这个老大帝国自不多说，以自己数量多到无法计算的黄金维持着它的金融霸权-但也必定不会长久。为了摆脱即将到来的困境，同时也是为了摆脱美国现存的问题，我们必须要退出与他们一切相关的国际间组织，包括协约国，以此来更好达到我们的目的。"

USA_money:0 "开动印钞机"
USA_money_desc:0"开动印钞机：印钞机，美国好久没动的东西，现在是时候给那帮英法银行家们一点美元震撼了。虽然通过美元的大量印刷会降低美元的价值，且完全打破了与英镑或者黄金的固定比值-但正是因为这样，我们才能获得源源不断的资金，用来充实我们的国库和社会货币流通；同时，我们也要限制一定的黄金窗口-这需要企业家们的支持。总统相信美国无穷的体量会将这些货币通通吸收，但他也恐惧于南方以及国外势力的极端反应……"

USA_container_gold:0"关上黄金的容器"
USA_container_gold_desc:0"市场上大幅度兑换黄金的事件引起了国际投资者与我国银行储户的不安，市场在这一段时间更加动荡。事实证明，直接用纸钞信用去挑战黄金，在如今来说还是为时尚早的事。既然我们要保证黄金储备，为什么不用国内那些流通的英镑、法郎去购买黄金呢？但就连蠢蛋也看得出来，英法的各大银行不会允许美国以如此大批量的手段去置换黄金，那么，我们只能偷偷的让我们亲爱的企业兄弟去帮我们完成这项任务了……"

USA_Loans_are_issued:0"发放贷款"
USA_Loans_are_issued_desc:0"真是可怜，我们亲爱的1919联邦政府年收入居然只有79亿美元，这笔数目与我国生产总值的比何远远小于其他国家，因此政府也无力利用银行机制大规模发放国家贷款。我们只能求助于美国银行-也就是J.P摩根下属专门为美国政府参与经济活动所设立的所谓“国家银行”。不过，其他的几个财团下属的银行也对我们的计划发出了邀请，可以代替国家银行向社会发放贷款以救助企业，我们将会立即与其开展交涉。"

USA_Morgan_idea:0"摩根的计划"
USA_Morgan_idea_desc:0"一手遮天的银行大亨、视钱如命的投机者、无所畏惧的冒险家、美国版的波留希金，还有那令人瞩目的大鼻子。无论给他什么样的外号，都无法否认约翰.皮尔庞特.摩根以及它背后的摩根财团所拥有的强大实力。作为拥有美国东部最大财团的家族，摩根家族的掌门人早由他的儿子杰克.摩根接任。他给予政府的放贷计划仍然富有古典自由主义精神-通过对国家贷款的完全放开，使得社会面能够充分的吸收流动资金，并利用市场机制促进经济活力。"

USA_Mellon_idea:0"梅隆的方案"
USA_Mellon_idea_desc:0"被称为世界钢铁器官的梅隆家族，掌控着美国绝大多数的优质钢铁和稀有金属加工、精密机器的生产环节，虽然家族实力不如洛克菲勒与摩根，但工业门类早已取代卡内基，成为了美国钢铁的领头羊。凭着现任掌门人安德鲁.梅隆对工业部门的长期考察以及银行业的多年耕耘，他向我们提出另外一种计划-政府当然是以自由主义的形式发放贷款，但更加应该专门侧重于企业以及企业的贷款申报名录，有选择性的去支持一些优良企业淘汰劣势企业，以达到美国经济良性循环的目的。"

USA_Raise_tariffs:0"提高关税"
USA_Raise_tariffs_desc:0"这将是整个经济计划中最为险要的一部分。毫无疑问，提高已经不能再高的美国关税（现28%）将会对本就脆弱的世界经济造成巨大打击，甚至可能会招致其他大国的反制措施，并最终导致美国的产品优势受到削弱。但提高关税最终就是一种对冲机制-北方依靠自给自足的工业体系已经能够与英法同时竞争，越是虚弱的时候则越需要保护。\n提高关税后，全美国整体的英法货币流通量与商品流通量将会减少，这势必会影响到南方这个依赖外部经济的地区，甚至让其再不能起，并最后心甘情愿地被北方所接纳……吗？"

USA_Look_out:0"眺望混沌"
USA_Look_out_desc:0"美国拥有不是全民狂欢的最大宴会，只不过是一张圆桌子上十几个人的小晚会。这就是所谓美国曼哈顿中岛两年一度的“美国企业家联合峰会”，地点设在洛克菲勒名下的一栋大楼里。从1902年开张以来，这栋大楼里蕴藏着无穷无尽的宝藏和拥有他们的企业家，这几乎成为了美国企业的象征之地。如今是1920年的峰会举办周，威尔逊总统派出了副国务卿前去参加会议-此举的目的是为了打听他们的虚实，也顺便了解了解美国经济最真实的面目……"

USA_Promise_space:0"许诺“他们”的空间"
USA_Promise_space_desc:0"没想到这些家伙们居然如此放荡不羁，敢在会上就直接对白宫提出一些要求和建议，要知道副国务卿先生可是以私人身份参加的。\n不过，既然将材料都汇了回来，威尔逊总统自然想好好了解这些老财主们都想在盘算着什么阴谋诡计。不过老洛克菲勒出席会议的消息着实让人震惊，老先生早在十几年前就已经隐退了，今日却重出江湖，若不是重大事变，亦或是暗示威尔逊，谁能够让他拥有现身的动力呢？"

USA_Rockefeller:0"洛克菲勒的理想"
USA_Rockefeller_desc:0"想必不用再多介绍：世界第一石油皇帝，美利坚最大炼油厂与特斯拉工作室的拥有者，最大钢铁厂及最大化工厂拥有者之一的约翰.洛克菲勒先生就这么在自己隐居的庄园里会见了私人到访的威尔逊总统。\n洛克菲勒在隐退前的一系列天马行空般的工业想象当然只是为了他的盈利最大化而吹出的牛皮，但现在他旗下的公司却将他的理想一步步变成现实。或许他将给我们一些意想不到的建议……"

USA_Get_staff_support:0"获取参谋部支持"
USA_Get_staff_support_desc:0"众所周知，美国的军事组织体系历来是要比欧洲落后一些的。经过了漫长数年的扯皮，安斯沃斯将军和鲁特老先生终于在1912年促成了联邦军队陆军参谋部的诞生，大战期间，海军参谋部也最终提上日程。\n参谋部的设立与完善是对我国军事体系的巨大变革，但随着参谋部人员的引进，参谋部却逐渐取代了原来的各类军事部门，成为了话语权最大的军事组织。身为总司令，威尔逊当然要完全争取到参谋部对他的支持，确保枪杆子紧紧握在总统手中。"

USA_Western_Eagles:0"赞扬西部之鹰"
USA_Western_Eagles_desc:0"传奇的潘兴将军，如今仍然在西部“忠实”执行着美国政府的计划。不过，他的指挥体系以及训练方式，确实值得我们东海岸这帮兵痞子一学。在西部将近30年的打磨，使得西部军队成为了美利坚真正的铁军，并且灵活运用参谋部的方式，也使得他们的作战效率更比西部高上一截。我们应该多学习学习潘兴的治军方针，同时也可以借鉴特遣军们的作战风格……"

USA_Limit_the_Knights:0"限制骑士团"
USA_Limit_the_Knights_desc:0"连威尔逊总统都不知道如何评价这个组织了。在90年代以前，他们是令美国政府最为头疼的工人组织-而现在他们却成为了美国政府不得不倚仗的最大民间组织。他们拥有完备的武装组织体系和行政组织体系，并利用先前的宪法修正案四处在城市中播撒自己的种子，代替了各种社区工作以及警察职务去维持社会运转。当然，随着组织的扩大，鱼龙混杂是必然的事，现在就应该敦促各州想个办法，限制一下他们的暴力倾向。"

USA_the_east:0 "扶起东部钢铁之躯"
USA_the_east_desc:0"还是老生常谈的问题。我们不能将国家军队未来的方向交给一个看起来，不能完全放心的将领。\n威尔逊仍然要利用东部的总参谋部并亲自下手，通过改革参谋部人员配置以及行动机制来提高联邦军队的作战效率。同时，联邦军队也应该要充分利用美国北方工业区的区位优势，在批准了更多的军事经费后。采购更多、更现代化的武器装备-尤其是坦克与飞机，把东部军队打造成实实在在的钢铁之师。"

USA_Finally:0 "让我们再去迎接他……"
USA_Finally_desc:0"哦，亲爱的托马斯·伍德罗·威尔逊先生。您现在貌似已经在总统选举中败给了您的“下属”哈定先生了呢？不过，您为他未来铺好的路，似乎将会发挥出无法想象的功效。未来的路究竟是怎么样的呢，§R就在即将开启下一个总统的任期中去寻找答案吧！§!"