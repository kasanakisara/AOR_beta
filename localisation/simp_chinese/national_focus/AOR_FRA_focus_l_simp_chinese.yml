## Poincare & Clemenceau
 AOR_FRA_after_the_war:0 "大战之后"
 AOR_FRA_after_the_war_desc:0 "没人希望回忆战争中哪怕一丝一毫的细节，可我们不能欺骗自己，必须正视现实问题。如果我们想制霸欧陆，就需要对祖国血淋淋的伤口进行包扎。是时候从混乱的泥淖中拔出腿来了。\n"
 AOR_FRA_The_sorrowful_passing:0 "悲痛的已逝"
 AOR_FRA_The_sorrowful_passing_desc:0 "尽管我们对为法兰西付出血汗的战士报以哀悼和尊敬，可我们需要向前看，死者是为了生者的幸福而牺牲的。现在，开始工作吧。\n"
 AOR_FRA_Compassionate_towards_the_living:0 "怜悯生者"
 AOR_FRA_Compassionate_towards_the_living_desc:0 "我们不能再将我们的孩子因一两个人的愚蠢而送上战场，广泛人民对和平的渴望是一场洪流，我们唯一能做到顺应她\n"
 AOR_FRA_Clearing_war_debts:0 "清算战争债务"
 AOR_FRA_Clearing_war_debts:0 "不得不承认的是，法兰西的胜利离不开国内外的贷款支持。不论他们出于何种理由，他们都算我们的战友，应当获得应有的待遇。\n"
 AOR_FRA_Mourning_for_the_deceased:0 "哀悼死者"
 AOR_FRA_Mourning_for_the_deceased_desc:0 "战争中，大量法兰西的好男儿永远离开了我们，我们需要做出回应。不仅仅是在口头上表示敬意，还需要给予饱受离别之痛家庭应有的补偿。\n"
 AOR_FRA_Clean_up_the_battlefield:0 "清扫战场"
 AOR_FRA_The_Future_of_Waves:0 "浪潮的将来"
 AOR_FRA_The_Future_of_Waves_desc:0 "新世纪给我们准备了一份大礼———一场残酷的大战，以及随之而来的无数争端与纠纷。法兰西仍然挺立欧陆，现在，阻挡他前进的只剩下海对岸的敌人。上一次，在他们的干涉下，法国大败而归；这一次，法国将全力以赴将一切失去的全部夺回。\n法兰西必将立于欧洲潮头之上！\n"
