PER_a_national_martyr_0:0 "国殇"
PER_Northern_Reconstruction_2:0 "北方重建计划"
PER_Northern_Reconstruction_2_desc:0 "我们北方的国境曾遭受到俄国铁蹄的蹂躏，尔后又在伊朗内战中遭到进一步破坏。因此，重建我们北部的国土，尽快恢复人民的正常生活更是当下工作的重中之重。根据会议做出的指示，我们将在不同的地区分步分批次开展专项工作，以确保重建工作得到有效的推进。"
PER_Preliminary_government_reform_6:0 "初步政府改革"
PER_Infrastructure_restoration_7:0 "基础设施重建"
PER_Infrastructure_restoration_7_desc:0 "要重建农庄与工厂，要恢复旧有的生产秩序，我们就必须设法把各种配套设施完善。道路，电网，铁道，机场，等等。在有序而高效的运行下，我们将把修复所需时间控制在两个月左右，也许只需一个多月。整个波斯都等待着新的工厂的轰鸣声。"
PER_civil_construction_team_22:0 "民间施工队"
PER_civil_construction_team_22_desc:0 "我们相信，民间的技术人才也能胜任国家重建的工作。他们是我们的父母，兄弟，姐妹，是万千波斯同胞中的一员。虽然此举相对冒险，很多施工人员的专业技能掌握尚且不成熟，但在这次大规模的实地作业后，这些积累了第一手经验的技术人员们定能成为建设国家的中流砥柱。"
PER_UK_companies_23:0 "英国企业"
PER_UK_companies_23_desc:0 "重建国家事关重大，这其中许多的经验是我们日前所研习不了的。而英国人却能解决这一难题，他们可以给出科学的、令人满意的方案，并以曾令世界为之惊叹的效率完成工作。虽然这实际上给予了他们特权，但重建工作毕竟是燃眉之急。特事特办吧。"
PER_receive_Russian_funded_factories_8:0 "接收俄资工厂"
PER_receive_Russian_funded_factories_8_desc:0 "俄国内战爆发后，那些俄国投资建立的工厂自然而然地被宣布放弃了。这正是我们收回它们的大好时机。来自俄国的生产设备也许不尽先进，但确实可堪一用。更多的工厂——这不但令我们的重建工作能得到长足的加速，某种意义上也预示着俄国影响在波斯的消亡——也许只是暂时的"
PER_ume_oduction_29:0 "恢复生产"
PER_ume_oduction_29_desc:0 "沙皇与沙阿的遗产为国家的重建奠定了物质基础，使得生产生活的快速恢复成为可能。在此基础上，除了有计划地恢复各地产业，还需要在此基础上进一步优化产业结构，提升生产效率——这不但能有力地推动国家的重建，对各大产业的未来也大有裨益。"
PER_Loss_statistics_9:0 "损失统计"
PER_Loss_statistics_9_desc:0 "我们必须把这混乱的十年间经受的所有损失全部进行统计——大至一片领土，小至一座土房。每一个数据都意味着可怕的损失，它警醒着每一个人去抵制那无意义的绞肉机，而把自己的生命奉献在祖国的建设上。"
PER_Resettlement_Plan_33:0 "安置百姓"
PER_Resettlement_Plan_33_desc:0 "古老的埃兰沙赫尔又一次面临着粮食危机——恰恰是在一战之后。大批的田地被废弃，难民们自北方涌向南方城市群。对于这些失去土地的农人来说，如何把他们安顿下来便成为了重要问题。为了国家稳定与发展，是时候安置好这些难民了。"
