SWE_Karl_Plan_catagory_desc:0 "我国的联邦中，挪威是工业化程度相对较低的地区。我们需要通过一些“特殊手段”，比如计划经济，或者是牺牲资本家的利益来实现这些地区的快速工业化，从而使得联邦更加稳定。虽然此举势必会遭到资本家的反对，但是仍然需要进行。\n\n目前瑞典议会的态度为：§B[?SWE_Sweden_Parliament_Attitude|1]§!\n\n目前挪威议会(斯托庭）的态度为：§R[?SWE_Stortinget_Attitude|1]§!\n\n目前的民族团结度为：§Y[?SWE_NationalUnity|1]§!\n\n过低的民族团结度将会导致信任危机，以至于计划的彻底崩溃。而较高的民族团结度将会使得计划更为顺利的进行。"
