#By Jim Lawrence Hacker
## SWE_Union.txt
SWE_Holy_Union:0 "神圣联邦"
SWE_Holy_Union_desc:0 "瑞典-挪威联合王国，神圣而伟大，值得被每个公民铭记!"
SWE_Rebuild_Army:0 "重建军队"
SWE_Rebuild_Army_desc:0 "如今我国正受到前所未有的威胁，我们需要打起十二分精神，重新建立起我们伟大的军队，抵抗那些可预见或是不可预见的威胁。"
SWE_Throw_Olive_Branch:0 "投出橄榄枝"
SWE_Throw_Olive_Branch_desc:0 "对于我国的工业化计划来说，广阔的海外市场是十分重要的。我们可以通过一些“不受待见的国家”出口我们的工业产品来获得大量的资本资助我国的工业化。"
SWE_Manhunt:0 "§R大搜捕§!"
SWE_Manhunt_desc:0 "左派都是一群阴谋论分子，他们邪恶的阶级叙事严重威胁了联邦的稳定。为此，我们的解决办法只有一个：抓住他们、打压他们、杀死他们。"
SWE_Bergen_Law:0 "卑尔根法"
SWE_Bergen_Law_desc:0 "我们需要一部法律来约束那些无法无天的左派分子们的行为，给予我们逮捕和处决他们的合法理由。此时，制定一部新的《卑尔根法》，继续限制他们的自由就变得尤其重要和有用了。"
SWE_Turn_Right:0 "向右派致意"
SWE_Turn_Right_desc:0 "右派是一个泛指的名称，其中包括了很多保守的思想。如果我们要打压左派，团结它们将变得必不可少，也就是驱虎吞狼。"
SWE_Oslo_Trial:0 "奥斯陆特别法庭"
SWE_Oslo_Trial_desc:0 "如今我们抓住了一批又一批为非作歹的左派分子，是时候让他们感到妖言惑众的代价了!"
SWE_Policy_Debate:0 "议会论争"
SWE_Policy_Debate_desc:0 "很明显，我们的国家内有很多的人民仍然信奉着错误的左派观点，是时候拨乱反正，让他们重回联邦的拥抱了。"
SWE_Ban_Left_Newspaper:0 "封禁左翼报纸"
SWE_Ban_Left_Newspaper_desc:0 "长期以来，社会上的左派言论层出不穷，一定程度上都是因为有一些左派报纸作为他们的喉舌。如今在封杀左派的这一伟大计划中，查禁他们是必需的!"
SWE_Night_Long_Knives:0 "长刀之夜"
SWE_Night_Long_Knives_desc:0 "一大帮左派分子仍然在我们的首都斯德哥尔摩乱晃，是时候给他们一些惩罚了!"
SWE_Abandon_Sozialdemokrat:0 "枯萎的玫瑰"
SWE_Abandon_Sozialdemokrat_desc:0 "如今，在打压左派的行动中，社会民主主义分子已经被证明为不可靠人士了。是时候对他们也进行狙杀了。"
SWE_Karlstard_Plan:0 "§B卡尔斯塔德计划§!"
SWE_Karlstard_Plan_desc:0 "卡尔斯塔德计划是我们国家的根本性国策。通过牺牲资本家的一些利益来换取我国的工业化，进而让联邦更加稳定。"
SWE_Focus_France_Import:0 "盛开的鸢尾花"
SWE_Focus_France_Import_desc:0 "法兰西第三共和国已经被证明为可靠的商业伙伴，通过和他们进行贸易，我们可以在工业方面得到先进的成果。"
SWE_Focus_British_Import:0 "遥望北海彼岸"
SWE_Focus_British_Import_desc:0 "不列颠帝国和我们隔着北海相望，我们可以在与他们的贸易中得到大量的好处，从而资助我们的工业化。"
SWE_Stockholm_Meeting:0 "斯德哥尔摩会议"
SWE_Stockholm_Meeting_desc:0 "为了我们国家的工业化事业，我们已邀请了一批又一批的资本家齐聚斯德哥尔摩，探讨要我国的工业化大计。"
SWE_Industry_Research:0 "趁手工具"
SWE_Industry_Research_desc:0 "我国可以在工业的各个方面展开一系列的研究，这些研究会显著的加强我国的工业化水平和速度。"
SWE_Bergen_Industry:0 "卑尔根工业区"
SWE_Bergen_Industry_desc:0 "卑尔根，挪威第二大城市，面对大西洋。如果我们在这里建立一个工业区，势必会对我国的经济有重大好处。"
SWE_Oslo_Industry:0 "奥斯陆工业区"
SWE_Oslo_Industry_desc:0 "奥斯陆，挪威首府和最大城市。这里将是我们工业化的重中之重，她必定会成为斯堪的纳维亚半岛上最优雅的明珠!"
SWE_Develop_North:0 "开发北部"
SWE_Develop_North_desc:0 "我国的北部地区绝大多数都是山脉和冰雪，如果能够开发利用，会对我国的矿产开发百益而无一害。"
SWE_Twilight_Approach:0 "暮色将至"
SWE_Twilight_Approach_desc:0 "旧时代的封建帝国的黄昏已经接近，我们必须要从一个封建的王国转变成一个宪政自由的国家，才能让我们的资本更加蓬勃发展。"
SWE_tt:0 "哈康将不能再干涉议会和首相选举。"
SWE_1921s_Election:0 "1921年选举"
SWE_1921s_Election_desc:0 "又一个选举年逼近了，我们要开始准备为1921年的选举做准备了。"
SWE_Focus_Attack:0 "关注进攻"
SWE_Focus_Attack_desc:0 "进攻是最好的防御，此言不假。如果能够在战争中通过进攻掌握主动权，我们定能取得胜利。"
SWE_Research_Airplane:0 "研究飞机"
SWE_Research_Airplane_desc:0 "飞机，这一来自新大陆的发明改变了战争中的许多因素。如果能在这场关于飞机的科研研究中取得先手，我们在军事领域将会拥有极大的优势。"
SWE_Focus_Defence:0 "关注防守"
SWE_Focus_Defence_desc:0 "防御在军事领域中有着重大的意义，而且我国在东部的地区绝大多数是山区，可以有效抵御来自东方的红色威胁。"
SWE_Research_Artilery:0 "研究火炮"
SWE_Research_Artilery_desc:0 "火炮在世界大战中被证明为进攻和防守中都无比重要的武器，这也意味着我国的强军事业必须发展火炮。"
SWE_Take_No_Side:0 "骑墙"
SWE_Take_No_Side_desc:0 "对于瑞典来说，无论是倾向英法中的任意一边都是不理智的。更广泛地说，倾向资本主义世界也是不明智的。我们需要关注一些不太可能的贸易伙伴，比如······俄罗斯苏维埃社会主义共和国？"
SWE_Help_Soviet:0 "帮助苏俄"
SWE_Help_Soviet_desc:0 "苏俄是我国在东部边境上的邻居，他们此时正处于缺乏支持的环境下。如果我们能向他们出售工业品，会对我们的工业化有重大益处。"
SWE_Hedge:0 "双面下注"
SWE_Hedge_desc:0 "希腊和土耳其随时会大战一场，我们可以通过向双方出售武器赚取丰厚的利润。"
SWE_Sell_Arms:0 "出售武器"
SWE_Sell_Arms_desc:0 "各国随时会爆发战争，向他们出售武器无疑是利益丰厚的。"
SWE_Miltary_Education:0 "军事教育"
SWE_Miltary_Education_desc:0 "为了帮助我们的朋友打赢他们的战争，我们可以向他们传授军事技术。虽然这些技术可能比不上英法，但对他们来说无疑是很重要的。"
SWE_Industry_Support:0 "工业援助"
SWE_Industry_Support_desc:0 "我们可以通过向我们的朋友出售工业品和支援他们的工业化进程来使得我国的资本对外的市场大幅增加。"
SWE_Resource_Support:0 "资源援助"
SWE_Resource_Support_desc:0 "许多国家都缺乏资源，我国可以通过出售资源来获得利润。"
SWE_Research_Support:0 "科研援助"
SWE_Research_Support_desc:0 "由于战乱，盟友们的科技研究停滞不前，大量人才逃至我国。我们可以通过在科研上帮助他们，让他们拥有更加新型的装备。"
SWE_Nonaggression_Treaty:0 "签订互不侵犯条约"
SWE_Nonaggression_Treaty_desc:0 "我们对我们的朋友们的援助绝大多数是保密的，并且对他们起了很重要的作用。签订互不侵犯条约将会使得我们的关系更加紧密。"
SWE_Norweign_Line:0  "挪威防线"
SWE_Norweign_Line_desc:0 "为了抵御东部红色势力的威胁，参谋部决定在挪威东北部的山区修建一条防线。"
SWE_Superior_Fire:0 "优势火力"
SWE_Superior_Fire_desc:0 "优势火力学说，就是指通过持续的轰炸和炮击，达到摧毁敌人的防线效果的军事理论。现如今，人命关天，但子弹价廉。"
SWE_Depth_Defence:0 "纵深防御"
SWE_Depth_Defence_desc:0 "纵深防御理论，就是通过多条间隔一定距离的防线来阻挡敌军进攻的军事理论。这种理论在世界大战中得到了充分检验，是时候运用了。"

##SWE_Emergency.txt
SWE_Emergency_Country:0 "危难关头"
SWE_Emergency_Country_desc:0 "如今我们的国家处于危难关头，我们要竭尽全力维护我们的联邦!"
SWE_Emergency_Law:0 "紧急法案"
SWE_Emergency_Law_desc:0 "通过制定一部紧急状态法，我们可以有效地重建国家的秩序。"
SWE_Kill_Left:0 "镇压左翼"
SWE_Kill_Left_desc:0 "我国境内的一些左翼分子已经跃跃欲试下，想要颠覆政权。他们绝对不会得逞的!"
SWE_Speech_Regulation:0 "言论管制"
SWE_Speech_Regulation_desc:0 "社会上有许多的言论正在危言耸听。为了稳定民心，是时候封上他们的嘴巴了!"
SWE_Build_Junta:0 "建立军政府"
SWE_Build_Junta_desc:0 "军队是政府的三头犬，通过在各地建立军事管制政府，可以有效增加社会稳定度。"
SWE_Planned_Economy:0 "计划经济"
SWE_Planned_Economy_desc:0 "虽然实行计划经济会被质疑为社会主义，但是在现行体制下，这将是十分必要的。"
SWE_Focus_International:0 "寻求国际援助"
SWE_Focus_International_desc:0 "如今社会上的问题，绝非凭借着我们的一己之力可以解决的。我们需要在国际上寻找盟友。"
SWE_Need_France:0 "寻求法国援助"
SWE_Need_France_desc:0 "法国作为世界上第二大的资本主义国家，如果我们向他们请求援助，他们肯定会帮助我们的。"
SWE_Need_British:0 "寻求英国援助"
SWE_Need_British_desc:0 "英国是世界上最大的资本主义国家，他们肯定会帮助我们解决现在社会上的糜烂局势。"
SWE_Sign_Treaty:0 "签订贸易协定"
SWE_Sign_Treaty_desc:0 "曾经在哈康时代的旧贸易条约已经被废止了，我们需要重新通过与外国的贸易协定振兴我们的经济。"
SWE_Miltary_Support:0 "请求军事支持"
SWE_Miltary_Support_desc:0 "我国的反社会分子愈发猖狂起来，我们要通过请求外国的军事支持来镇压他们!"
SWE_Economy_Support:0 "请求经济支持"
SWE_Economy_Support_desc:0 "我国的经济形势正在因为越发不可收拾的社会动乱而一落千丈。通过请求外国的贸易支持，我国得以有效解决经济问题。"
SWE_Rebuild_Order:0 "重建秩序"
SWE_Rebuild_Order_desc:0 "在持续的治理之后，是时候重新建立我国的正常秩序了。"
SWE_Find_New_King:0 "新王归来"
SWE_Find_New_King_desc:0 "如今绝大多数问题都已解决，是时候解决最后的问题了：我们的国王!"

##SWE_Rupprecht.txt
SWE_Kingdom_of_Rupprecht:0 "鲁普雷希特陛下的王国"
SWE_Kingdom_of_Rupprecht_desc:0 "鲁普雷希特一世·维特尔斯巴赫，伟大的瑞典-挪威联合王国国王、巴伐利亚国王、法兰克尼亚和士瓦本公爵，莱茵行宫伯爵，已降临在我们身边。他将引领着联邦走向辉煌!"
SWE_Rebuild_Glory:0 "重塑荣光"
SWE_Rebuild_Glory_desc:0 "伟大的鲁普雷希特一世陛下已经提出了一个神圣的计划————击败丹麦，重铸卡尔马联邦的荣光!"
SWE_Karl_IIX_Plan:0 "卡尔十二世计划"
SWE_Karl_IIX_Plan_desc:0 "卡尔十二世被誉为瑞典帝国的拿破仑，如今我们以他的名字命名打败丹麦的计划。"
SWE_NEuro_Propaganda:0 "大北欧主义宣传"
SWE_NEuro_Propaganda_desc:0 "大北欧主义，或者说泛北欧主义，是一种认为北欧民族应当团结一致的理论。通过在我国境内进行宣传，可以让我国民众更加服从重铸荣光的伟大事业。"
SWE_Prequisites_Support:0 "请求支持"
SWE_Prequisites_Support_desc:"通过请求英法的支持，我国的军事行动会更加顺利。"
SWE_Instigate_Rebellion_Denmark:0 "策动丹麦政变"
SWE_Instigate_Rebellion_Denmark_desc:0 "作为计划的一部分，如果我们的军事行动并不顺利，丹麦境内的反对派就会发动政变，夺取政权，以让我们的计划顺利实施。"
SWE_Force:0 "强迫丹麦服从"
SWE_Force_desc:0 "时机已经成熟，我们可以通过我们的威权强迫丹麦进行一场我们必定会胜利的“选举”。如果他们愿意识相的屈从，或许可以饶他们不死；但如果他们选择反对······"
SWE_Close_Capitalism:0 "亲近资本主义国家"
SWE_Close_Capitalism_desc:0 "曾经，在哈康政府的支持下，我国和许多非主流的国家进行了贸易来往。如今这些行为被证明为毫无益处的，是时候改变风向了。"
SWE_Goteburg_Meeting:0 "哥特堡会议"
SWE_Goteburg_Meeting_desc:0 "为了应对新时代的环境，团结资本主义国家群体，是时候召开一场资本主义世界峰会了。"
SWE_Tariff_Free_Agreement:0 "签署自贸协定"
SWE_Tariff_Free_Agreement_desc:0 "自由贸易对于资本主义市场是有着一定作用的。过去，过高的关税壁垒作为冷战的产物，严重影响了我国的经济市场。现在，是时候拆掉这座围墙了。"
SWE_Occupy_North_Finland:0 "占领芬兰北部"
SWE_Occupy_North_Finland_desc:0 "作为一个红色国家，芬兰严重影响了我国的东部边防。是时候施展我们的铁拳了。"
SWE_Kingdom_Axis:0 "王国轴心"
SWE_Kingdom_Axis_desc:0 "我国和英国隔北海相望，或许可以结成强大的联盟。"
SWE_New_Kalma:0 "新卡尔马联邦"
SWE_New_Kalma_desc:0 "卡尔马联邦，一个曾经的梦想，如今将重新实现!"


