##SWE_Event.txt
SWE.1.t:0 "抗议"
SWE.1.d:0 "斯德哥尔摩已有数万人走上街头，抗议联邦的诸多不平等。警察试图维持秩序，无果，转变为一场大型危机。"
SWE.1.a:0 "这群混蛋!"
SWE.2.t:0 "奥斯陆刺杀"
SWE.2.d:0 "怡人的风自由的穿梭在一座座楼房之间，鸟儿的啼叫声通过令人爽朗的空气传到了每个王国公民的耳中。今天的瑞典的空气是葡萄酒味的，整个国度都被粉刷匠们漆上了粉红色。当清晨的第一缕阳光照射入埃沃尔的宅邸的时候，埃沃尔正在与自己的妻子享用早餐，当埃沃尔咽下最后一片夹着草莓酱的吐司后，他们便手挽着手出门去了。\n\n这是一个难得的休假，埃沃尔正好利用这一“王国的情人节”来兑现他和妻子画饼了许久的约会。他们走上奥斯陆的大街，城里竟然罕见的和谐了起来，那些时常罢工的瑞典可怜虫们今天已经消失不见，用报纸做被的流浪汉们也被警察驱逐的一干二净。瑞典与挪威的国王!哈康七世即将巡视这做城市，并发表情人节演讲!埃沃尔看着广场上的告示，十分满意自己的这位国王是一位浪漫之人。在这个年头，能有这样的国王属实是个幸事：德意志人早就迷失在了内战之中，美利坚人还在为着自由和独立而战，而他们瑞挪联合王国的合并为国王的子民们带来了长久的和平，埃沃尔的报社生意也能继续做下去。想到这里，埃沃尔便喜悦到难以自己了，他的国王为他带来了多少惊喜啊!他赶快亲吻了一口自己的妻子，这时的她是那么的贤惠且端庄，就像八月的晚风一样迷人。绝对不出一年，埃沃尔的事业就可以更上一层楼，而他也可以带着孩子离开奥斯陆，去买一栋与世隔绝的大房子，对，就在冰岛!和他那孩子一起看日出日落，度过每一个难忘的瞬间……\n\n当埃沃尔从想象中抽身出来的时候，尊敬的哈康国王已经在他的视线中了。没错，他那伟大的国王正和他那动人的妻子一同乘马车过来，道路两旁是遍地的鲜花，人群们早就簇拥在街道旁观望着这位国王。埃沃尔马上就反应了过来，赶忙牵着妻子那布满老茧的手，挤到了人群的最内部。“我亲爱的子民们!大家情人节快乐!在这美好的一天中，与自己的所爱之人尽情的相拥吧!”哈康挥舞着帽子，笑容满面的看着两侧的人们，随后便深深拥抱了自己的妻子，再加以浪漫的法式湿吻，人群中传来巨大的欢呼声与喝彩声，整座城市都洋溢着幸福。埃沃尔一把搂过自己的爱人，无声的笑着，埃沃尔敢打包票，这绝对是他最开心的一天之一。\n\n一声枪响。\n紧接着是稀稀拉拉的无数声。\n\n人群中的欢呼声突然变成惊恐的尖叫声，这个联合王国的国王在亲吻他妻子的一瞬间被一颗子弹传颅而过。有人开始不断的向人群中射击，人们四散而逃，浪漫的歌舞剧突然在此刻变成了一部烂俗的恐怖片。\n\n埃沃尔看着自己血肉模糊的胸口，在看看自己惊恐到面部已经扭曲的妻子。他到底该说些什么好呢？他努力回想自己妻子的名字，可好像怎么也想不起来了。他将因关心而扑向她的妻子一把推倒，转而向哈康的方向奔去，他没多少力气了，重重的倒在了半路上，在丧失意识前的最后一秒，他的视线与哈康对上了。\n\n哈康呆滞着看着埃沃尔的尸体，随后转身看向自己的妻子，深深的吻了下去。"
SWE.2.a:0 "永别了，吾爱。"
SWE_Hakoon_Death_tt:0 "§R随着哈康之死，瑞典最混乱的时代拉开序幕······§"
SWE.3.t:0 "我们的新王"
SWE.3.d:0 "鲁普雷希特·维特尔斯巴赫的生命之中，从来没有像现在一样如此兴奋，虽然他此刻正端坐在幕布后方，聆听着宰相的演说，脸上的神情如同被冻结了一般。身穿着厚重的王袍，手握着象征权力的手杖，似乎历史的使命已经赋予在了他的肩头之上。而他颠簸流离半生，从未像此刻一般如此恐慌。\n这一切都将从头说起。世界大战爆发的那一天起，鲁普雷希特就明白他的国家正在走向崩溃。和英法奥的全面交战几乎是不可能胜利的，而事实也证明确实如此。革命爆发了，他父亲的巴伐利亚王国灰飞烟灭，自己也被迫躲藏在奥地利的一家小酒馆里躲过追捕。那时的他荣光尽损，失去了旧日的荣华才让他立下志愿，自己将会铲除这世上所有的布匪。后来他辗转多个国家，在英国他被首相召见，英国政府希望他出任瑞典·挪威联合王国的国王，以此缓和当前瑞典的局势，避免左翼夺权。但此后瑞典的外交政策需要由英国所左右。\n鲁普雷希特沉思甚久，这时首相说道：“不用担心，我们会保证您的安全，也会为剿灭布匪提供足够的援助，请您支持我们。” \n\n“以一个国家的自由为代价，这值得吗？” \n“这要看您怎么说了。” \n\n后来，他在那份协议上签下了自己的名字，成为了瑞典王位的继承人。与他沉思之时，一位王室佣人走到他面前，说道：“时间到了，陛下。”鲁普雷希特怔了一下，这是他第一次被别人称为“陛下“。但他整理了自己的衣冠，说道：“我准备好了。”接着大踏步走出了幕布后方，就像军人一样。\n他此刻已经了然自己内心所想，那份心意自从他在伦敦签下那份协议之后就已明确："
SWE.3.a:0 "“我将保卫联邦，直至生命结束。”"
SWE_Great_Kalma_and_His_Majesty_Rupprecht_I_s_Loyal_Party:0 "瑞典大卡尔马联邦和鲁普雷希特陛下忠诚的联盟党"
SWE_Kingdom_Party:0 "瑞典王党"
SWE_Rupprecht_desc:0 "鲁普雷希特一世，蒙上帝洪恩的瑞典-挪威联合王国国王、巴伐利亚国王、法兰克尼亚和士瓦本公爵和莱茵行宫伯爵，已经降临世间。\n作为曾经的维特尔斯巴赫家族公子，鲁普雷希特的青年是在养尊处优的巴伐利亚王宫里度过的。他在成年后成为了德军总参谋部的一位将军，挫败了法军试图收复阿尔萨斯-洛林的“第十七号计划”，因此也被誉为“世界大战中最伟大的王室将军”。\n可是就在帝国风光无限时，可恶的布尔什维克分子发动了革命，摧毁了帝国。鲁普雷希特和一些维特尔斯巴赫家族成员逃离了巴伐利亚，开始在欧陆流浪。他们先后逃到了荷兰、法国，最后是英国。在这段期间，鲁普雷希特坚定了他的志向：摧毁世界上所有的赤色分子，重新赢回那本应属于他的王位。如今他受到邀请，成为了瑞典的国王，他的夙愿也实现了一半。\n\n§R是时候毁灭这帮无法无天的家伙了!§!"
SWE_Destruction_tt:0 "§Y随着以布兰亭为首的紧急委员会宣告终结，瑞典陷入无休止的战争和黑暗之中。北欧雄狮，低下了它的头颅。§\n\n§R感谢您游玩Aurora of Red:rise from ruins，正义和秩序已经背离瑞典，无数恐慌的民众将自生自灭。\n\n下一次，还是不要毁灭的好。§"
SWE_Anarcho_tt:0 "§R计划失控，安那其分子已经掌控了奥斯陆······§"
SWE_Absolutism_tt:0 "§R这帮农民······§"
SWE_Confidience_Crisis_tt:0 "§R信任危机，拉开序幕······§"
SWE_Jim_Lawrence_Hacker_desc:0 "§R没有人知道他从哪里来，也没有人知道他往哪里去······除了他自己。§!\n\n吉姆·劳伦斯·哈克，他总是自称自己是“极光之神的奴仆”和“神明大人身旁最忠诚的自由平等战士”，虽然所有人都知道他是一个明显不过的共产主义者，但他执政的政策仍然是依托在超验的神学上的。特别是他推行的哈克主义，可以认为是列宁主义的一种分支，在宣传时更是突出了神秘色彩。\n事实上，他本人也是无比神秘的，没有人知道他来自哪里，有人说他是斯德哥尔摩的德裔移民，有人说他是俄罗斯的间谍，有人说他是上帝派来消灭罪恶的斯堪的纳维亚半岛的使者。他对于这些猜测从不承认或否认，因为只有他知道，他是§Y这个世界的缔造者之一。§!他对自己创造的这个世界起了兴趣，于是来到了这里，向着“赤色极光”，这个众神明一致的愿望前进。\n\n§R既然你得知了这个秘密，很抱歉，你的生命就此结束。§!"
SWE_520_tt:0 "§R神明降临······§!"
NAA_Anarcho_Committee_desc:0 "奥斯陆安那其组织是一个安那其团体，这个团体最开始由一些工厂的工人联合组成工团主义性质的组织，后来演变为一支安那其主义的武装。我们不需要什么神仙皇帝，因为我们就是自己的超人。"
SWE.4.t:0 "斯德哥尔摩会议————第一轮"
SWE.4.d:0 "如今我们终于可以召开这场决定我们未来经济的会议了。我们应该采取更加保守的福利国家政策，还是拥抱全面的自由市场呢？"
SWE.4.a:0 "把那些激进的想法都扫进垃圾堆吧!"
SWE.4.b:0 "让那帮智障保守派去吃屎吧!"
SWE.5.t:0 "斯德哥尔摩会议————第二轮"
SWE.5.d:0 "关于瑞典和挪威的经济一直有一些分歧。我们应该将我们的经济保护倾向瑞典还是挪威呢？"
SWE.5.a:0 "我们应当保护弱势群体"
SWE.5.b:0 "保持瑞典的宗主国权威"
SWE.6.t:0 "斯德哥尔摩会议————第三轮"
SWE.6.d:0 "在我们的外贸上面，我国旗帜分明的分为了两派：由哈康陛下领导的亲苏派，和由首相布兰亭领衔的亲英法派。我们该将政策倾向何方呢？"
SWE.6.a:0 "投向新的市场"
SWE.6.b:0 "捍卫旧的盟友"
SWE.7.t:0 "斯德哥尔摩会议————闭幕"
SWE.7.d:0 "如今我们终于可以宣布斯德哥尔摩会议结束了，陛下将颁布斯德哥尔摩敕令，指导我国的经济。"
SWE.7.a:0 "联邦万岁!"
SWE.9.t:0 "议会改组"
SWE.9.a:0 "日薄西山，旧日的妥协记忆也应该消散了。"
SWE_Abandon_Sozialdemokrat_tt:0 "社会民主主义的瑞典政府就此退出历史舞台，现在是保守主义者的愉快时间。"
SWE_Rupprecht_I_tt:0 "我们的新王，至此归来······"
SWE.10.t:0 "奥斯陆审判"
SWE.10.d:0 "“这是针对左派分子有史以来最大规模的迫害。”苏俄《真理报》记者谢尔盖·克拉沃斯维奇·维尔罗夫如实报道。\n此言不虚。数千名以“叛国”或“危害国家秩序”为罪名的左派人士或共产党员从奥斯陆广场的东边走来，在军警的催促下排成一个方阵。他们面前是一个高台，上面端坐着瑞典和挪威的国王，哈康七世。随着九时整的钟声敲响，哈康宣布审判开始。\n“这些人被分批传唤到高台之下，他们连辩护的权利都没有，就被台上危襟正坐的哈康宣告了罪名。从上午九时到下午三时，他们就只是被叫到台前，然后宣告罪名，接着被押走。等待他们的就是被处决。”维尔洛夫的笔下，是这场迫害的冰山一角。在持续超过半年的大搜捕之下，超过一万名瑞典左派和八千名挪威左派被抓捕，其中一半人不经审判就被处决掉了。“这不是一个法治国家该有的样子，这是彻底的对左翼的无理由迫害，这是应当受到谴责的。”《真理报》在高呼，但这改变不了任何事情了。北欧的左翼几乎在这场屠杀中被消灭殆尽，哈康终于重新坐稳了他的王位。只是，这是由尸山血海堆积而成的。"
SWE.10.a:0 "他们管那么多干嘛?"
SWE.11.t:0 "长刀之夜"
SWE.11.d:0 "一个无眠之夜。\n“数万的军队自四面八方涌来，包围了瑞典共产党的总部。他们在收紧包围圈，将这座大楼包裹在内。他们在冲锋，他们在扫射，他们在屠杀左翼。雪亮的长刀让整栋大楼生灵涂炭，而官方没有任何回复。面对着受害者亲属的质问，他们沉默而不回答，但那些人已经永别了。”这是各国左翼报纸统一的头条。瑞典军队动用致命性武力的攻击，消灭了瑞典共产党大多数高层，但政府拒绝承认此事存在。“什么也没有发生，什么也没有。”政府的发言人于今天早上声明，“所谓屠杀左派的言论是不真实的。”但各界都对此持怀疑态度。"
SWE.11.a:0 "权宜之计。"
SWE.12.t:0 "1921年选举结果"
SWE.12.d:0 "在1921年的议会选举中，王党取得了瑞典议会300席中的246席和斯托庭250席中的215席，成为了议会第一大党，而其党魁卡尔·亚尔马·布兰廷成为了首相。"
SWE.12.a:0 "天佑联邦!"
SWE_Election_tt:0 "§G陛下的王党大获全胜!§!"
SWE.13.t:0 "左翼发言人"
SWE.13.d:0 "这些左翼的喉舌正在议会里大放厥词，说“封建君主和可恶的资本家们阻碍了社会的发展，应当消灭他们。”这不是在放屁吗？"
SWE.13.a:0 "将他赶下台!"
SWE.13.b:0 "反驳他"
SWE.14.t:0 "铺天盖地的报道"
SWE.14.d:0 "铺天盖地的报纸都在报道我们的“光荣事迹”，民众对我们的信任下降，我们失败了。"
SWE.14.a:0 "啊？"
SWE.15.t:0 "预算会议"
SWE.15.d:0 "在议会内召开的预算会议上，一批左翼分子主张通过削减国家预算来资助我国的工业化事务，并且称“联邦超过百分之八十的预算全部拿来喂狗了，或者是养那些尸位素餐的议员，一点用没有!”很明显，有些人很愤怒。"
SWE.15.a:0 "这是一派胡言!把他赶出去!"
SWE.15.b:0 "或许平衡一下预算是必要的······"
SWE.16.t:0 "一次审判"
SWE.16.d:0 "一个左翼分子落入了我们的手上，他因为盗窃被移交我们审判。我们该如何审判他？"
SWE.16.a:0 "判处死刑，以绝后患!"
SWE.16.b:0 "判处监禁并剥夺政治权利"
SWE.17.t:0 "尾声"
SWE.17.d:0 "我们最终还是赢得了属于我们的胜利，民众对我们的信任逐渐增加。"
SWE.17.a:0 "好极了!"
SWE.18.t:0 "瑞典向我们寻求援助"
SWE.18.d:0 "瑞典政府目前向我们寻求援助，他们声称自己的国家已经处于动荡之中，很容易被左翼政府夺取权力，希望获得我们的援助。"
SWE.18.a:0 "他们想要什么，都给他们"
SWE.18.b:0 "我们不是现世的伯多禄主教"
SWE.19.t:0 "法国政府给予我们支持"
SWE.19.d:0 "法国政府在一份政府公告中宣布将会给予我们全力支持，目前他们支援的步枪已经抵达斯德哥尔摩。"
SWE.19.a:0 "好极了!" 
SWE.20.t:0 "法国政府拒绝支持我们"
SWE.20.d:0 "法国政府对我们表达关切，但是称不会帮助我们对抗左翼。"
SWE.20.a:0 "可惜。"
SWE.21.t:0 "瑞典向我们寻求援助"
SWE.21.d:0 "瑞典政府目前向我们寻求援助，他们声称自己的国家已经处于动荡之中，很容易被左翼政府夺取权力，希望获得我们的援助。"
SWE.21.a:0 "他们想要什么，都给他们"
SWE.21.b:0 "我们不是现世的伯多禄主教"
SWE.22.t:0 "英国政府给予我们支持"
SWE.22.d:0 "英国政府在一份政府公告中宣布将会给予我们全力支持，目前他们支援的步枪已经抵达斯德哥尔摩。"
SWE.22.a:0 "好极了!" 
SWE.23.t:0 "英国政府拒绝支持我们"
SWE.23.d:0 "英国政府对我们表达关切，但是称不会帮助我们对抗左翼。"
SWE.23.a:0 "可惜。"
SWE.24.t:0 "共产党人夺权!"
SWE.24.d:0 "在议会准备宣读选举结果时，一批共产党人控制的武装冲入了议会大楼，宣布国王已经被处决，正式解散议会，建立无产阶级专政的瑞典社会主义共和国。其承诺在挪威举行全民公投已决定其命运，目前全瑞典已经被共产党人控制。"
SWE.24.a:0 "什么？!"
SWE_vote_tt:0 "§R瑞典的命运，此刻掌握在你手中······§!"

