l_simp_chinese:  
 CHI_Congress_speech:0"国会演讲"
 CHI_Congress_speech_desc:0"自1913年4月8日第一届国会召开至今，国会一直在中华民国的政治舞台上扮演者重要作用，其实现平衡各派系利益，以维护国家统一。而现今，在即将召开1919年国会的一次常规会议上，袁世凯大总统决定发表一次重要演讲。"
 CHI_Anti_russian_propaganda:0"反俄宣传"
 CHI_Anti_russian_propaganda_desc:0""
 CHI_Young_Volunteer_Army:0"青年志愿军"
 CHI_Young_Volunteer_Army_desc:0"沙皇俄国曾经趁火打劫的抢夺了诸多属于我们中国的土地，而现在正是收复失地的大好时机，青年们踊跃参军，报国杀敌."
 CHI_Manipulate_Congress:0"操纵国会"
