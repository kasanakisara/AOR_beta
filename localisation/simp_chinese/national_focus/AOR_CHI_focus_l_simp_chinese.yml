 CHI_Northwest_joint_command:0"西北联合指挥部"
 CHI_international_aid:0"国际援助"
 CHI_Mobilize_workers_help_in_war:0"兴工助战"
 CHI_war_bond:0"战争债卷"
 CHI_Hold_down_south:0"压制南方"
 CHI_Yuan_is_dying:0"袁大总统的年关"
 CHI_Year_of_Gengshen:0"庚申年"
 CHI_peoples_democracy:0"人民民主"
 CHI_National_Revolution:0"国民革命"
 CHI_United_provincial_republic:0"撞响自由之钟"
 CHI_United_provincial_republic_desc:0"自辛亥以来吾等所追求之自由平等，现确系破坏无余。蠹虫满堂，争结党以争私立；武夫干政，视法制为无物；独夫自专，假共和而实独裁，民国诚已病入膏肓。而正所谓“上医医国”，吾等愿继承《革命军》之遗志，撞自由钟，树独立旗，再兴革命，荡涤宇内，尽除民贼，另造一自由平等之联省共和国。"
 CHI_Rule_law:0"安福胡同的聚会"
 CHI_Rule_law_desc:0"民国本就不稳定的表面平衡，在袁大总统仙逝后，变得更加脆弱。进步党人，南北国民党人，以及一些还依然隐藏在水面下的势力，都开始在阴影中蠢蠢欲动。暗流已经涌动，而作为深受袁大总统器重，甚至是半个女婿的段祺瑞，如今正处在抉择的十字路口。情感上，段祺瑞不愿意国家再次遭受分裂之苦，这不仅有违他自己的行事原则，对自己的执政不利；同时，分裂和内乱本身，也于国不利。但现实中，他又不得不承认，如今的民国，很多问题已经无法通过简单的弥合和适当的妥协来解决了。或许，一次大破大立的洗牌，对于这片大地来说，是更好的选择？不管怎样，到了做出决断的时候了，徐树铮已经做好安排，在不日将于安福胡同举行的聚会上，段祺瑞将必须和他的同道一起，做出未来方向的最后决定。"
 CHI_law_heavy_light:0"法统重光"
 CHI.1.tt:0"【皖系获得10支缺乏训练的含3个步兵营组成的师...】"