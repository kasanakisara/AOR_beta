l_simp_chinese:
 #ideas#
 Dixie_Goes_Again:0"迪克西再出发！"
 Dixie_Goes_Again_desc:0"遥远的1865年，那悲剧与屈辱交叉的滋味已然逝去。当年的南方义军们不甘心地放下了自己独立的尊严，与北方的叛国者们重新融为一体，操控的这台丑陋的机器，在世界不停的爬行，而南方人的血与泪也随之飘散于美洲大陆之上。不过，胜利的曙光终将会到来，迈入1921年的夏季，就如同60年前……既然他们胆敢再次妄图征服我们，那小伙子们就再次拿起我们的枪炮，为了伟大的迪克西而战！"
 Fire_Cactus:0"烈火仙人掌"
 Fire_Cactus_desc:0"约翰.南斯.加纳是迪克西党中态度坚决的政治强人，其优秀的政治作风以及坚贞不屈的斗争精神使得他深受南方人民的爱戴。如今，这只仙人掌将自己锋利的尖刺对准了北方的入侵者们，并时刻给予他们迎头痛击。"
 Oil_Heaven:0"石油天堂"
 Oil_Heaven_desc:0"上帝虽然不眷顾南方的政治前途，却眷顾了南方这片肥沃的土地-她产出那无穷无尽的黑金，无时无刻地滋润着我们的人民。尽管控制着石油的公司们一手遮天，我们对此无可奈何，但只要他们还在战争中保持中立，我们便能继续获利……"
 Imprison_in_the_dark:0"禁锢黑暗中"
 Imprison_in_the_dark_desc:0"尽管南方早在《查尔斯顿协议》签订后就废除了奴隶制，但是这些地位低下的黑人群体们在我们南方并不受到人身安全保障与法律保护。我们用强有力的隔离手段及法律规定将这些不稳定因素牢牢地固定在了他们原来生活的地方。他们仍然是我们南方的奴隶，但随着人口的增加，他们在慢慢拖垮我们……"
 Armament_of_the_Union:0"联盟的武装"
 Armament_of_the_Union_desc:0"南方的军队主要由原先的美国民兵，即现在南北统一称呼的国民警卫队组成。他们受命于南方各州政府，并在名义上统一属于一个南方国民警卫队总部的指挥-而实际上，各州往往各自为政，军队相互之间并不听从调令。这导致了我们南方军队的协调性很差，军事训练也有所欠缺。但各州已经加快了人员武装进程，我们仍有信心打赢这一场保卫战争。"
