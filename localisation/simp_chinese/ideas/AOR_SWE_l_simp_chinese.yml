#ideas/sweden.txt
 A_lingering_alliance:0 "苟延残喘的联盟"
 Tiger_of_Silence:0 "沉默之虎"
 Let_the_ambitio_sleep:0 "让雄心沉睡"
 A_lingering_alliance_desc:0 "§R挪威独立运动每日增长将增加！§!\n\n\n瑞典-挪威联合王国，目前世界上罕有的多民族封建国家，其建立历史可以追溯至1814年。\n1814年1月14日，瑞典与丹麦签订《基尔和约》，决定将挪威割给瑞典，挪威从此变成瑞典的附属国。挪威人民十分反对，发动游行，但依然无法改变挪威成为瑞典附属国的事实。此后两国强行组成联邦，持续至今。\n但事情总有转机。1905年，受俄罗斯皇帝尼古拉二世遇刺影响，挪威人民发起大规模暴动，尽管最终并没有成大气候，但依然留下了一部新宪法————§C《哥德堡宪法》§!，以试图维持民族调和的现状。\n但当历史行至十字路口，联邦终将决定他的命运：\n\n§R“To be or not to be, that is a question.”"
 Tiger_of_Silence_desc:0 "在大北方战争中，瑞典被挤出列强之列；而在拿破仑战争灾难性的战败之后，瑞典的军队几乎彻底失能。如今，瑞典和挪威政府互相扯皮，导致联邦不存在一个统一的军队组织。但在联邦冰封的土地之下，依然蕴藏着强大的力量，静待苏醒。"
 Let_the_ambitio_sleep_desc:0 "联邦历代国王都因为内部的民族矛盾而选择只是维持现状，曾经卡尔马联邦和瑞典帝国的荣光也只是被视作历史，被扫进垃圾堆里。联邦犹如一只昏迷的雄狮，荣光不再，只剩下偏安一隅和寄人篱下的忧愁和现实。"

