 SWE_Left_Threat_desc:0 "§R挪威独立运动每日增长将增加！§!\n\n\n挪威的工人运动的历史十分悠久，可以追溯到1814年联邦建立之初。如今，在世界大战结束和十月革命胜利的背景下，这些人蠢蠢欲动，计划使挪威独立，并推翻联邦政权。"
 SWE_Eighty_Seventh_Orders_desc:0 "§G挪威独立运动每日增长将减少§!\n\n\n“自即日起，设立联邦改革特别委员会，为联邦之彻底民族改革工作，可绕过议会，掌管基层，并直接听从国王命令。”\n《联邦改革特别委员会法》，又称《第八十七号命令》，在联邦的两个议会都已高票通过，这意味着联邦的命运重新被国王所掌控了。这位心怀§B「宏伟蓝图」§!的君主，将会带着他的国家走向何方呢·······"
 SWE_Antisocialistisk_Speciallagen:0 "反社会党人特别法"