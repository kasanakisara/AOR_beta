AOR_FRA_The_Age_of_ClemenceauL:0"克里蒙梭时代"
AOR_FRA_The_Age_of_ClemenceauL_desc:0"暴风雨，那是多么惊心动魄！\n云涌星驰，\n飞泻滔滔江河，\n雷鸣电闪，\n射出道道焰火！\n伟大莫如克里蒙梭总理：\n领导我们越过风暴，\n将战争带离法兰西！\n若要以一个凡人前来代表一个国家，\n乔治·克里蒙梭就是法国！"
AOR_FRA_Fear_Chaos_Crisis:0"恐惧，混乱与危机"
AOR_FRA_Fear_Chaos_Crisis_desc:0"峥嵘岁月依旧。\n暴风雨后的泥流，\n席卷法兰西每一块土地！\n洪水早以将人们的心灵冲刷：\n尽是漫天游荡的亡灵！\n即使住在乐土之中的“上帝”们，\n也早已被这泥流吓破胆了罢！\n试看，\n这些远离乐土之人\n又将作何努力！"
AOR_FRA_Workers_Hymn:0"工人赞美诗"
AOR_FRA_Workers_Hymn_desc:0"可还记得那暴风雨中,\n海燕战胜了那滔天巨浪！\n从城市到农村，\n从工厂到校园，\n浩浩荡荡的燕子大军：\n巨浪拍天！\n无数蒙蔽在社会主义下的人们：\n妄想向神圣的政府掀起巨浪！\n他们的命运不该如此。\n只可惜\n他们被剥夺了抉择的自由！"
AOR_FRA_World_owner:0"世界共主"
AOR_FRA_World_owner_desc:0"无尽的世界呐，\n你壮丽辉煌！\n任那暴风雨肆虐你的心灵;\n任滔滔洪水涤荡你的身躯。\n备受滋润的猛虎呵！\n动起身来：\n将旧的世界一扫而尽,\n新的太阳从法兰西升起！\n“光明的给予者！”"
AOR_FRA_Sunset_Winner:0"胜者夕阳"
AOR_FRA_Sunset_Winner_desc:0"重顾法兰西的土地，/n宏伟的山巅早以磨平！/n再看那居于乐土之上的“上帝”们！/n依旧如故。/n可那历史不曾等待：/n孤烛将熄，/n凤凰将涅！/n试看将来的时局：/n胜者日暮，/n败者重燃！"