 #民族精神
 AOR_FRA_World_owner:0"世界共主"
 AOR_FRA_World_owner_desc:0"无尽的世界呐，\n你壮丽辉煌！\n任那暴风雨肆虐你的心灵;\n任滔滔洪水涤荡你的身躯。\n备受滋润的猛虎呵！\n动起身来：\n将旧的世界一扫而尽,\n新的太阳从法兰西升起！\n“光明的给予者！”"
 AOR_FRA_The_Third_Republic:0"第三共和国"
 AOR_FRA_The_Third_Republic_desc:0"自普法战争的灰烬之上屹立的法兰西第三共和国已经度过了许多岁月。虽然第三共和国的政治体制经常被评价为不稳定，议会倒阁的事件常常发生，政府常常陷入政治危机之中，其甚至从来没有被认为可以长期执政，但是毫无疑问的是，如果没有第三共和国，法兰西的命运只会更加扑朔迷离。\n\n第三共和国确立了议会共和的政治体制，将自由、平等和民主的思潮真正地带入了法兰西每一位公民的心中。第三共和国也是法国第一个长久的共和制政权，象征了法国的经济发展、社会稳定和文化进步。她推倒了主宰法国上百年的天主教权，在世界各地高高举起三色旗宣告法兰西的存在，同时也在世界大战中同邪恶的同盟国集团决一死战，取得了最终的胜利。毫无疑问，没有第三共和国，法国不可能取得如今的荣耀，也不可能成为如今世界上执子的棋手。"
 AOR_FRA_The_Shadow_of_the_world_war:0"世界大战的胜利者"
 AOR_FRA_A_Growing_Social_Crisis:0"愈演愈烈的社会危机"
 AOR_FRA_Millerand_President:0 "叛徒总统"

 #领导人
 
 Georges_Clemenceau_DESC:0"世界大战将克里孟梭推上了法国政治舞台的正中央。\n1917年法国前线失利，绥靖派主张议和，而主战派的雷蒙·普恩加莱总统在这一紧急情况下，决定请76岁高龄的总理克里孟梭组阁。1918年3月8日，他在演说中宣布：“我将不断作战直至生命的最后一刻。”他历来独断专行，执政后相当于在保留议会的情况下实现了个人独裁。他杀伐果断，多次亲赴前线重振士气，在国内强力镇压反战力量，并以此为借口大肆镇压工人运动。德国投降之后，参议院一致通过法令确认了他的功绩，克里孟梭从此被人称为“胜利之父”。克利孟梭组阁后很快使法国重振了民族活力，保证了战争的最后胜利。不仅如此，他还在经历战争之后保留了军人应当受文官领导的共和传统，不让赢得胜利的元帅和将军们任意行动。\n1919年克里孟梭出席了巴黎和会，他力主肢解并最大限度地削弱德国，以便法国称霸欧洲大陆。由于英美的反对，他只能作出一些让步，但最后签订的和约仍然部分满足了法国的要求。最终签订的《凡尔赛条约》无疑是克里孟梭的杰作，但他并没有因此得到法国人的普遍赞赏。右派报纸攻击他只会跟在威尔逊屁股后面转；福煦称他的妥协是背叛和投降。而在和约签字的一个多月前，克里孟梭再一次下令向5月1日的游行队伍开枪，一副粗暴残忍的独裁者形象显露无遗。"
