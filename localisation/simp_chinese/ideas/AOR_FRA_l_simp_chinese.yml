 #民族精神
 AOR_FRA_The_Age_of_Clemenceau:0"克里蒙梭时代"
 AOR_FRA_The_Age_of_Clemenceau_desc:0"暴风雨，那是多么惊心动魄！\n云涌星驰，\n飞泻滔滔江河，\n雷鸣电闪，\n射出道道焰火！\n伟大莫如克里蒙梭总理：\n领导我们越过风暴，\n将战争带离法兰西！\n若要以一个凡人前来代表一个国家，\n乔治·克里蒙梭就是法国！"
 AOR_FRA_Fear_Chaos_Crisis:0"恐惧，混乱与危机"
 AOR_FRA_Fear_Chaos_Crisis_desc:0"峥嵘岁月依旧。\n暴风雨后的泥流，\n席卷法兰西每一块土地！\n洪水早以将人们的心灵冲刷：\n尽是漫天游荡的亡灵！\n即使住在乐土之中的“上帝”们，\n也早已被这泥流吓破胆了罢！\n试看，\n这些远离乐土之人\n又将作何努力！"
 AOR_FRA_Workers_Hymn:0"工人赞美诗"
 AOR_FRA_Workers_Hymn_desc:0"可还记得那暴风雨中,\n海燕战胜了那滔天巨浪！\n从城市到农村，\n从工厂到校园，\n浩浩荡荡的燕子大军：\n巨浪拍天！\n无数蒙蔽在社会主义下的人们：\n妄想向神圣的政府掀起巨浪！\n他们的命运不该如此。\n只可惜\n他们被剥夺了抉择的自由！"
 AOR_FRA_World_owner:0"世界共主"
 AOR_FRA_World_owner_desc:0"无尽的世界呐，\n你壮丽辉煌！\n任那暴风雨肆虐你的心灵;\n任滔滔洪水涤荡你的身躯。\n备受滋润的猛虎呵！\n动起身来：\n将旧的世界一扫而尽,\n新的太阳从法兰西升起！\n“光明的给予者！”"
 AOR_FRA_Sunset_Winner:0"胜者夕阳"
 AOR_FRA_Sunset_Winner_desc:0"重顾法兰西的土地，\n宏伟的山巅早以磨平！\n再看那居于乐土之上的“上帝”们！\n依旧如故。\n可那历史不曾等待：\n孤烛将熄，\n凤凰将涅！\n试看将来的时局：\n胜者日暮，\n败者重燃！"

 #领导人
 
 Georges_Clemenceau_DESC:0"法兰西共和国 “老虎”乔治·克里孟梭            世界大战将克里孟梭推上了法国政治舞台的正中央。1917年法国前线失利，绥靖派主张议和，而主战派的雷蒙·普恩加莱总统在这一紧急情况下，决定请76岁高龄的总理克里孟梭组阁。1918年3月8日，他在演说中宣布：“我将不断作战直至生命的最后一刻。”他历来独断专行，执政后相当于在保留议会的情况下实现了个人独裁。他杀伐果断，多次亲赴前线重振士气，在国内强力镇压反战力量，并以此为借口大肆镇压工人运动。德国投降之后，参议院一致通过法令确认了他的功绩，克里孟梭从此被人称为“胜利之父”。克利孟梭组阁后很快使法国重振了民族活力，保证了战争的最后胜利。不仅如此，他还在经历战争之后保留了军人应当受文官领导的共和传统，不让赢得胜利的元帅和将军们任意行动            1919年克里孟梭出席了巴黎和会，他力主肢解并最大限度地削弱德国，以便法国称霸欧洲大陆。由于英美的反对，他只能作出一些让步，但最后签订的和约仍然部分满足了法国的要求。最终签订的《凡尔赛条约》无疑是克利孟梭的杰作，但他并没有因此得到法国人的普遍赞赏。右派报纸攻击他只会跟在威尔逊屁股后面转；福煦称他的妥协是背叛和投降。而在和约签字的一个多月前，克利孟梭再一次下令向5月1日的游行队伍开枪，一副粗暴残忍的独裁者形象显露无遗。"
