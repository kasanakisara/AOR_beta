 USA_participation_award_desc:0 "美国军队远赴欧洲，这是为了世界和平做出的决定...美国在这次战争中做出了杰出的贡献，获得了属于等同于世界大国的声誉，这是每个美国人都值得庆祝的事情...吧?"
 USA_the_divided_nation_desc:0 "自南北战争被外界干涉以来，美利坚确定了以洋基党和迪克西党两党选举的制度。这种政策导致了美利坚南北发展的畸形现状，发展重心时常转移极度不平衡，合众，也许从来都只是一个怪异的小丑，大家都在拍手叫好他的拙劣演技，直到矛盾全部爆发的那一天..."
 USA_Anglo_frech_enterprise_desc:0 "如果说劳苦百姓的主子是政治家与资本家，那么政治家与资本家的主子就是英国和法国。他们开着黑船随着那只“看不见的手”来到美利坚，在这里肆无忌惮地压榨，吸血。英法资本对大多数企业的优势控股已经成为了这里的常态，而政治斗争也往往是英法势力角逐的体现。这自由与希望的新大陆之国徒有超级大国的表，实际上是腐蚀殆尽的里。"
 USA_steel_and_cotton_desc:0 "对于大部分生活在美国的百姓来说，只有两条选择。要么来到北方，通过12小时的工作赚取只能饱腹的薪水，一辈子当个工奴浑浑噩噩度日。或者去到南方，在无止尽的劳作与采摘只下耗尽你的青春年华，成为那些老爷们的农奴。在棉花和钢铁之下的，是无数百姓的尸骨。"
 USA_Dollar_bottom_desc:0 "美国的货币金融体系在英法的干涉下失去了独立性，美金大量贬值成为法郎与英镑的垫底货币与中间兑换币，这就导致了美国的货币体系已经事实成为了英法剥削的工具之一，美国的各种金融问题随着英法势力的深入纷来沓至。"
 USA_the_divided_nation:0"雄鹰陨落，不合众国"
 USA_sandaliren:0"三大利刃，穿胸剧痛"
 USA_shiyouhuanying:0"石油幻影，钢铁梦魇"
 USA_kuangyezhidi:0"狂野之地-西部"
 USA_busidexintuo:0"不死的信托"
 USA_zhixuchonggou_knights:0"秩序重构-骑士"
 USA_dazhanzhimo:0"大战之末，洪涛将临"
 USA_the_divided_nation_desc:0"自1865年后，尘埃落定。上帝赐予美利坚合众国一切的梦想，都被两只魔鬼撕的粉碎。现如今的美国只是一个虚有体量的畸形怪物-她没有一部可以通行各州的宪法、没有一套与欧洲各国相当的官僚体系、甚至在精神上已不是一个国家；她只有一地鸡毛的地方政府与一位毫无作用的总统、还有两个相互竞争，却带领国家走向分裂的巨型政党，以及他们所代表的北方和南方，包括一个徒有其表的国会。\n这台丑陋的机器不断地在世界中哗众取宠，引人嘲笑，而美国人将会随着这股浪潮，迎来自己最终的审判……"
 USA_sandaliren_desc:0"合众国在费城的阴影中艰难爬行。尽管联邦政府很早就宣布废除《费城条约》及其相关的一切内容，但这只是美国北方一厢情愿的幻想。不过依靠着80年代的南方危机，美国北方迫使南方签订了另外两大协议-即1885年的经济、政治协定《查尔斯顿协议》与1887年的军事协定《西点协议》。\n南北双方在原先《费城条约》内容的基础上进行了延伸，这使得条约体系利于北方，并暂时维护了美国表面的统一。以上三份文件被世人称为后美国时代的“三大立国文件”。不过，暗潮涌动，三大文件所带来的后遗症，时时刻刻影响着南北双方。在新的时代背景中，在仇恨与利益的驱动下，美国即将围绕着它们展开史无前例的斗争……"
 USA_West_Point_Accord_tt:0"\n南方州在§Y《西点协议》§!中规划了一条军事分界线，联邦军队不得越过此军事分界线，而南方国民警卫队也不能进入到北方州的范围里。\n\n§Y《查尔斯顿协议》§!签订后，美国国会进行了改革（即§Y《第十六修正案》§!），尽管使其更加贴近于南北双方的实际政治状况，但依旧没有什么有效的用处。\n\n南方接受联邦政府的§Y《第十五修正案》§!，放松了各州之间的公司经济活动，并且与北方各州对公司经营的经济政策进行调整，大量的北方公司进入了南方，从而开启了他们的天堂之路……"
 USA_shiyouhuanying_desc:0"尽管美利坚四分五裂，但她优秀的体量与丰富的自然资源仍然能够使其与工业革命共呼吸-尽管这宝贵的财富并不掌控在绝大部分公民手中。南方德克萨斯州以及路易斯安娜州产出的巨量石油为南方各州带来了巨大利润。而随着北方钢铁工业以及其他工业部门的发展，美国的工业产品也开始畅销全球。美利坚的经济开始在80年代后腾飞，最终成就了让欧洲国家瞠目结舌的“美利坚经济奇迹”。尽管英法早在19世纪90年代进行了经济制裁，但我们依靠强力的企业仍然挺过了危机。现在的美利坚早已是世界第一大经济体，似乎在将来就要将大不列颠的桂冠摘到自己的头上。而代价……\n§R一笔勾销的白纸，无数血泪与亡魂§!"
 USA_kuangyezhidi_desc:0"虽然美国内战结束了，但前总统林肯所颁布的《宅地法》在费城会议结束后仍然受到南北双方的接受-为了巩固战后的经济发展，也为了南北双方的利益争夺，谁都无法拒绝这一块诱人的蛋糕。大量的东部移民怀揣着他们的西部梦-对于自己新生活的希望，络绎不绝地前往西部开荒；在广阔的土地上挥洒了他们勤劳的汗水。\n梦想远走高飞，而最后被秃鹰撕的粉碎。\n托拉斯的发展则摧毁了一切。众铁路集团在西部肆无忌惮地违反《宅地法》条例，公然强制收购自由公民的土地，并将大量游牧民与农民被迫赶往铁路公司沿线的工厂进行劳动，生活在天外的印第安人也不能幸免。东部的大量公司开始进入西部，在铁路公司的助长下，嚣张着推行着自己的经济压迫。西部人无论如何强烈抗议托拉斯的野蛮行径，并要求联邦政府给予合法的政治权利以反抗托拉斯的经济统治-但从来得到的答复都是空气。联邦为了维护西部的经济稳定，不得不更加有求于铁路托拉斯的支持。这使得他们更加肆无忌惮，仿佛西部已经成为了工厂主与大农场主的血汗王国了。\n不过，总会出现插曲。出没于山间和丛林的，在荒漠与沼泽中留下自己足迹的，他们无时无刻用自己的方式表达了西部人民的愤怒-用枪和炮来宣告自己的自由，这使得东部政府们痛苦不已，并派出了一支由潘兴将军领导的西部特遣军前去维护西部的稳定。佣兵与流氓也随之而来，西部最终依然成为了能够给予所有人最终命运的天堂。但他的故事还远远没有结束……"
 USA_kuangyezhidi_tt:"§R请务必要维护西部稳定！不然会有难以想象的后果……§!"
 USA_busidexintuo_desc:0"当今国际上有一句玩笑：托拉斯代表经济，而美国代表托拉斯。\n自从那如潘多拉魔盒般的《第十五修正案》通过以来，美国企业就如脱缰野野狗一般席卷各州。他们犹如鱿鱼和蜘蛛一般侵吞着一切可以看到的东西。商品、工厂、甚至于人和活物们都逃脱不了他们的手掌。从北方到南方再到西部，到处都是闪闪发光的“信托”，无声诉说着他们的不为人知的血肉罪恶。黄金的信徒、人间的怪兽、是那些混沌之人的“救世主”，就这么现于人间。\n进入到了新世纪，美国的资本格局已经十分明了：由一手遮天的洛克菲勒所控制的标准石油公司与南方促进公司几乎控制了美国所有的工业经济命脉，摩根家族所控制的美国各大银行与美国中央银行成为了美国金融界的坐标，梅隆家族控制了五大湖地区的重要工业设施，而铁路家族们则控制了美国大大小小的交通枢纽。全国几乎都被这些精英们瓜分殆尽，政治、经济变成了他们可以随意摆弄的玩偶，而联邦政府与地方政府对此无能为力。物是人非，夕阳西下，随着不知名的危机到来，他们又将目光飘向了何处呢……"
 USA_busidexintuo_tt:"§Y民用工厂§!建造速度：§R-100%§!（随托拉斯的经济而变动）"
 USA_busidexintuo_2_tt:"§R无法更改§!经济法案\n§R无法更改§!征兵法案"
 USA_zhixuchonggou_knights_desc:0"劳动骑士团曾经作为一个美国政府与企业家们所讨厌的工人团体（LABOR），已经消失在了这个世界上。而取而代之的劳动骑士团（WORK）则是这批组织中最恶劣的渣滓与广泛的社会人群所组成的一批古怪而又庞大，令人生畏的武装兼劳工组织。尽管他们与大家的印象不太一样……\n这个拥有几百万会员，几十万武装的庞大组织，无时无刻渗透着整个美国北方、大半个西部以及部分南方城市的每一个角落，他们的身影总是能被美国人所发现。在社区，他们是负责替代警察的维护治安能手，在打击犯罪活动上，他们是比政府与军队行动更快的执行者；而在工厂与企业中，他们更是随叫随到的能手-处理劳动纠纷的速度就犹如他们打晕罢工者一样迅速。\n是啊，劳动骑士团，你究竟是一个什么样的存在呢？有些人爱戴你，歌颂你，甚至在美国渲染起了一股现代复古的骑士文化，这展现了你最好的一面-而在那些深处的工厂中，在那些不为人注意的企业中，你早已成为了发泄的对象，并且深深为他们所仇恨。矛盾在你的身上回荡。你是为了美国的荣誉与秩序而战的勇士，还是只是为托拉斯所利用的刽子手，一遍遍洗刷着美国公民的血肉之躯，淹没你的灵魂？\n§R这是你的故事，应由你来续写……§!"
 USA_dazhanzhimo_desc:0"席卷全球的大战已经结束，美利坚也参与其中，并与盟国共享了胜利的荣光，这应该值得每个美国人……庆祝吧？。1919年的夏季，一股恐惧感随之席卷大街小巷。在那热火朝天的底特律，在那遥远的圣弗朗西斯科，在那已经不为人所知的白宫里，命运的齿轮已然开始转动……§R我们静静等待§!"
 USA_dazhanzhimo_tt:"无影响，随美利坚的变化而变化……"


#####人物#####
 John_Joseph_Pershing:0"约翰·约瑟夫·潘兴"
 John_Joseph_Pershing_desc:0"约翰·约瑟夫·潘兴（John Joseph Pershing）于1860年出生在美国密苏里州，他很幸运地通过自己幼小的年龄躲过了内战的浩劫。然而，他这一生却与战争和冲突结下了不解之缘。\n\n潘兴，是在一个极为尴尬的环境中长大的。密苏里州本应属于南方蓄奴州的一份子，却在内战中加入北方，以此来谋求最大的利益-然而随着南北的停战，密苏里州演变成了所谓的“自由中立州”尽管她仍然保持着蓄奴的传统，但她的议员们却与南方势同水火，被认为是南方的叛徒，同时北方也认为其是“自由州的毒瘤”。\n\n潘兴从第一次踏出密苏里州开始，就一直对自己属于“自由州”的概念感到深深的怀疑，他感受到自己无法融入这个所谓的广大社会，走到哪里都会有人质疑其合法公民的身份-因为他是南北都认为的毒瘤州里头出来的乡巴佬。\n\n于是他选择了逃避。\n\n他选择了参加联邦军队，逃离这个繁荣的是非之地，奔走至已经混乱不堪的黑暗西部。他在西部用自己一次次摧毁印第安部落和一次次斩下头皮的证明，向美国政府证明自己的忠心与勇气，想他自己和其他人证明自己是一个真正的美国人-不会再遭受白眼的美国人！\n就这样，在漫天黄沙中摸爬滚打了30年。整整30年，他终于得到了华盛顿金牌，晋升三星中将，统领着一支强大的“西部特遣军”，犹如大象般在西部扎稳脚跟。多年来的杀戮，早已让他麻木冷漠；或许在亲友的前面，他还能保持一丝温情，不过更多的时候，他只不过是把世间万物当成作战计划的一份，并陷入了无穷的空虚。为了作战，他可以去不择手段的搜捕反叛者，可以去用一切有底线的方法养活他的军队，哪怕是不听从华盛顿的命令，他也要在西部稳稳的扎稳脚跟，他早已把这支军队当成了他最终的归宿。\n\n潘兴固然已经成为了美国军事力量中的巨人，但即使是成为巨人的他也有着一颗永远无法挥去的梦魇：他到底是谁、从哪里来、再到哪里去，到底要做什么，究竟还有什么东西能够支持他继续走下去？\n§R谁都无法给他答案§!"

 Hiram_Warren_Johnson:0"海勒姆·约翰逊"

 Robert_LeRoy_Parker:0"罗伯特·勒罗伊·帕克"

 Annie_Le_Porte_Diggs:0"安妮.勒波特.迪格斯"

 William_Kissam_Vanderbilt:0"威廉·基萨姆·范德比尔特"

 Thomas_Woodrow_Wilson:0"托马斯·伍德罗·威尔逊"
 Thomas_Woodrow_Wilson_desc:0 "托马斯·伍德罗·威尔逊（Thomas Woodrow Wilson）出生在美国的弗吉尼亚州-从血缘上说他可以是个南方人；不过，随着内战的结束，他那醉心于神学的父亲却带着全家一路北上，来到了美国的宾夕法尼亚州生活。\n\n成长后，威尔逊来到了普林斯顿大学学习，尽管他如他的父亲一样如此热衷于自己的学习事业，但还是被校内的诸多学生扣上了“迪独奸细”的帽子，遭尽众人白眼，但他并没有就在此处折戟，并顺利地读完了法学以及政治经济学。不过，他似乎已经无法在普林斯顿任教了。\n\n威尔逊最终没有当上一名理想的老师-但他却当上了一名为了美国人民的“权力”而四散奔走的著名学者；他针对西部问题所发表的著名文章《谁是服务者？》引发了当时美国社会的一片浪潮。自19世纪90年代以来，有无数的人为这位英勇发声的学者给予了大量帮助，并最终使得他成功当选了1904年密歇根州州长。\n\n1916年，在绝对性的胜利中，威尔逊接过了上一任北方总统的接力棒，成为了第27届美国总统。他在任前发表了一系列振奋人心的演讲，并宣布了一系列将会在当选后采取的政治改革措施-但，时光已经冉冉三年，这些承诺犹如泡沫般堆积在美利坚的土地上，可触却不见踪影，或许他欺骗了美国人民，欺骗了每一张选票。这究竟是威尔逊的堕落还是美国的无力，只有威尔逊自己来回答了。\n\n§R留给他的时间已经不多了……§!"

 Warren_Gamaliel_Harding:0"沃伦·盖玛利尔·哈定"
 Warren_Gamaliel_Harding_desc:0"沃伦·盖玛利尔·哈定（Warren Gamaliel Harding）美国第28任总统，出生于1865年的俄亥俄州。据说他们家庭中有着优良的北美革命传统，可以不顾一切随时为联邦政府效命出征；不过，这是据说哈定家族拥有被解放黑奴血脉所造成的……\n\n随着南北战争的结束，哈定一家也归于平常。总统先生在童年时就闯荡社会，并且干的都是些体力活，这养成了他温顺、顺从但坚强的品格。可惜这些工作并不能满足哈定的开支要求，于是他选择了一项挑战自我学习能力的工作-报社记者，还是自己开办。\n\n哈定先生是一位风度翩翩的男士，所以他自然而然的能在困境中解救自己，他居然能够迎娶了一位让他的家人以为是发了神经的富家小姐：弗洛伦丝·克林。自此之后，他的事业犹如矿车蒸汽机般迅速爬升，达到了一个他曾经永远无法想象的高度。在当选俄亥俄州州长后，他迅速结识了一大票上流人士和有名的企业家，这些人给予了这位“美男子”更多的支持，并最终使得他被威尔逊所在的扬基党提名，成为了1916届的美国副总统。\n\n当他才还是副总统时，他的执政方针就异于常人-总是关心女人，且总是摆出一副要为女人争夺权利的样子，并且他极度热爱于打扑克牌，甚至常常拿牌局来比喻政治。这些比较幽默的作风却使他赢得了大量女性同胞的赞同，而这些女性同胞们又撺掇他们的丈夫，并最终使得哈丁总统能够取代威尔逊，登上白宫的第一宝座。\n\n这位让人疑惑的总统上台后，究竟想要干什么呢？咱们还是慢慢等时间发展吧。"


 John_Nance_Garner_III:0"约翰·南斯·加纳三世"
 John_Nance_Garner_III_DESC:0"约翰·南斯·加纳三世（John Nance Garner III）出生于1868年的德克萨斯。作为一个正根苗红的老南方人，约翰当然吸收了来自父母精神中的那份野性。不过，他的学习天赋却异于常人，并在成年之后顺利考入大学，完成学业。\n\n良好的学习掩盖不了他真正的的暴躁属性，在当选县议员后，他咄咄逼人的演讲风格就迅速在德克萨斯州出了名。不过真正使他获得南方普遍赞誉的则是1896年-他与已经如日中天的标准石油之间的薪水论战，这为他赢得了平民的良好赞誉-尽管他后来被人打了黑枪，也没有成功竞选，成为最年轻的德州州长。\n\n加纳那一如既往的脾气和坚持用仙人掌作为德州州花的强硬态度，让他获得了“仙人掌杰克”的美誉。不过，这颗仙人掌终有绽放的时候，当1914年的德州州长选举如火如荼展开时，长期没有参选的约翰却一马当先，通过遥遥领先的票数取得了州长的宝座并一直延续至今，虽然该州的最大产税收入来源于他的死对头标准石油，但此时的约翰也放低态度，试图缓和自己与该公司的关系。\n\n这自然是一位优秀的美国地方领导者，但也只能算作南方：他十分仇视给南方带来灭顶之灾的北方公司，他更加仇视那些不顾南方百姓情感和传统而将其破坏殆尽的北方政客。他无时无刻做着南方重新崛起的美梦，并在为这个目标时刻准备着。\n\n§R而现在，他终于拥有了这个机会§!"
 
 Eugene_Victor_Debs:0"尤金·维克托·德布斯"