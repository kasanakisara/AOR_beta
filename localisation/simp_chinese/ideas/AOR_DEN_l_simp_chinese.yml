Lawyer_politician:0 "律师政客"

####人物介绍############
Otto_Liebe_DESC:0 "快点，我们可没多少时间！奥托•利贝终于踏入了首相之位，虽然已经50多岁，即使方式有些令人不齿。但国王既然动用了他的权力，就证明奥托肯定有什么过人之处。作为最高法官，奥托的贡献是不可否认的，他是法律精英，以他的个人魅力而著称。而作为新首相，奥托希望将引领新一轮的保守化，让国家回归旧日荣光。让石勒苏益格回来、让丹麦稳定下来、让冰岛人消停、让国家继续发展、让议会心服口服……奥托要做的事有很多，但丹麦能否给他一个展示自己的舞台呢？他的首相任期似乎和他的人生一样，没剩多少时间了。"