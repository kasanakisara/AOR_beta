l_simp_chinese:

 AOR_ORA_events.1.t:0"日薄西山"
 AOR_ORA_events.1.d:0 "即使在美洲之角，太阳也不会吝啬她的温暖，她轻拂过铁窗中人，掠过山间林木，而后更向西行。\n西蒙感受着脸颊的余温，享受着太阳的余晖，他知道阿根廷的太阳已经落下——长夜将至，但太阳永不消逝。如今太阳在北方闪烁，无需多日，南方也将被日光所照耀，在那之前，只需静待时机。\n“待到明日，太阳照常升起。“在阴湿的牢房里，西蒙如此想到。"
 AOR_ORA_events.1.a:0"黑暗中彷徨于无地"
 
 AOR_ORA_events.2.t:0"惊异"
 AOR_ORA_events.2.d:0 "蜷缩成一团的雷托那看着，看着漆黑的栅栏上断断续续的反射着近圆的光，光昏随着铁的纹路扩散着，好似诉说着其过往……\n“现在过了多少个小时？或者说，已经第二天了？”想着，不禁摸了摸自己浓密的胡须。呆在监舍无疑是对于火地岛囚犯最大的惩罚，如果说被逼着劳动让人厌恶，那么呆在这里简直是一种绝望，一种自己将腐烂在这里的错觉像是扼住了他的喉咙，“要是知道时间就好了……”\n“今天是9月12日，你待了五个小时了，一般来讲，得关一周。”雷纳托猛地回头，错愕的看着自从一开始就不说话的狱友。“虽说食堂离着不远，但声音传不过来，也就不能利用它判断时间”他自顾自的说着，雷纳托才发现他瘦的吓人，骨节都暴露出来。“第一天都不会送食物，自那之后就就能通过三餐，算时间了。”看着对方的眼神，那名狱友笑了，“我叫西蒙.拉托维茨基，从来没从监舍里出去过”"
 AOR_ORA_events.2.a:0"“别这么看我，你们头一次进来的，都想问时间”"
 
 
 
 AOR_ORA_events.3.t:0"工人上前线！"
 AOR_ORA_events.3.d:0 "工人们虽然夺得了工厂与生产资料，但他们仍要面对军政府的威胁。尽管工会还在尽力协调着上前线和生产之间的平衡，但随着战争时间的拉长，似乎会变得更为艰难..."
 AOR_ORA_events.3.a:0"速战速决"
 
 AOR_ORA_events.4.t:0"守住街垒"
 AOR_ORA_events.4.d:0"我们的工人的，经过无数考验建立起来的联合工团，现在正面临着史上最大的挑战。每一名工人都必须清楚：我们的资源并非无穷无尽。阿根廷大地不是一片荒漠，两千万人民生活在这片土地上——他们是我们的同胞，我们的父母妻儿和兄弟姐妹。\n因此，必须为坚守每个街口、每一道防御阵地战斗到最后一滴血。夺取并尽可能长时间地保卫每一块土地。反动军队有良好的纪律，虽然他们没有保卫祖国的崇高目标，其目的只是要征服并掠夺我们的工人。而我们有保解放全南美的崇高目标，但因缺乏纪律而遭致失败。工团正值困难时期。我们必须不惜一切代价阻止、击退并消灭敌人。坚决执行上述命令，就能保卫我们的土地，解放我们的人民，打败并消灭可恨的敌人！"
 AOR_ORA_events.4.a:0"解放阿根廷！"
 
 AOR_ARG_events.1.t:0"最糟糕的一天"
 AOR_ORA_events.5.t:0"阿根廷内战白热化"
 
 AOR_ORA_events.6.t:0"曙光乍现"
 AOR_ORA_events.6.d:0"喧嚣的枪声终于结束，阿根廷迎来了久违的宁静。红黑旗沐浴着南方的朝霞，工团主义的梦在美洲扎根，但是代价呢？这片土地可不止连绵的工厂，还有土地与农民。每个人都需要粮食，就如同需要空气。"
 AOR_ORA_events.6.a:0"至少现在，旭日东升。"
 
 AOR_ORA_events.7.t:0"奔向大海"
 AOR_ORA_events.7.d:0 "“唉，你知道吗？过了许久我才知道，阿根廷的雪并不冷，冷的是这个昏暗的社会”雷托那突然想到西蒙莫名其妙感伤的话，本就紧张的他差点没跩个跟头。“他妈的……，就不该听他的”雷托那骂骂咧咧地踢开了碎木块，警卫被上次自己夹带的钱贿赂，但也至多只有三十分钟。\n“那艘傻逼小船，还有那个Compañía Argentina de Pesca, CAP……”\n他看到了海……\n还有那艘船……"
 AOR_ORA_events.7.a:0"此时，距离西蒙·拉多维茨基，逃离火地岛监狱，还有5小时。"
 
 AOR_ORA_events.8.t:0"远洋之上"
 AOR_ORA_events.8.d:0 "“埃内斯托，收到信了！”一个捕鱼公司的人举着信向埃内斯托挥了挥。（我们暂且叫他大胡子，原因显而易见）\n“我知道了”埃内斯托换上了狱警服，咬咬牙“这次不能再失败了。”他喃喃道。\n“啥玩意？！”大胡子回了头，用很大的声音抵御海风的干扰。\n“我说！还有多长时间到那？”\n“不久了！至多三个小时，运气好，没有风浪，说不定两个小时就能到。”\n埃内斯托擦了擦怀里的枪，闭上眼睛靠在船舷上。\n现在只需要等待……"
 AOR_ORA_events.8.a:0"此时距离西蒙逃离火地岛监狱，还有一小时。"
 
 AOR_ORA_events.9.t:0"地火，地火正燃烧"
 AOR_ORA_events.9.d:0 "“雷托那，这东西你藏好”西蒙拿出一瓶液体，然后雷托那眼睛直了，只见就如变魔术一样，第二瓶，第三瓶，第……\n“你他妈从哪里拿来的，这什么玩意？”雷托那抓住一瓶油，闻了闻，“燃油？”他突然反应过来，“我操，你从哪里搞来的？”略带兴奋的抓住西蒙的衣领，能搞来这玩意还需要我帮你？\n“一个老伙伴动用私人关系搞得”西蒙用一句话堵塞了雷托那的下文“死了，被山上的石头砸死的。”他顿了顿“总之，你还是得让警卫看到你，否则你会成为嫌疑人之一。”\n \n雷托那跑回到警卫身边，压抑住某种情感，他上次拥有这种情感还是在恶作剧后，嫁祸给隔壁欺负自己的小混混，享受完全自由的时候，才有过这样畅快的情感。\n“你他妈要是再晚一点，别人就该起疑心了，快回去”警卫不耐烦的挥挥手，突然觉得有股焦糊的味道“什么玩意？”\n他猛地回头，看到冲天的黑烟。\n“什!么!情!况！”"
 AOR_ORA_events.9.a:0"西蒙已离开监狱。"
 