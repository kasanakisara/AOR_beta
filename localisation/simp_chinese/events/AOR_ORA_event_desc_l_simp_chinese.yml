 AOR_ORA_events.1.t:0"袁大总统的国会演讲"
 AOR_ORA_events.1.d:0 "即使在美洲之角，太阳也不会吝啬她的温暖，她轻拂过铁窗中人，掠过山间林木，而后更向西行。\n西蒙感受着脸颊的余温，享受着太阳的余晖，他知道阿根廷的太阳已经落下——长夜将至，但太阳永不消逝。如今太阳在北方闪烁，无需多日，南方也将被日光所照耀，在那之前，只需静待时机。\n“待到明日，太阳照常升起。“在阴湿的牢房里，西蒙如此想到。"
 AOR_ORA_events.1.a:0"黑暗中彷徨于无地"
 
 AOR_ORA_events.2.t:0"赤色暖流(其一)"
 AOR_ORA_events.2.d:0 "蜷缩成一团的雷托那看着，看着漆黑的栅栏上断断续续的反射着近圆的光，光昏随着铁的纹路扩散着，好似诉说着其过往……\n“现在过了多少个小时？或者说，已经第二天了？”想着，不禁摸了摸自己浓密的胡须。呆在监舍无疑是对于火地岛囚犯最大的惩罚，如果说被逼着劳动让人厌恶，那么呆在这里简直是一种绝望，一种自己将腐烂在这里的错觉像是扼住了他的喉咙，“要是知道时间就好了……”\n“今天是9月12日，你待了五个小时了，一般来讲，得关一周。”雷纳托猛地回头，错愕的看着自从一开始就不说话的狱友。“虽说食堂离着不远，但声音传不过来，也就不能利用它判断时间”他自顾自的说着，雷纳托才发现他瘦的吓人，骨节都暴露出来。“第一天都不会送食物，自那之后就就能通过三餐，算时间了。”看着对方的眼神，那名狱友笑了，“我叫西蒙.拉托维茨基，从来没从监舍里出去过”"
 AOR_ORA_events.2.a:0"“别这么看我，你们头一次进来的，都想问时间”"
 
 CHI.3.t:0"民国的新时代"
 CHI.3.d:0 "登子不给我文案，记在小本本里了"
 CHI.3.a:0"扬帆起航！"