  AOR_news.22.t:"[Get_title_news_header]                扎格鲁尔宣布埃及独立[Get_title_news_pic]"
  AOR_news.22.d:0"昨日，在遥远的非洲，埃及政府正式宣布独立，结束了长达70年的英国殖民统治。埃及总理扎格鲁尔在开罗的塔里尔广场发表了激情澎湃的演讲，号召全国人民团结起来，建设一个自由、民主、繁荣的新埃及。他还宣布了一系列的政治、经济、社会改革措施，包括实行普选制度、废除苏丹制度、建立国民议会、保护少数民族权利、发展工业和农业、提高教育和卫生水平等。他表示，埃及已经从英国的枷锁中挣脱出来，将走向一个光明的未来。\n扎格鲁尔的演讲受到了广大群众的热烈欢迎和支持，他们高呼“埃及万岁”、“扎格鲁尔万岁”等口号，挥舞着埃及国旗和华夫脱党旗帜，表达了对新政府的信任和期待。一些民众表示，他们感到自己终于成为了一个真正的国家，有了自己的主权和尊严，有了改变命运的机会。\n然而，扎格鲁尔的演讲也引发了一些争议和质疑。一些反对派人士指出，埃及的独立只是表面上的独立，实际上英国仍然控制着埃及的外交、军事、财政等重要领域，扎格鲁尔只是英国的傀儡，他的改革措施只是为了安抚民心，而不是真正解决埃及面临的深层次问题。一些知识分子和学者也认为，扎格鲁尔缺乏政治经验和远见卓识，他的演讲充满了空洞的口号和不切实际的承诺，他没有提出一个清晰和可行的发展规划和路线图，他没有考虑到埃及内部和外部的复杂形势和挑战。"
  AOR_news.22.a:0"独立是一种幻觉，自由是一种奢望。"
  
  AOR_news.23.t:"[Get_title_news_header]          南非总理博塔去世，史末资接任[Get_title_news_pic]"
  AOR_news.23.d:0"南非联邦政府今天宣布，总理路易斯·博塔于昨日晚间因心脏病发作在比勒陀利亚的官邸去世，享年56岁。博塔将军是南非联邦的首任总理，也是一位杰出的政治家和军事家，曾在第一次世界大战中为英联邦立下赫赫战功，又在凡尔赛和会上为南非争取了国际地位。他的去世是南非乃至整个协约国的重大损失。\n根据南非宪法规定，副总理扬·克里斯蒂安·史末资已经自动接任总理一职，并将领导南非党继续执政。史末资也是一位有着丰富经验和卓越才能的政治领袖，曾两次担任国防部长和财政部长，也是国际联盟的创始人之一。他在国内外都享有很高的声望，被誉为“聪明的詹尼”和“詹尼叔叔”。他表示，他将继承博塔将军的遗志，维护南非的团结和稳定，加强与英国和其他英联邦国家的合作，推动国际和平与发展。\n博塔将军的葬礼将于本周五在比勒陀利亚举行，预计有数万民众前来吊唁。英国首相劳合·乔治、澳大利亚总理比利·休斯、加拿大总理罗伯特·鲍登等多位英联邦领导人也将出席葬礼。据悉，博塔将军的遗体将安葬在比勒陀利亚的英雄公墓，与其他为南非建立功勋的人士一同长眠。"
  AOR_news.23.a:0"从今天开始，南非和他一同死去了。"
  
  AOR_news.24.t:"[Get_title_news_header]                     南非工人罢工[Get_title_news_pic]"
  AOR_news.24.d:0"南非的兰德地区，以其丰富的金矿而闻名于世，也是南非政府的经济支柱之一。然而，在这片金光闪闪的土地上，却隐藏着无数的苦难和不公。就在早些天，一场声势浩大的兰德罢工爆发了，革命工团主义分子正式宣布对南非政府宣战，要求改善工人的生活条件和工资水平，同时反对政府对白人工人的歧视和压迫。\n我方记者事发当天深入到了现场，亲眼目睹了这一惊天动地的事件。成千上万的工人手持武器，高呼口号，向政府军发起了猛烈的攻击。政府军毫不留情地向示威者开枪，造成了大量的伤亡。"
  AOR_news.24.a:0"工人有价的命，浇灌出南非无价的金。"