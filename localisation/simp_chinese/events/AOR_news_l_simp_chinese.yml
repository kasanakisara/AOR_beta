  AOR_news.2.t:"[Get_title_news_header]                 比荷卢陷入紧张对峙[Get_title_news_pic]"
  AOR_news.2.d:0"比荷卢联合自伦敦倡议创立之初，就意在维护低地地区的和平与稳定。它开创性的采用了一种独特的三等分议会制度，即每三年由三个国家轮流担任联邦主席团，并拥有最高的决策权。\n近日，比荷卢政府迎来了它的第一次换届选举，政府理应按宪法由荷兰方面将权力交接给卢森堡主席团，但是比利时政府却对此提出了异议，认为卢森堡的人口和经济规模与另外两邦相差悬殊，没有能力来管理联邦的事务。比利时政府要求修改三等分议会制度，让比利时和荷兰方面拥有更多的话语权和资源分配，并且修改卢森堡执政的时长。荷兰方面并未做出过多的表态，但也一再拖延交接权力的具体时间。虽然我们尚不清楚具体细节，但可以肯定是，此举导致了联合陷入了一场前所未有的换届危机。\n卢森堡政府对此表示强烈不满，并指责比利时和荷兰两国严重违反了宪法的原则，企图剥夺卢森堡在联合内的权力。卢森堡呼吁国际社会和国际联盟对此事进行调查和干预，并保障卢森堡的尊严和联合的绝对公平。据可靠消息，国联已经派出了一支观察团前往联合进行调查，并表示将尽快提出解决方案。\n目前，比荷卢的局势仍然紧张，三邦之间的关系也处于冰点。比荷卢民众对此感到深感不安，认为这可能会是风雨欲来的信号。比利时和卢森堡地区也在近期发生了多起恐怖分子袭击事件，在街头煽动着分裂主义情绪。"
  AOR_news.2.a:0"荷兰佬还能干的成什么事？"
  
  AOR_news.3.t:"[Get_title_news_header]                 阿根廷内战尘埃落定[Get_title_news_pic]"
  AOR_news.3.d:0"  在历经了近多年的血腥内战后，阿根廷地区工人会今天对全世界宣布了他们的胜利，彻底打败了军政府和其他反动势力，建立了一个以新大陆工团主义为思想纲要的地区，这是南美洲历史上第一次获得胜利的无政府主义革命，也是全球范围内最激进的工人运动之一。\nFORA的领导人西蒙·拉多维茨基在首都布宜诺斯艾利斯的总工会大楼前发表了胜利演说，他高呼“工人万岁！阿根廷万岁！无政府主义万岁！”并宣布将在不久之后召开第一次工人大会，他还呼吁南美洲的其他无政府组织团结起来，共同反抗英法帝国主义对新大陆的压榨和奴役，组织总罢工力图实现真正的自由和平等。\n然而，对于这一历史性的事件，英国、法国都对此保持沉默，或者只是简单地表示关注，并宣布将在几日后从“暴徒”的窝点撤走一切外交使馆。且正在进行社会主义革命的俄国也没有给予任何支持或者承认。邻国巴西、智利、乌拉圭宣布将于一周后展开交流峰会，抵御恐怖势力的渗透。"
  AOR_news.3.a:0"作为庆祝，今晚小酌一杯！"
  AOR_news.3.b:0"暗地里送去祝贺"
  AOR_news.3.c:0"哪里凉快哪呆着去！"
  
  AOR_news.4.t:"[Get_title_news_header]               马西米连诺一世与世长辞[Get_title_news_pic]"
  AOR_news.4.d:0"  墨西哥第二帝国的皇帝马西米连诺一世于昨日在皇宫中去世，享年89岁。在墨西哥王室内部，他的死亡引发了一场继承危机，因为他没有留下任何合法的子嗣，他的两个养子阿古斯丁·德·伊图尔比德·格林和萨尔瓦多·德·伊图尔比德·马尔赞都声称自己是合法的继承人，而奥地利的哈布斯堡家族和比利时王国也对墨西哥的王位有所觊觎。\n马西米连诺一世与比利时的夏洛特公主没有生育任何孩子。他后来收养了两个墨西哥贵族家庭的孩子作为自己的继承人。\n然而，在马西米连诺去世后，两个养子之间爆发了激烈的争夺战。双方互不相让，墨西哥全国陷入了分裂和混乱，国家已经进入了紧急状态。与此同时，奥地利和比利时也在暗中插手这场继承危机。奥地利认为马西米连诺没有合法的后代，因此墨西哥王位应该归还给哈布斯堡家族。比利时则认为夏洛特公主是马西米连诺唯一的合法配偶，因此墨西哥王位应该由她的亲属继承。两国都派遣了使者前往墨西哥，试图影响局势的发展。\n可以预见，这场继承危机对新大陆的影响是重大的。许多人担心这会引发一场新的内战或者外部干涉，危及到墨西哥第二帝国近60年来建立起来的稳定和繁荣。也有人希望这会给墨西哥带来一次改革和民主化的机会，结束专制和贵族统治。"
  AOR_news.4.a:0"人固有一死…"

  AOR_news.5.t:"[Get_title_news_header]                       夏洛特摄政[Get_title_news_pic]"
  AOR_news.5.d:0"  在墨西哥第二帝国皇帝马西米连诺一世逝世的两个月后，该国陷入了前所未有的动荡和混乱。今日上午，皇后夏洛特宣布进行临时摄政，直到“国家的危机解除”，并试图与法国恢复外交关系，以寻求支持和承认。\n据悉，墨西哥工人总联合会，这一无政府主义与工团主义组织，在混乱中借机起兵，占领了国内多个要点，他们宣布为了一个崭新的新大陆而战，并呼吁全国各地的工人与学生加入他们的革命行列。\n与此同时，墨西哥其他地区也有不少的人蠢蠢欲动，意图在这次危机中谋权篡位。据传闻，墨西哥北部的一些州长和将军已经与美国达成了秘密协议，准备宣布独立或并入美国。墨西哥南部的一些原住民部落也趁机反抗中央政府的统治，要求恢复他们的传统权利和文化。\n在这样的情况下，皇后夏洛特面临着巨大的压力和困难。等待着她的将是国内接踵而至的麻烦，她是否能够挽救这个岌岌可危的帝国，还是会成为历史上又一个短命的摄政者，我们仍需要时间来进一步观察。"
  AOR_news.5.a:0"没有神，也没有主人!"
  AOR_news.5.b:0"新大陆人人有病"
  
  AOR_news.6.t:"[Get_title_news_header]                  墨西哥革命被平息[Get_title_news_pic]"
  AOR_news.6.d:0"  在经历了四年的内战和外部干涉后，墨西哥第二帝国的皇后夏洛特宣布她已经成功地平息了国内的叛乱和分裂，恢复了国家的统一和稳定。然而，她同时也声明国家仍然处于无政府主义不确定的危险之中，因此她将继续摄政下去，直到两位养子有能力接管王位。"
  AOR_news.6.a:0"又是这种话术..."
  
  AOR_news.7.t:"[Get_title_news_header]                 墨西哥革命落下帷幕[Get_title_news_pic]"
  AOR_news.7.d:0"  在经历了四年的内战之后后，工人总联合会，这一无政府主义与工团主义组织，宣布他们已经成功地推翻了夏洛特皇后的摄政政府，建立了“自由和平等的墨西哥工人总联合会”。内战胜利之后，他们在墨西哥城中心举行了盛大的胜利游行和庆祝活动，阿根廷地区工人会也即刻发出了贺电。"
  AOR_news.7.a:0"伟大的胜利！"
  AOR_news.7.b:0"安人已经势不可挡了"
  
  AOR_news.8.t:"[Get_title_news_header]                 墨西哥革命落下帷幕[Get_title_news_pic]"
  AOR_news.8.d:0"  经历了四年的内战之后，下加利福尼亚的马贡主义的墨西哥自由军团联合会，这一无政府主义组织，宣布他们已经成功地击败了夏洛特的摄政政府，并与南部的工人总联合会合作，共同解放了整个墨西哥。内战胜利之后，他们在墨西哥城中心举行了盛大的胜利游行和庆祝活动，阿根廷地区工人会也即刻发出了贺电。"
  AOR_news.8.a:0"伟大的胜利！"
  AOR_news.8.b:0"安人已经势不可挡了"
  
    
  AOR_news.9.t:"[Get_title_news_header]                      夏洛特皇后逝世[Get_title_news_pic]"
  AOR_news.9.d:0"  在六年的统治之后，墨西哥第二帝国的皇后夏洛特于今天在墨西哥城去世。她的死亡标志着一个悲惨的传奇的终结，也引发了人们对墨西哥历史上最动荡和血腥的时期的回忆和反思。\n在墨西哥的继承危机时，夏洛特皇后宣布国家进入紧急状态开始进行摄政，并成功的平息了墨西哥的分离主义骚乱和无政府主义起义，重新统一了帝国。\n夏洛特皇后于今天早上在睡梦中安详地去世，没有留下任何遗嘱，国家再一次进入到了继承危机之中。她的遗体将被安葬回拉肯圣母教堂，与她的父亲利奥波德一世和弟弟利奥波德二世一起。"
  AOR_news.9.a:0"似曾相识燕归来..."
  
  AOR_news.15.t:"[Get_title_news_header]               中美洲运河公司统一中美[Get_title_news_pic]"
  AOR_news.15.d:0"  今日，中美洲联合安保与运河公司共同管理人塞缪尔·那穆瑞宣布解散中美洲联邦的一切行政与管理机关。与此同时，联合安保的警察在全国范围内抓捕破坏分子，一切事务将由中美洲管理委员会暂时接管。早在中美洲分裂之时，他所带领的武装部是一个几乎没有人看好的干涉势力，可没人想到他最终赢得了内战的胜利，而且在数年后横扫中美各国，甚至将运河公司收入麾下。现在，两个巨型企业踏着中美洲人民的尸骨走上了世界舞台，一场由血泪，轰鸣与炫彩的历史翻开了篇章。"
  AOR_news.15.a:0"天使与财富到来..."
  AOR_news.15.b:0"而随后的便是地狱"
  
  AOR_news.11.t:"[Get_title_news_header]                 1920年安特卫普奥运会[Get_title_news_pic]"
  AOR_news.11.d:0"  历时近五个月的第七届夏季奥林匹克运动会今天在这座受大战摧残的城市落下帷幕。本届奥运会是一次和平与重生的盛会，也是一次创纪录与惊喜的盛会。来自29个国家和地区的2591名运动员参加了22个大项154个小项的比赛，其中包括了首次出现的拳击、马球、橄榄球、曲棍球等项目，以及重新恢复的举重、拔河等项目。冬季项目也再度登上奥运会的舞台，花样滑冰和冰球吸引了众多观众的目光。\n在奖牌榜上，美国队以41金27银27铜的成绩高居榜首，瑞典队以19金20银25铜紧随其后，英国队以15金15银13铜位居第三。东道主比荷卢队也表现不俗，获得了13金11银11铜的佳绩，排名第五。芬兰队则成为本届奥运会最大的黑马，凭借跑步奇才帕沃·鲁米和其他优秀选手的努力，斩获了15金10银9铜的奖牌，位列第四。\n尽管一战刚刚结束不久，各国之间还存在着深深的伤痕和隔阂，但是在奥林匹克精神的感召下，各国运动员展现了高尚的体育道德和人文情怀。可以肯定的是，这届奥运会不仅是一次体育盛宴，也是一次人类文明的盛宴。它将成为人类历史上一个永恒的里程碑，它将激励和鼓舞后人继续追求和平与进步的崇高理想。"
  AOR_news.11.a:0"和平需要勇气！"
  AOR_news.11.b:0"安特卫普…我们的家"
  
  AOR_news.12.t:"[Get_title_news_header]                   1924年巴黎奥运会[Get_title_news_pic]"
  AOR_news.12.d:0"  今天，第八届夏季奥林匹克运动会在巴黎隆重开幕。这是一场历史性的开幕式，标志着奥林匹克运动进入了一个新的时代。\n本届奥运会是巴黎第二次举办夏季奥运会，在今天的开幕式上，法国总统亲自发表了讲话，他对本届奥运会的组织者和参与者表示了热烈的欢迎和祝贺，他还强调了奥林匹克运动对于促进世界和平和友谊的重要意义。随着他宣布本届奥运会正式开幕，一声炮响响彻云霄，万众欢呼。\n在《马赛曲》的伴奏下，各国代表团依次入场，他们身着各自的服装和旗帜，向观众致意。其中引起最大轰动的是美国游泳运动员约翰尼·维斯穆勒，他身穿一件白色泳衣，手持美国国旗，引起了女性观众的尖叫和欢呼。另外，中国代表团也首次出现在奥运会上，虽只是三名网球手参与了表演赛，但仍然引起了人们的关注和好奇。\n在今天的开幕式上，我们感受到了一种新的气氛和活力，也看到了一种新的形象和风格。这是一场历史性的开幕式，也是一场前所未有的盛会。让我们期待接下来的比赛和表演，让我们期待奥林匹克运动的更加辉煌！"
  AOR_news.12.a:0"更快、更高、更强！"
  
  AOR_news.13.t:"[Get_title_news_header]                        视觉革命![Get_title_news_pic]"
  AOR_news.13.d:0"  昨天，在伦敦的一间小实验室里，一场历史性的事件发生了。苏格兰发明家约翰·洛吉·贝尔德成功地用电子信号在屏幕上显示了一个木偶的图像，这是世界上第一次实现了电视的原理。\n贝尔德先生向我们介绍了他的发明，他称之为“电视望远镜”。他说，他利用了一个快速旋转的圆盘，上面有一些小孔，通过这些小孔，可以将一个物体的影像分成许多部分，并将它们转换成电流。然后，这些电流通过电线传送到另一个旋转的圆盘上，上面有一个荧光屏，可以将电流还原成图像。这样，就可以在远处看到一个物体的动态影像。\n贝尔德先生说，他的目标是将电视技术发展到可以传送人类的面部表情和声音，并将其应用于教育、娱乐和新闻等领域。他认为，电视将会给人类带来无限的可能性和想象力。"
  AOR_news.13.a:0"崭新的纪元"
  
  AOR_news.14.t:"[Get_title_news_header]                    伦敦惊现神奇霉菌[Get_title_news_pic]"
  AOR_news.14.d:0"  一种能够杀死多种有害细菌的神奇霉菌在伦敦圣玛丽医学院被发现，这可能是人类抗击传染病的重大突破。这种霉菌被命名为青霉素，是由该院的细菌学教授亚历山大·弗莱明在偶然中发现的。据悉，弗莱明教授在培养葡萄球菌的过程中，发现了一个被青霉菌污染的培养皿。令他惊讶的是，在青霉菌周围，原本生长旺盛的葡萄球菌竟然消失了，似乎被青霉菌分泌的某种物质所抑制或杀死。\n弗莱明教授随即对这种霉菌进行了进一步的研究，发现它的“霉菌液”能够杀死多种有害细菌，如链球菌、脑膜炎球菌和白喉杆菌等。他还发现，这种物质对人体细胞和血液没有任何不良影响，因此有望成为一种安全有效的抗菌药物。\n弗莱明教授今天在圣玛丽医学院公布了他的发现，并在《英国实验病理学期刊》上发表了论文。他表示，他已经将青霉素分离出来，并希望能够提纯和制备出更多的量，以便进行更广泛的实验和试验。\n据了解，弗莱明教授已经与牛津大学和美国农业部等机构建立了合作关系，共同推进青霉素的研究和开发。他还表示，他愿意与世界各地的科学家分享他的发现和经验，共同探索青霉素的更多用途和潜力。"
  AOR_news.14.a:0"天赐神药吗？"