 BAV.1.t:0"奥古斯特·倍倍尔"
 BAV.1.d:0"即使是李卜克内西和卢森堡这样优秀的革命家也难掩斯巴达克之颓势，红色政权正处风雨飘摇之中。“斯巴达克同盟被粉碎了！”从《邮报》到《前进报》都发出了欢呼。\n火车自瑞士向巴伐利亚驶去。跨过高山，渐渐能看见田野与炊烟了。窗边的老人把目光自窗外收回来，顿在新收到的报刊上——那是小李卜克内西最近的一次演讲。\n“他们今天就已经失败了！因为他们想把那些人当作自己的工具来使用，今天却已经成了那些人的俘虏，而且他们历来都是那些人的工具。”\n就像老威廉所了解过的那样，卡尔的性格还是那样冲动。而对于罗莎——她做出的妥协太多，她需要知道一个社会主义者应当在什么时候强硬，就像不久前伊里奇向察里津前线致电时批评的那样。\n无论如何，斯巴达克同盟经受不起又一次失败。火车上倍倍尔又一次回想起自己把自传托付给考茨基时的那个下午。他一定要看到这红色的种子在欧洲大地上开花结果："
 BAV.1.a:0"“不顾一切”"
 
 
 
 
 
 BAV.2.t:0"一场噩梦"
 BAV.2.d:0"灰暗的天幕淅淅沥沥的滴下水珠，空中的雨点组成帘幕遮蔽了前路，发出恼人的，犯恶心的声音。弗朗士的胸口不由得有些发闷，轻按下脖颈，一把抹掉了额头上的雨水，加紧了脚步赶路。\n老友现在在巴伐利亚机械制造厂上班，对于现在的弗朗士来说，这段路还是太长了。推开宿舍的门，吱呀吱呀的叫声牵扯着他的神经，眼前有点发黑，不由得身形一矮，捂住脑袋\n“砰！”\n天旋地转，这声炸弹的巨响将摇摇欲坠的他推下记忆之崖，前线和手中的武器就在眼前，血肉擦过头顶，浑身粘腻，肺被拽住了一般无法呼吸，枪炮声使他头晕，“声音……阻止……”\n弗朗士有气无力的喃喃道，现实的门框和虚幻的记忆交替展现，而他脚步虚浮，无法迈过门槛，战友熟悉的声音又一次回响了。\n“革命必将取得胜利！”\n“不！不！不！”佛朗士惊醒了起来，而他什么都拦不住，如同那年的那个夏天。\n又一声巨响响起，是现实中的？还是当年的炮火正中目标？血肉飞入口中，咸腥的味道直冲口鼻，即使半跪于地面，却依然无法于大地之中找寻安宁。\n佛朗士努力起身，迈过门槛，他和他的军队必须夺下柏林，南方联军必须获胜...\n不成人样的尸体横在他的面前，而破碎的话语扎入心灵，给了他最后一击。“暂停作战计划！暂停作战计划！”\n耳边只响起友人微弱的喊叫，他彻底瘫倒在地上。"
 BAV.2.a:0"我们...还是输了。"

 BAV.4.t:0"一封共产国际的电报"
 BAV.4.d:0"“同志们！我认为，在俄国事变之后，在德国一月斗争之后，特别需要指出，无产阶级运动的最新形式也在其它国家中产生出来，并取得了统治地位。例如，今天我在一份反社会主义的报纸上看到一条电讯，说英国政府接见了伯明翰工人代表苏维埃，并表示愿意承认苏维埃是经济组织...”\n第一国际大会的电报自莫斯科发来，斯巴达克同盟知道，在东欧广阔的原野上，也有那样一群人在与反动的帝国主义作斗争——尽管他们的境遇一样的焦灼。倍倍尔当然知道那则新闻——英帝国主义政府做出了妥协，而德国的火种便在于这巴伐利亚苏维埃。于是倍倍尔在木桌前坐下，拿出笔来作出批示。他知道接下来的会议将决定这个政权的走向。\n共产国际。一个无产阶级的国际组织。它将打破国界，为全世界受压迫者带去科学的理论与实际的支援。“同志们！我代表俄国共产党中央委员会衷心地欢迎你们。现在我提议选举主席团。请提名。”俄国的同志们说。于是，巴伐利亚回复道："
 BAV.4.a:0"“我们将尽快派代表前往莫斯科。”"
 
 BAV.10.t:0"受挫的革命与新生的苏维埃"
 
 BAV.5.t:0"德意志的新生"
 BAV.6.t:0"卢森堡的见闻"
 BAV.7.t:0"妇女的解放"
 BAV.8.t:0"李卜克内西的一日"
 BAV.700.t:0 "列宁对德国的预言"
 BAV.700.d:0 "列宁在1920年，在他的书《对德意志的若干看法与德意志革命走向》中说到，“现在的德国虽然被英法两大帝国主义列强压制着，但这种处境并不能用弱者地位的伪装掩盖柏林仍然坐着一个资产阶级右派的事实.......德国的地方邦权主义很严重，这一地方与中央的矛盾将会在一日卸下柏林伪善的面貌，露出他血腥残忍的真相，当封建主义与资本主义会集中爆发矛盾时，德国革命的时机就来了。”而现在，他的预言就快要实现了。"
 BAV.700.a:0 "收拾收拾，我们重返柏林！"
 BAV.800.t:0 "对柏林及德意志蛀虫的征讨檄文"
 BAV.800.d:0 "各位同志们，苏维埃红军官兵们，政治工作者们，工人和农民阶级们，各位苏维埃的成员们，智力劳动者们和暂时陷在强敌压迫之下的兄弟姐妹们！\n今日，我们在极其严重的外部条件的情况下，召开这次大会，在外部，法兰克福这头毒蛇对我们的苏维埃政权虎视眈眈\n在北方的波美拉尼亚早已沦为保皇党，民族主义者和亲柏林者混战的战场，他们甚至不再关心自己的人民，把无产阶级当作这些所谓“精英”的政治工具\n柏林的艾伯特，威斯特伐利亚的提尔比茨，独裁政治甚至在德国这一个诞生了伟大革命导师马克思，恩格斯的国土上越发猖狂\n但是，我们有过比现在处境更加危急的日子，试回忆1918年，我们在十一月革命那时候的情况，当时我们不光要面临内部的反革命势力\n并且我们还要面对外部的侵略者——哪些协约国军队，我们的大部分的既有领土被外国武装和内部反革命分子控制着，但是我们不曾放弃\n最终，我们在战火中组织起了联盟和军队，虽然大的革命最终失败，但是我们仍在巴伐利亚组织起了苏维埃政权。\n现在，我们的情况要远比1918年前好得多，我们成功的完成了各方面的革命，我们建立了自己的军队\n我们重启了因战乱关闭的慕尼黑大学，我们组建起了对抗独裁和反革命分子的统一战\n我们现在的政权要远比那个时候稳固的多，我们现在扔想1918年一样反对他们，拉起革命的大旗\n我们一定会胜利，敌人并不像哪些被吓破了胆的人描述的这么厉害\n敌人是始终无法打败我们的，因为我们有人民的统一战线，我们目标一致，\n而敌人什么也没有，并且他们终将陷在人民战争之中\n各位，现在全世界的共产主义者，工人阶级和农民阶级都在望着你们\n期待着无产阶级革命能够在这片诞生马克思，恩格斯的土地上生根发芽\n现在解放的使命就落在你们的肩膀上，你们不愧是这个时代的解放者！\n我们今日要向全联邦的反动政权发动整套，让这群德意志的蛀虫被无产阶级的候鸟啄死\n这个世界是我们无产阶级的！"
 BAV.800.a:0 "慷慨激昂"
 BAV.520.t:0 "致内测玩家的一封信"
 BAV.520.d:0 "欢迎游玩巴伐利亚苏维埃，也欢迎游玩AOR。这是逻各斯留在这里的一个小小的彩蛋，我在这里需要感谢为巴伐利亚苏维埃做出贡献的制作组成员，包括组长blo，代码花花，代码imagination，文案菊，还有我逻各斯。以及再次感谢我们所有的制作组成员，没有你们的任何一个，AOR都不会是现在的样子。同时，我最要感谢的，还是——屏幕前的你。感谢你的游玩。"
 BAV.520.a:0 "新年快乐"
 





















































































































































































































































































































































































































































































































 BAV.1000000.t :0 "堂堂归乡!"
 BAV.1000000.d :0 "在经过了一切的颠簸流离之后,在他自己和英国人努力之后,久违的新天鹅城堡出现在面前,他抚摸着这栋建筑的每一寸角落,似乎是在寻回童年时的记忆与少年时的意气风发,30岁的疆场生涯已经将这个近50多岁的老人折磨得不成人样,时光划过的痕迹是脸上的皱纹,当再次回到家,只是一切的断壁残垣,但亲王不得不面对这一切,面对着巴伐利亚的人民,他早已不再热血,但他不得不再为德意志人民出征!."
 BAV.1000000.a :0 "亲王回到了他忠诚的巴伐利亚"
