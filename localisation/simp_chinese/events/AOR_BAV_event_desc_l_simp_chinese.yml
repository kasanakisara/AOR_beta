 BAV.14.t:0"第一次革命之殇"
 BAV.14.d:0""
 BAV.700.t:0 "列宁对德国的预言"
 BAV.700.d:0 "列宁在1920年，在他的书《对德意志的若干看法与德意志革命走向》中说到，“现在的德国虽然被英法两大帝国主义列强压制着，但这种处境并不能用弱者地位的伪装掩盖柏林仍然坐着一个资产阶级右派的事实.......德国的地方邦权主义很严重，这一地方与中央的矛盾将会在一日卸下柏林伪善的面貌，露出他血腥残忍的真相，当封建主义与资本主义会集中爆发矛盾时，德国革命的时机就来了。”而现在，他的预言就快要实现了。"
 BAV.700.a:0 "收拾收拾，我们重返柏林！"
 BAV.800.t:0 "对柏林及德意志蛀虫的征讨檄文"
 BAV.800.d:0 "各位同志们，苏维埃红军官兵们，政治工作者们，工人和农民阶级们，各位苏维埃的成员们，智力劳动者们和暂时陷在强敌压迫之下的兄弟姐妹们！\n今日，我们在极其严重的外部条件的情况下，召开这次大会，在外部，法兰克福这头毒蛇对我们的苏维埃政权虎视眈眈\n在北方的波美拉尼亚早已沦为保皇党，民族主义者和亲柏林者混战的战场，他们甚至不再关心自己的人民，把无产阶级当作这些所谓“精英”的政治工具\n柏林的艾伯特，威斯特伐利亚的提尔比茨，独裁政治甚至在德国这一个诞生了伟大革命导师马克思，恩格斯的国土上越发猖狂\n但是，我们有过比现在处境更加危急的日子，试回忆1918年，我们在十一月革命那时候的情况，当时我们不光要面临内部的反革命势力\n并且我们还要面对外部的侵略者——哪些协约国军队，我们的大部分的既有领土被外国武装和内部反革命分子控制着，但是我们不曾放弃\n最终，我们在战火中组织起了联盟和军队，虽然大的革命最终失败，但是我们仍在巴伐利亚组织起了苏维埃政权。\n现在，我们的情况要远比1918年前好得多，我们成功的完成了各方面的革命，我们建立了自己的军队\n我们重启了因战乱关闭的慕尼黑大学，我们组建起了对抗独裁和反革命分子的统一战\n我们现在的政权要远比那个时候稳固的多，我们现在扔想1918年一样反对他们，拉起革命的大旗\n我们一定会胜利，敌人并不像哪些被吓破了胆的人描述的这么厉害\n敌人是始终无法打败我们的，因为我们有人民的统一战线，我们目标一致，\n而敌人什么也没有，并且他们终将陷在人民战争之中\n各位，现在全世界的共产主义者，工人阶级和农民阶级都在望着你们\n期待着无产阶级革命能够在这片诞生马克思，恩格斯的土地上生根发芽\n现在解放的使命就落在你们的肩膀上，你们不愧是这个时代的解放者！\n我们今日要向全联邦的反动政权发动整套，让这群德意志的蛀虫被无产阶级的候鸟啄死\n这个世界是我们无产阶级的！"
 BAV.800.a:0 "慷慨激昂"
 BAV.520.t:0 "致内测玩家的一封信"
 BAV.520.d:0 "欢迎游玩巴伐利亚苏维埃，也欢迎游玩AOR。这是逻各斯留在这里的一个小小的彩蛋，我在这里需要感谢为巴伐利亚苏维埃做出贡献的制作组成员，包括组长blo，代码花花，代码imagination，文案菊，还有我逻各斯。以及再次感谢我们所有的制作组成员，没有你们的任何一个，AOR都不会是现在的样子。同时，我最要感谢的，还是——屏幕前的你。感谢你的游玩。"
 BAV.520.a:0 "新年快乐"
 


















































































































































































































































































































































































































































































































