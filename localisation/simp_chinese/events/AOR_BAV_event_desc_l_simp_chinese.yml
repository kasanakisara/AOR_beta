 BAV.1.t:0"奥古斯特·倍倍尔"
 BAV.1.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank “即使是李卜克内西和卢森堡这样优秀的革命者也难掩斯巴达克之颓势，红色政权正处风雨飘摇之中。‘斯巴达克同盟被粉碎了！’从《邮报》到《前进报》都发出了这般的欢呼。”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 火车自瑞士向巴伐利亚驶去。跨过高山，渐渐能看见田野与炊烟了。窗边的老人把目光自窗外收回来，顿在新收到的报刊上——那是小李卜克内西最近的一次演讲。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “他们今天就已经失败了！因为他们想把那些人当作自己的工具来使用，今天却已经成了那些人的俘虏，而且他们历来都是那些人的工具。”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 就像老威廉所了解过的那样，卡尔的性格还是那样冲动。而对于罗莎——她做出的妥协太多，她需要知道一个社会主义者应当在什么时候强硬，就像不久前伊里奇向察里津前线致电时批评的那样。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 无论如何，斯巴达克同盟经受不起又一次失败。火车上倍倍尔又一次回想起自己把自传托付给考茨基时的那个下午。他一定要看到这红色的种子在欧洲大地上开花结果："
 BAV.1.a:0"“不顾一切。”"
 
 
 
 
 
 BAV.2.t:0"一场噩梦"
 BAV.2.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 灰暗的天幕淅淅沥沥的滴下水珠，空中的雨点组成帘幕遮蔽了前路，发出恼人的，犯恶心的声音。弗朗士的胸口不由得有些发闷，轻按下脖颈，一把抹掉了额头上的雨水，加紧了脚步赶路。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 老友现在在巴伐利亚机械制造厂上班，对于现在的弗朗士来说，这段路还是太长了。推开宿舍的门，吱呀吱呀的叫声牵扯着他的神经，眼前有点发黑，不由得身形一矮，捂住脑袋。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “砰！”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 天旋地转，这声炸弹的巨响将摇摇欲坠的他推下记忆之崖，前线和手中的武器就在眼前，血肉擦过头顶，浑身粘腻，肺被拽住了一般无法呼吸，枪炮声使他头晕，“声音……阻止……”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 弗朗士有气无力的喃喃道，现实的门框和虚幻的记忆交替展现，他脚步虚浮，无法迈过门槛，战友熟悉的声音又一次回响了。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “革命必将取得胜利！”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “不！不！”佛朗士惊醒了起来，而他什么都拦不住，如同那年的那个夏天。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 又一声巨响响起，是现实中的？还是当年的炮火正中目标？血肉飞入口中，咸腥的味道直冲口鼻，即使半跪于地面，却依然无法于大地之中找寻安宁。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 佛朗士努力起身，迈过门槛，他的军队必须夺下柏林，南方联军必须获胜...\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 不成人样的尸体横在他的面前，而破碎的话语扎入心灵，给了他最后一击。“暂停作战计划！暂停作战计划！”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 耳边只响起友人微弱的喊叫，他彻底瘫倒在地上。"
 BAV.2.a:0"我们...还是输了。"

 BAV.3.t:0"祝福"
 BAV.3.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 记忆被生硬的掐断，撕裂，思维被粗暴的搅碎，糅合。身体虚弱的完全不能动弹，勉力挣开的眼睑，目光的尽头也只有模糊的苍白。有那么一瞬，倍倍尔已然忘记了自己是谁，自己身在何处。但他迅速催动生涩的大脑，企图弄清当下处境。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “我最后在工作……”记忆中闪过那张朴素的书桌，“……还有很多工作没有完成……”倍倍尔再次奋力试图坐起，但徒劳无功，身体末梢几无响应。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “巴伐利亚根据地的情况我最清楚，我还需要为年轻人们多做些努力……”柏林城外一夜的火光，腹背受敌，山穷水尽的革命同盟星星点点的闪耀在眼前，划过脑海，虽然巴伐利亚根据地在短短几年的时间里大踏步的向人人有动力，有热情，有信仰的革命热土迈进，但还不够，还远远不够。德意志革命，世界革命的重担仍然悬在肩头……\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 房门洞开，数个脚步急切的接近，声声话语打破宁静，但无论倍倍尔如何努力地去分辨，去倾听，这些词句都好像远在天边般模糊，只能听出许多熟悉的人，熟悉的同志的呼唤。李卜克内西，卢森堡，梅林，莱文……\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “他们不该都在这，他们也都有工作，他们来这干嘛？我估计病倒了……但他们也不该这么摆这么大的阵仗……”倍倍尔为之忧心，为革命的前景忧心，为年轻同志们的指引忧心，“我还有……很多工作……”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 心脏骤然传来一阵剧痛，昭示着老革命家的病因，也宣告着生命终点的迫近。老革命家一定要嘱咐同志们些什么，奋力撑起病躯，雾蒙蒙的双瞳扫过一尘不染的病房，终坚定的聚焦在床头人影上，只见得一幅幅年轻的，朝气蓬勃的，洋溢着热情与关切的脸庞。思虑万千，千言万语汇集到嘴边，竟无语凝噎。老革命家最终释然的笑了，他没有，也无需说出条条详尽的嘱咐，只仿若一位慈祥的老父亲，骄傲于自己优秀的儿女，轻声而坚定的道出人生最后一言，不是嘱咐，而是祝福："
 BAV.3.a:0"“世界，正年轻。”"
 
 BAV.4.t:0"一封共产国际的电报"
 BAV.4.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank “同志们！我认为，在俄国事变之后，在德国一月斗争之后，特别需要指出，无产阶级运动的最新形式也在其它国家中产生出来，并取得了统治地位。例如，今天我在一份反社会主义的报纸上看到一条电讯，说英国政府接见了伯明翰工人代表苏维埃，并表示愿意承认苏维埃是经济组织...”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 第一国际大会的电报自莫斯科发来，斯巴达克同盟知道，在东欧广阔的原野上，也有那样一群人在与反动的帝国主义作斗争——尽管他们的境遇一样的焦灼。倍倍尔当然知道那则新闻——英帝国主义政府做出了妥协，而德国的火种便在于这巴伐利亚苏维埃。于是倍倍尔在木桌前坐下，拿出笔来作出批示。他知道接下来的会议将决定这个政权的走向。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 共产国际。一个无产阶级的国际组织。它将打破国界，为全世界受压迫者带去科学的理论与实际的支援。“同志们！我代表俄国共产党中央委员会衷心地欢迎你们。现在我提议选举主席团。请提名。”俄国的同志们说。于是，巴伐利亚回复道："
 BAV.4.a:0"“我们将尽快派代表前往莫斯科。”"
 
 BAV.10.t:0"会址"
 BAV.10.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 斯巴达克大会的会址仍旧选在慕尼黑的老市政厅，这座有着百年历史的典雅建筑再一次熙熙攘攘充满生机。这座比在座的代表们还古老的多的哥特建筑的每一扇剔透的窗棂，每一座高耸的塔尖都见证了德意志的百年兴衰。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 最一开始，霍亨佐伦的黑鹰骄傲加冕，为自己赢下德意志帝国之名。前巴伐利亚公国的王侯将相和铁血帝国的行政官僚们端坐在席位上发号施令。财富与野心，眼光下的土地，皆以帝皇的荣耀之名号令路径的公民肃静，臣服。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 世界大战的业火炙烤着帝皇的家国，焚灭了钢铁与鲜血铸就的权柄，烧尽了野兽们的理智。军部政变，架空皇帝，一队队身着黑衣头戴钢盔的兵士接管了这里，以枪弹的强权命令路径的公民为德意志的生存，在德意志的土地上效死。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 帝国战败，权威崩溃，来到这里的是趾高气昂的英国人和法国人。他们和容克，资本家沆瀣一气，戴上白手套精细优雅的将路径的公民榨干价值，分食殆尽。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 而今日，路径的公民自发清理街道上的瓦砾与坑洼，孩子们欢声笑语的经过市政厅门口，不再畏惧于这高耸威严的建筑。因为他们明白，头一次，其中的争吵与辩论时为了他们；头一次，其中的演讲与宣告是讲给他们；头一次，其中的席位，坐着他们自己。"
 BAV.10.a:0"理应如此。"
 BAV.6.t:0"乡下见闻"
 BAV.6.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 日影高悬，明媚的照亮了慕尼黑郊外的田野，如此澄澈的日光打在卢森堡女士胸前口袋里的钢笔，反射出耀眼的白芒，似能刺破一切丑恶与黑暗。今天的党干部女士一幅干练的记者打扮，心中谨记倍倍尔的教诲：到乡下去，到基层去，深入了解革命的面貌。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 一对田野边的身影吸引了“记者小姐”的注意力，年轻的税务官正手足无措的宽慰着身型佝偻的老农。“同志，工作遇到麻烦了吗？”“记者小姐”快步上前，“老先生，苏维埃政权是建立在劳动人民的诉求上的，有麻烦您尽管讲。”老农抬起悲苦的面容，缓缓道出了一个辛酸的故事，一个勤劳的德国公民，一个幸福美满的家庭是如何被帝国主义和封建制度抽筋拨皮，挖骨吸髓的故事：\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “起先是世界大战的时候，小伙子们高歌着什么‘皇帝的荣耀’，‘再现普法战争的辉煌’奔赴前线，我女儿还甚至给她哥哥唱歌送别。谁知……谁知不到三个月，送回家的就只有冰冷的死亡通知，他们连他的尸体都没能找回来……”老农静静的叙述，脸上已无痛苦，只余麻木，“没办法，生活还得继续，只能找了个容克当雇农……不，他简直就是个畜生！但我别无选择……”老人眼中似乎要喷出火来，卢森堡女士也赶紧追问：“不会再有封建地主了，您有委屈尽管讲。”“他假借什么‘德国金融崩溃’之类的狗屁的理由威逼利诱我们换用他发行的‘抵债券’，实际上就是把我们和他的地绑死，当他的农奴！”“真是岂有此理！”卢森堡女士也跟着怒火中烧，转头看向税务官：“人呢？追查到了吗，私自发行货币可是重罪。”税务官万般无奈：“是我们南下之前的事情了，这帮封建渣滓们早就卷走一切逃跑了，只剩下无数和老先生一样的破产工农……”"
 BAV.6.a:0"任重道远。"
 BAV.7.t:0"妇女的解放"
 BAV.8.t:0"李卜克内西的一日"
 BAV.8.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 老车工叼着根纸烟，向组长打好招呼后，从车间探出来，长满老茧的手从满是灰尘的口袋里摸出根火柴来，在帆布裤上啪的一下擦燃了，勉强点着了烟，才闭了眼，慢慢呼出一个烟圈来。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 昨天他的学徒还在跟人家讨论，说历史的发展是迂回曲折的。现在出现了这样的情况：正是德意志，除了体现无限的扩张欲与高压的专制，同时又体现了纪律、组织、在现代工业基础上的紧密协作以及极严格的计算与监督的原则。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 现在，他们——慕尼黑的工人们继承了旧世界的一切——他们的文化，他们的组织，他们的思想。继承了德意志严谨而成熟的工业资源的，一粒革命的种子从资本主义世界一角的废墟中又一次发起芽来。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “而这正是我们所缺少的。这正是我们要学会的。这正是我们伟大斗争由胜利的开始经过许多严重考验而走向胜利的结局所缺少的东西。这正是巴伐利亚苏维埃不再做又贫穷又衰弱的军阀，而永远成为又强大又富饶的国家所需要的东西。”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 恍惚间，老车工听见，在中央政府的飞机终于悠然远去时，柏林城下的血海中有人讲起话来。那声音愈来愈响亮，终于爆发成欢呼。那血海中忽而探出一只手来，拍了拍他宽阔而僵硬的背。手中的步枪滑落，成一根未熄的烟头。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “师傅，大伙都在那边听讲演呢。”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “小子！……又是谁来了?”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “李卜克内西！”那学徒拉着他的师傅，要往那人群中跑去，“小李卜克内西到我们厂来了！”"
 BAV.8.a:0"——也许，革命的火焰可能再次燃遍德意志。"
 BAV.15.t:0"欧根·莱文"
 BAV.15.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 又是巴伐利亚繁忙的早晨，在慕尼黑的政府大楼里，桌子上堆着如山如海的文件，坐在桌子前的弗兰茨.梅林却放下了手中的笔，将一沓白色信封拿起兵交给了隔壁的欧根.莱文。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 在政府大楼中充当梅林秘书作用的莱文吃惊地看了看梅林手中握着的那一沓文件。“您要交给我这些文件做什么？”莱文疑惑的说道。“很好，莱文同志，给我把这些文件办妥了，我老了，现在处理不了这么多的东西。”梅林露出那大胡子下面的一抹微笑。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 莱文平常只是稍微帮梅林处理一些简易文件，可是今天这一沓子文件对他来说着实算一种挑战。“年轻的革命家就是要有作为，面对工作就是要保持一个革命者的精神来去完成。”梅林说道。“像你这样年轻的革命者是我党所需要的，总不可能让我一个人来处理党内的所有事物，所以需要你来帮我。”“我明白了，这些……我现在立马开始处理。”莱文随即接过文件，打开信封并开始浏览这些密密麻麻的高级德文。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 两人从早上忙到晚上，但终究还是梅林批阅文件批阅的多-不过他总是容易睡在办公桌上，而现在的莱文可以挑灯夜战，处理老革命家暂时消化不了的东西。一个老人和一个年轻人，一拿和一放，就这么构成了这两间办公室的日常活动。"
 BAV.15.a:0"莱文拿到的文件怎么越来越多了。"
 BAV.14.t:0"第一次革命之殇"
 BAV.14.d:0"德意志巴伐利亚苏维埃政府致符腾堡政府\n\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 你们好，亲爱的战友与兄弟！这里是来自巴伐利亚苏维埃政府的一封呼吁信，我们希望贵政府能了解我们的想法。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 内战后，南方同盟已经土崩瓦解，我们的社会民主党人团体也因为意识形态的不同而四分五裂，曾经我们巴伐利亚政府与贵政府也有过许多冲突，引发了许多的不愉快。而如今，我们双方政府都在帝国主义以及工业资本家的包围下，维持着革命政权；我们的目标是一致的-打倒采用剥削制度的工业资本家，打倒入侵德国以及其他民族与国家的帝国主义者，打倒腐朽的柏林政府。那么是否有一种可能，我们政府双方可以重新联合起来，为了德国人民获得自由而不懈奋斗呢？\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 我们知道，如果双方政府需要联合斗争，那么必然需要经历一定的磨合，这一点我方政府完全理解。不过贵政府如果同意与本政府重新进行政府和经济层面的交流，那么我们双方完全可以通过边境线的某一处地点进行双边谈判，并达成我们共同的目的。\n\n再次致以诚挚的问候\n\n谨代表巴伐利亚政府的临时主席——"
 BAV.14.a:0"弗兰茨.梅林"
 BAV.18.t:0"电报回复："
 BAV.18.d:0"符腾堡自治区政府致巴伐利亚政府\n\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 您好，亲爱的朋友！这是一封关于双方政府进行联合磋商问题的回复信，我们在此阐明我们的立场。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 我方经过深度考量后，认为贵政府的方案有可取性：双方政府拥有共同的敌人与共同的奋斗目标，面对内外敌人的层层包围，我们必然要联合起来，为争取德国人民的自由而战。因此本政府已经同意对贵政府采取政府层面的磋商措施。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 我们曾经与贵政府产生过许多的不愉快，希望从今往后贵政府可以体谅我们并推动实现双方关系的缓和。在不久的将来，我们将会通过双边磋商实现我们的联合，这必然是德国革命事业的伟大胜利。\n\n再次致以问候"
 BAV.18.a:0"符腾堡自治区政府全体人员"
 BAV.50.t:0"民主？"
 BAV.50.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 沃尔夫，作为新晋的工厂大车间工头——同时也是工厂中最有文化的一个工人，平日除了工作安排之外沉默不言的他今天却异常活跃起来，时不时的望向工厂大门，似乎在盼望着什么。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 一位工友走在他身边，递给他一杯水。沃尔夫喝了几口，说道：“你知道吗，待会儿工厂就要迎接几位大领导了，是要来公布工厂的新管理模式的，听说管理模式是跟巴伐利亚的那帮共产党人学的，很民主！”“什么，民主？我们工人生产还讲民主么，怎么个民主法？”工友疑惑的说。“嘻，等一会你就知道了。”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 不一会儿，一个衣着明显不太一样的领导式人物走在中间，和其他人一齐进了工厂。在进行了简单的宣读后，随行的工作人员分发了一批小册子，上面赫然写着“南德意志苏维埃工企业民主管理方法”。工人们大多都有小学学历，但里面许多难懂的词汇，还是让沃尔夫带着大家们一起读了出来。读完后，先是一阵短暂的沉默，随之而来的是一阵又一阵的山呼海啸声-这是这个厂子的工人们第一次有权利可以通过集体会议来决定生产模式和工资制定。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 在人群的喜悦中，那位工友用双手紧紧的握着这个小册子，都把封面握皱了，虽然里头难懂的词汇他还是看不懂，不过有了这个册子，已经足够让他开心。"
 BAV.50.a:0"“这就是民主，我可太喜欢了！”"
 BAV.17.t:0"战鼓渐进"
 BAV.17.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 入夜时分，临时政府驻地上层一间不起眼的小窗里还亮着灯，温暖的柔色光晕映出了梅林沉思的身影。一天繁重的公务结束后，这位苏维埃政府的领导人习惯性地端详起白纸铅字的政府报表，就着窗外迷人的万家灯火，思考未来的方向。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 尽管我们的革命热忱在邦联遭尽冷眼，尽管帝国主义对我们的满腔义愤不屑一顾，尽管我们接手的巴伐利亚满目疮痍，但我们还是实现了生产力的飞跃。炽热的钢铁，金黄的麦穗，人民久违的笑颜都从一格格跃升的数据，一条条腾飞的曲线理折射出来。再放眼窗外的万家灯火，这岁月静好的一切似要永远维持下去。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “主席先生，莫斯科急电！”梅林赶忙从沉思中惊起，接过欧根·莱文焦急递上的电报。纸上散发着阵阵墨香，摸来也微微发烫，但其上的消息却让梅林如坠冰窟：“柏林中央政府已在事实上经济崩溃，受经济危机刺激，其已无维持正常运转的开销，更绝无余力偿还天价债务与战争赔款……德意志邦联内各邦纷纷开始扩充民兵，甚至公开编组正规军……各国使节已陆续撤离柏林，避免卷入可预见的德意志地区暴力冲突……”寒意紧抓梅林的心脏，刺激的老人发出几声压抑的低咳。“通知代表们明早紧急会议……”梅林以从未有过的严肃向莱文下达了指令，但又微微停顿了一会，想到了根据地近期放缓的军工产业，“对了，现在就叫小李卜克内西过来一趟！”目送秘书匆匆远去，梅林将目光返视窗外，低声自语道：“难道这份来之不易的平静又将被金戈铁马打破吗？”甩了甩头，将这失败主义的想法赶出脑海，“革命根据地的使命从来不是偏安一隅，这来之不易的机会下，我们更要让革命的火光照亮更广大的人民。”"
 BAV.17.a:0"“莫让安逸，消磨斗志。”"
 BAV.51.t:0"非梦"
 BAV.51.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 施密特总被父亲教导:“咱是一个普通的德国人，好好活就是了。”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 生活在多重因素的压迫之下。每天，他起早贪黑地工作，辛辛苦苦地为生活奔波。昨天可能被军警敲一笔，明天又被老板找理由克扣工资，时间长了，他感到心灰意冷。就如同他父亲说的，\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “咱这种人只能凑合活，让生活变得更好那种事情只能看上帝的意思了。”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 施密特渴望转变，但每天，他都有一种被束缚的感觉，仿佛确实有什么东西绊倒他，让他爬不起来，他确信，这是由于他做的不够好，引起上帝的愤慨。于是他和家人一样，每日虔诚的祈祷，寄希望上帝拯救他。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 可那天，他像往常向父亲告别，但回到家却不能与父亲拥抱，很快他得知——\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 他老老实实的父亲被札进机器里，奇迹没有发生，当他出来，很快因为失血过多而死了。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 施密特不禁问自己:\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “为什么？”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 最终，他给了自己一个答案，自己的命运是注定好的。那一刻正是父亲下葬的时候，他一会哭，一会笑，一把抓过神父的衣领，结结实实给了他一拳，然后躺在地上，双手狂乱的抓着空虚，惊得周围人四散而逃。在母亲的哭声中，他堪堪恢复正常，安慰了母亲，之后回了家。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 之后他整日酗酒，浑浑噩噩的生活也便这么过下去了，如果上帝觉得他该死，那就他妈的让那小子砸死自己吧!"
 BAV.51.a:0"他不在乎。"
 BAV.53.t:0"似梦"
 BAV.53.d:0"£GFX_AOR_GER_blank £GFX_AOR_GER_blank 然而，未来终究是有了转机，巴伐利亚的苏维埃政府成立了，当年逃脱了法律制裁，用一纸道歉信了结事端的混账老板也被工人民兵吊死在路灯上，他觉得这个挂件挺相称的，要不是尸体散发的尸臭惹恼了邻居，他肯定得想办法把这个“挂件”永久化。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “这个路灯还是不空着好啊”施密特看着路灯感叹。\n远处的演讲声音引起他的注意，他三步并作两步走到那里，听到一阵激昂的声音——\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “有人说，我们穷人生下来就是等死的命，但穷人不是跪着的命。死也得站着不能跪着！他们告诉我们，忍耐与顺从，我们遵循他们，只得到自己的亲人孩子尸体！同胞们，你们答应吗！”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 施密特不由得一起喊出了声，合成一句铿锵有力的话——\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “不答应！”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “为了子孙后代的幸福，加入扫清他们束缚人的旧渣滓的队伍吧！”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 演讲者拿出一份单子。\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank “我们将成立新文化战斗队，有谁要报名吗？”\n£GFX_AOR_GER_blank £GFX_AOR_GER_blank 吃第一个站出来的不是同盟成员，而是连积极分子都不算的施密特，连他自己都感觉吃惊，但他还是完成他想完成的动作，一把抓住那叠入队申请书，大喊：“我加入！”"
 BAV.53.a:0"一阵掌声响起，施密特突然感觉自己得到了梦寐以求的转变新生。"
 
 
 BAV.800.t:0 "对柏林及德意志蛀虫的征讨檄文"
 BAV.800.d:0 "各位同志们，苏维埃红军官兵们，政治工作者们，工人和农民阶级们，各位苏维埃的成员们，智力劳动者们和暂时陷在强敌压迫之下的兄弟姐妹们！\n今日，我们在极其严重的外部条件的情况下，召开这次大会，在外部，法兰克福这头毒蛇对我们的苏维埃政权虎视眈眈\n在北方的波美拉尼亚早已沦为保皇党，民族主义者和亲柏林者混战的战场，他们甚至不再关心自己的人民，把无产阶级当作这些所谓“精英”的政治工具\n柏林的艾伯特，威斯特伐利亚的提尔比茨，独裁政治甚至在德国这一个诞生了伟大革命导师马克思，恩格斯的国土上越发猖狂\n但是，我们有过比现在处境更加危急的日子，试回忆1918年，我们在十一月革命那时候的情况，当时我们不光要面临内部的反革命势力\n并且我们还要面对外部的侵略者——哪些协约国军队，我们的大部分的既有领土被外国武装和内部反革命分子控制着，但是我们不曾放弃\n最终，我们在战火中组织起了联盟和军队，虽然大的革命最终失败，但是我们仍在巴伐利亚组织起了苏维埃政权。\n现在，我们的情况要远比1918年前好得多，我们成功的完成了各方面的革命，我们建立了自己的军队\n我们重启了因战乱关闭的慕尼黑大学，我们组建起了对抗独裁和反革命分子的统一战\n我们现在的政权要远比那个时候稳固的多，我们现在扔想1918年一样反对他们，拉起革命的大旗\n我们一定会胜利，敌人并不像哪些被吓破了胆的人描述的这么厉害\n敌人是始终无法打败我们的，因为我们有人民的统一战线，我们目标一致，\n而敌人什么也没有，并且他们终将陷在人民战争之中\n各位，现在全世界的共产主义者，工人阶级和农民阶级都在望着你们\n期待着无产阶级革命能够在这片诞生马克思，恩格斯的土地上生根发芽\n现在解放的使命就落在你们的肩膀上，你们不愧是这个时代的解放者！\n我们今日要向全联邦的反动政权发动整套，让这群德意志的蛀虫被无产阶级的候鸟啄死\n这个世界是我们无产阶级的！"
 BAV.800.a:0 "慷慨激昂"
 BAV.520.t:0 "致内测玩家的一封信"
 BAV.520.d:0 "欢迎游玩巴伐利亚苏维埃，也欢迎游玩AOR。这是逻各斯留在这里的一个小小的彩蛋，我在这里需要感谢为巴伐利亚苏维埃做出贡献的制作组成员，包括组长blo，代码花花，代码imagination，文案菊，还有我逻各斯。以及再次感谢我们所有的制作组成员，没有你们的任何一个，AOR都不会是现在的样子。同时，我最要感谢的，还是——屏幕前的你。感谢你的游玩。"
 BAV.520.a:0 "新年快乐"
 


















































































































































































































































































































































































































































































































