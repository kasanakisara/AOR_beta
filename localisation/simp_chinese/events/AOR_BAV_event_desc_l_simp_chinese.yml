 BAV.1.t:0"奥古斯特·倍倍尔"
 BAV.1.d:0"即使是李卜克内西和卢森堡这样优秀的革命家也难掩斯巴达克之颓势，红色政权正处风雨飘摇之中。“斯巴达克同盟被粉碎了！”从《邮报》到《前进报》都发出了欢呼。\n火车自瑞士向巴伐利亚驶去。跨过高山，渐渐能看见田野与炊烟了。窗边的老人把目光自窗外收回来，顿在新收到的报刊上——那是小李卜克内西最近的一次演讲。\n“他们今天就已经失败了！因为他们想把那些人当作自己的工具来使用，今天却已经成了那些人的俘虏，而且他们历来都是那些人的工具。”\n就像老威廉所了解过的那样，卡尔的性格还是那样冲动。而对于罗莎——她做出的妥协太多，她需要知道一个社会主义者应当在什么时候强硬，就像不久前伊里奇向察里津前线致电时批评的那样。\n无论如何，斯巴达克同盟经受不起又一次失败。火车上倍倍尔又一次回想起自己把自传托付给考茨基时的那个下午。他一定要看到这红色的种子在欧洲大地上开花结果："
 BAV.1.a:0"“不顾一切”"
 
 
 
 
 
 BAV.2.t:0"一场噩梦"
 BAV.2.d:0"灰暗的天幕淅淅沥沥的滴下水珠，空中的雨点组成帘幕遮蔽了前路，发出恼人的，犯恶心的声音。弗朗士的胸口不由得有些发闷，轻按下脖颈，一把抹掉了额头上的雨水，加紧了脚步赶路。\n老友现在在巴伐利亚机械制造厂上班，对于现在的弗朗士来说，这段路还是太长了。推开宿舍的门，吱呀吱呀的叫声牵扯着他的神经，眼前有点发黑，不由得身形一矮，捂住脑袋\n“砰！”\n天旋地转，这声炸弹的巨响将摇摇欲坠的他推下记忆之崖，前线和手中的武器就在眼前，血肉擦过头顶，浑身粘腻，肺被拽住了一般无法呼吸，枪炮声使他头晕，“声音……阻止……”\n弗朗士有气无力的喃喃道，现实的门框和虚幻的记忆交替展现，而他脚步虚浮，无法迈过门槛，战友熟悉的声音又一次回响了。\n“革命必将取得胜利！”\n“不！不！不！”佛朗士惊醒了起来，而他什么都拦不住，如同那年的那个夏天。\n又一声巨响响起，是现实中的？还是当年的炮火正中目标？血肉飞入口中，咸腥的味道直冲口鼻，即使半跪于地面，却依然无法于大地之中找寻安宁。\n佛朗士努力起身，迈过门槛，他和他的军队必须夺下柏林，南方联军必须获胜...\n不成人样的尸体横在他的面前，而破碎的话语扎入心灵，给了他最后一击。“暂停作战计划！暂停作战计划！”\n耳边只响起友人微弱的喊叫，他彻底瘫倒在地上。"
 BAV.2.a:0"我们...还是输了。"

 BAV.3.t:0"祝福"
 BAV.3.d:0"记忆被生硬的掐断，撕裂，思维被粗暴的搅碎，糅合。身体虚弱的完全不能动弹，勉力挣开的眼睑，目光的尽头也只有模糊的苍白。有那么一瞬，倍倍尔已然忘记了自己是谁，自己身在何处。但他迅速催动生涩的大脑，企图弄清当下处境。\n“我记得，我最后在工作……”记忆中闪过那张朴素的书桌，“……还有很多工作没有完成……”倍倍尔再次奋力试图坐起，但徒劳无功，身体末梢几无响应。\n“巴伐利亚根据地的情况我最清楚，我还需要为年轻人们多做些努力……”柏林城外一夜的火光，腹背受敌，山穷水尽的革命同盟星星点点的闪耀在眼前，划过脑海，虽然巴伐利亚根据地在短短几年的时间里大踏步的向人人有动力，有热情，有信仰的革命热土迈进，但还不够，还远远不够。德意志革命，世界革命的重担仍然悬在肩头……\n房门洞开，数个脚步急切的接近，声声话语打破宁静，但无论倍倍尔如何努力地去分辨，去倾听，这些词句都好像远在天边般模糊，只能听出许多熟悉的人，熟悉的同志的呼唤。李卜克内西，卢森堡，梅林，莱文……\n“他们不该都在这，他们也都有工作，没了李卜克内西，谁去改造军队……稳定群众……没了卢森堡，谁去肃清封建蛀虫……指导工人生产……我估计病倒了……但他们也不该这么摆这么大的阵仗……”倍倍尔为之忧心，为革命的前景忧心，为年轻同志们的指引忧心，“我得……做的更多，尽前辈之责……”\n心脏骤然传来一阵剧痛，昭示着老革命家的病因，也宣告着生命终点的迫近。老革命家一定要嘱咐同志们些什么，奋力撑起病躯，雾蒙蒙的双瞳扫过一尘不染的病房，终坚定的聚焦在床头人影上，只见得一幅幅年轻的，朝气蓬勃的，洋溢着热情与关切的脸庞。思虑万千，千言万语汇集到嘴边，竟无语凝噎。老革命家最终释然的笑了，他没有，也无需说出条条详尽的嘱咐，只仿若一位慈祥的老父亲，骄傲于自己优秀的儿女，轻声而坚定的道出人生最后一言，不是嘱咐，而是祝福："
 BAV.3.a:0"“世界，正年轻”"
 
 BAV.4.t:0"一封共产国际的电报"
 BAV.4.d:0"“同志们！我认为，在俄国事变之后，在德国一月斗争之后，特别需要指出，无产阶级运动的最新形式也在其它国家中产生出来，并取得了统治地位。例如，今天我在一份反社会主义的报纸上看到一条电讯，说英国政府接见了伯明翰工人代表苏维埃，并表示愿意承认苏维埃是经济组织...”\n第一国际大会的电报自莫斯科发来，斯巴达克同盟知道，在东欧广阔的原野上，也有那样一群人在与反动的帝国主义作斗争——尽管他们的境遇一样的焦灼。倍倍尔当然知道那则新闻——英帝国主义政府做出了妥协，而德国的火种便在于这巴伐利亚苏维埃。于是倍倍尔在木桌前坐下，拿出笔来作出批示。他知道接下来的会议将决定这个政权的走向。\n共产国际。一个无产阶级的国际组织。它将打破国界，为全世界受压迫者带去科学的理论与实际的支援。“同志们！我代表俄国共产党中央委员会衷心地欢迎你们。现在我提议选举主席团。请提名。”俄国的同志们说。于是，巴伐利亚回复道："
 BAV.4.a:0"“我们将尽快派代表前往莫斯科。”"
 
 BAV.10.t:0"会址"
 BAV.10.d:0"斯巴达克大会的会址仍旧选在慕尼黑的老市政厅，这座有着百年历史的典雅建筑再一次熙熙攘攘充满生机。这座比在座的代表们还古老的多的哥特建筑的每一扇剔透的窗棂，每一座高耸的塔尖都见证了德意志的百年兴衰。\n最一开始，霍亨佐伦的黑鹰骄傲加冕，为自己赢下德意志帝国之名。前巴伐利亚公国的王侯将相和铁血帝国的行政官僚们端坐在席位上发号施令。财富与野心，眼光下的土地，皆以帝皇的荣耀之名号令路径的公民肃静，臣服。\n世界大战的业火炙烤着帝皇的家国，焚灭了钢铁与鲜血铸就的权柄，烧尽了野兽们的理智。军部政变，架空皇帝，一队队身着黑衣头戴钢盔的兵士接管了这里，以枪弹的强权命令路径的公民为德意志的生存，在德意志的土地上效死。\n帝国战败，权威崩溃，来到这里的是趾高气昂的英国人和法国人。他们和容克，资本家沆瀣一气，戴上白手套精细优雅的将路径的公民榨干价值，分食殆尽。\n而今日，路径的公民自发清理街道上的瓦砾与坑洼，孩子们欢声笑语的经过市政厅门口，不再畏惧于这高耸威严的建筑。因为他们明白，头一次，其中的争吵与辩论时为了他们；头一次，其中的演讲与宣告是讲给他们；头一次，其中的席位，坐着他们自己。"
 BAV.10.a:0"理应如此。"
 BAV.5.t:0"德意志的新生"
 BAV.6.t:0"乡下见闻"
 BAV.6.d:0"日影高悬，明媚的照亮了慕尼黑郊外的田野，如此澄澈的日光打在卢森堡女士胸前的党章上，反射出耀眼的白芒，似能刺破一切丑恶与黑暗。今天的党干部女士一幅干练的记者打扮，心中谨记倍倍尔的教诲：到乡下去，到基层去，深入了解革命的面貌。\n一对田野边的身影吸引了“记者小姐“的注意力，年轻的税务官正手足无措的宽慰着身型佝偻的老农。”同志，工作遇到麻烦了吗？”“记者小姐”快步上前，“老先生，苏维埃政权是建立在劳动人民的诉求上的，有麻烦您尽管讲。”老农抬起悲苦的面容，缓缓道出了一个辛酸的故事，一个勤劳的德国公民，一个幸福美满的家庭是如何被帝国主义和封建制度抽筋拨皮，挖骨吸髓的故事：\n“起先是世界大战的时候，小伙子们高歌着什么‘皇帝的荣耀’，‘再现普法战争的辉煌’奔赴前线，我女儿还甚至给她哥哥唱歌送别。谁知……谁知不到三个月，送回家的就只有冰冷的死亡通知，他们连他的尸体都没能找回来……”老农静静的叙述，脸上已无痛苦，只余麻木，“没办法，生活还得继续，只能找了个容克当雇农……不，他简直就是个畜生！但我别无选择……”老人眼中似乎要喷出火来，卢森堡女士也赶紧追问：“不会再有封建地主了，您有委屈尽管讲。”“他假借什么‘德国金融崩溃’之类的狗屁的理由威逼利诱我们换用他发行的‘抵债券‘，实际上就是把我们和他的地绑死，当他的农奴！”“真是岂有此理！”卢森堡女士也跟着怒火中烧，转头看向税务官：“人呢？追查到了吗，私自发行货币可是重罪。”税务官万般无奈：“是我们南下之前的事情了，这帮封建渣滓们早就卷走一切逃跑了，只剩下无数和老先生一样的破产工农……”\n卢森堡女士眼泛热泪，从怀里掏出零钱，想尽力所能及之贻。不巧，手忙脚乱之间，党章竟掉落在地，沾染灰土。但其反射的耀眼白芒，也竟没有丝毫减弱。似乎提醒着脚踏实地的重要性。毕竟，要想根据地人民能真正当家作主，还得在没有硝烟的民生战线上彻底荡涤封建的阴霾，如今日大好之阳光，穿透云层。"
 BAV.6.a:0"任重道远"
