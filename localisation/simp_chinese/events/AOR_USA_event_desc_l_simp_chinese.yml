l_simp_chinese:

 USA.100.t:0"第二次南北战争？"
 USA.100.d:0 "1921年6月12日，疑似两伙来路不明的美国士兵在南北州分别挑起了武装冲突，南北方的武装力量分别予以还击。事后，南北方在第一时间均宣布为对方所为，并在不经过双方协商的情况下，开动前线军队向对方地区进军。\n\n今天是1921年6月18日，双方军队已经在边界上开始交火；目前前线的总体局势尚不明确，但已经不复存在的非军事线两侧，有不计其数的美国平民正在逃亡。"
 USA.100.a:0"是谁先打开了潘多拉的魔盒……"

 USA.10.t:0"西部动乱加剧"
 USA.10.d:0"内战爆发半个月后，内战双方与西部各州的官方联系便骤然下降，民间的通讯也遭到了莫名其妙的中断，南北各方的社会舆论已经开始传言：西部由于陷入了南北混战的无政府状态，其秩序已经开始崩溃。\n\n1921年7月1日后，西部与东部的边界上开始出现了史无前例的逃亡队伍-其逃亡规模甚至要比上世纪90年代的西部大动乱还要再大上几倍。据西部公民的消息，现在的西部已经彻底陷入了多方势力的混战，并且除了达科他州和堪萨斯州政府幸存下来，并分别打着美国政府的旗帜（存疑，且不知支持南北哪方）维护秩序之外，其他已知的西部武装组织都在各自为战，并且相互攻伐-西部特遣军也在其中。\n\n内战爆发后，原本有大量的中西部美国公民逃往南北洲与西部州的交界处避难，但只过了一个月就随着狂奔而来的西部公民反向故乡逃亡-其中不少人灰头土脸，甚至遍体鳞伤，可想而知西部究竟发生了什么骇人听闻的事情。"
 USA.10.a:0"上帝保佑，别让美国再出乱子了！……"

 USA.10001.t:0 "必要"
 USA.10001.d:0 "威尔逊总统从暗红的桌面上拾起这份雪白的总统令，有那么一瞬间，他感觉自己是从尸山血海中拾起一具森然白骨。尽管他已经通读过这份文件不下数遍，但真正落笔生效它之前，多读一遍总不是坏事。“作为美利坚合众国时任第二十八届总统，我谨代表政府下达以下紧急命令……”威尔逊自嘲一笑，在美国这片荒谬的土地上，他又有多大的权力能代表政府呢？政府又有多大权力能代表公民呢？似乎他作为总统的唯一权利，就是可以调动军队去镇压美国人。\n\n“……鉴于目前以底特律为中心的五大湖地区暴动形势已经上升至公开叛乱的地步，我们绝不能允许这种公开分裂国家的恐怖主义暴乱继续在国内蔓延……”呵，回望自南北战争以来的耻辱，这分裂的，毫无荣耀的，不合的众国，又有什么资格来义正言辞的怒斥所谓分裂国家的行为呢？“……我颁布以下命令：美国各州进入紧急状态：威斯康星州、伊利诺伊州、印第安纳州……实行从命令发布24小时后至紧急状态结束以前的无限期宵禁，联邦陆军以及各州州警将维持各州秩序……必要时可使用致命武力……我在此呼吁劳动骑士团积极响应联邦政府的号召，对暴动地区采取必要措施。”威尔逊扪心自问：真的毫无回旋余地了吗？手足相残的惨剧又要在新大陆上重演了吗？他全力弥合的南北分裂，他千辛万苦让托拉斯和南方人施舍的手里的些许权力，他展望的未来愿景又会走向何方？所有的问题都没有答案，威尔逊落下笔尖，刷刷的签下自己的名字，向天主和救父祈祷，祈祷着这必要之恶，亦或饮鸠止渴能让美国社会顺利航向下一年的光阴。"
 USA.10001.a:0 "……代价几何？"

 USA.10002.t:0 "坏牛仔"
 USA.10002.d:0 "好天气，华盛顿哥伦比亚特区万里无云，太阳直照白宫大地。透过窗户，阳光将自己打在了几张苍白的纸上，同时也打在了威尔逊愈发苍白的脸上。\n\n“西部诸州匪徒活动愈发猖獗”，“夏延市遭到匪徒攻击”，“蒙大拿铁路瘫痪”……一连串的西部告急文件让威尔逊第一次感到自己在这总统的位置上完完全全的累了。一波未平，一波又起。虽然他早就有所预料西部的叛贼们会闻风而动，趁着联邦军队专注于五大湖事件的间隙发动破坏行动；可没想到这次的行动来的是如此猛烈，西部十一州几乎都同时向白宫发送了紧电。西部铁路系统大半瘫痪，部分城市的电报线与电话线甚至完全切断。整个西部仿佛又陷入到了20年前的那场危机之中。\n\n“20年前……那时我只是个学者。”在片刻中，威尔逊又开始怀念起自己的年轻时光，曾经写给政府关于西部老百姓的同情信，应该为自己拉了不少选票吧……当威尔逊站在这个高度上后，他才发现，有什么所谓的人情，当他也融入其中时，之前的一切都可以弃之不用，这人情将自己锁死在了白宫之中。承诺可以在自己的良心中排空，只要自己还是总统，那就必然要为一些小人们服务，甚至于卑躬屈膝，为所有美国公民负责，只是宪法中的事；我承诺的西部政治改革做到了吗？并没有，经济改革做到了吗？也没有。但威尔逊明白一个道理：我现在还是美国总统。现在的他必须将自己的杂乱思维集中起来，去应对并处理美利坚国内的动乱状况。\n\n在短暂的思索后，他立刻吩咐国务卿起草并签署了一份《西部紧急状态法修正案》，力求在最短的时间内解决西部问题。把目光抛去遥远的西部，威尔逊心中只有两个王牌-潘兴将军的西部特遣军与西部最大的雇佣兵公司“西部联合力量”。威尔逊将稳定西部的希望寄托给了他们。对于后者这些听话拿钱的亡命徒，威尔逊实则感到厌恶。而对于直接由美国陆军改编而来的特遣军，威尔逊反而感到了一种深深的不放心，这是他在政治场合这么多年培养出来的一点敏感心理，但说不上来到底是什么。他转过头来，背对阳光。“把电话给我，接旧金山，特遣军司令部”"
 USA.10002.a:0 "“什么？电话线断了……”"

 USA.10003.t:0 "飞翔的雄鹰"
 USA.10004.d:0 "旧金山湾区在此时已经到了她最美丽的时节-阳光明媚，水天一色，碧浪涌向陆地，为炎热带来凉意爽气。可如今的人们并没有躺在沙滩上晒太阳的心情，随着西部新一轮动乱的不断蔓延，旧金山的大街上已经充斥着大量从东边的山区逃来的难民，就连现如今价格不菲的旅馆也因为住客数量过多而选择建造“帐篷套房”供人居住，这些简易的帐篷甚至从鲍威尔大街一直蔓延到市场街。\n\n在解决完一系列事件后，包括与旧金山市政府和劳动骑士团的沟通。潘兴长长的舒了一口气，但又感到不放心，于是侧过身子来问正在记着笔记的巴顿。“现在加利福尼亚州的电报和电话处理的怎么样了，哪里还有可以联络的地方？”“加利福尼亚的主要城市，包括旧金山、萨拉克门托、圣何塞、奥克兰、斯托克顿的与山脉以东相连的电话线基本上全部已经因为土匪袭扰而中断了。直接受土匪影响的大概有70%，剩下的30%就是我们和其他市政府和那些个公司领会过的，但市政府仍然留了自己的电话线。至于电报线，仍然有相当一部分可以正常运行，但是许多小城市的已经处于瘫痪状态了”。“很好，但应该再派人和这些市政府商谈，要求他们也要把自己的电话线给掐断，只能留下电报线。除了加州以外的其他州政府也可以商量，但不要过于刺激他们。”\n\n潘兴背靠在椅子上，定制的镀金肩章在窗外阳光的照射下闪闪发光；会议室的大桌子上摆满了烟灰缸，里头既放着烟，又被潘兴当做了他的沙盘推演工具，下面纷纷用各种城市的名字命名。他用手拿起了其中的一个“丹佛”，把他推到了巴顿的面前。“看看，我们的特遣骑兵师现在已经掌控了整条太平洋铁路，不过中部的这些蠢蛋居然没有察觉到我们有什么动作；如果东部的动乱再次加剧，那我们将直接派兵沿太平洋铁路东进，接管科罗拉多州与怀俄明州，到时候和威尔逊有更多的筹码，能为我们争取到更多的物资。”\n\n潘星又露出了他那奇怪的，显得幽默严肃、矛盾并存的微笑。“现在白宫那边应该已经察觉到我们在这边的动作了，那么我们现在就要加快动作，尽快将这些受干扰的铁路线全部占领。”"
 USA.10004.a:0 "“明白，长官”"

 USA.10004.t:0 "飞翔的雄鹰"
 USA.10003.d:0 "火车穿越广袤的大平原与层峦叠嶂的落基山脉，带着旅客们来到了遥远的西海岸-圣弗朗西斯科。除了需要提防路线上的土匪以外，这本就是西部再正常不过的事情。但在二十年前，乘坐一列列没有防护的火车到达西部，对于特遣军的老兵们来说，是记忆中不可磨灭的生死之交。\n\n旧金山梅森堡之中，西部特遣军的总部所在地。当总部的人员正慌慌张张的整理作战资料并向治安部队发布准备命令时，一位指挥官却站在梅森堡堡垒的天台上，慢慢悠悠的抽着烟卷，望着远方如波浪般的丛林思索。他的副官或许实在按耐不住了，便一下子从椅子上起来，对着他说：“将军，第三、第五特遣师、和第四特遣骑兵师已经准备就绪，第四特遣骑兵师是已经和大批来路不明的土匪团伙交火，现在所有军队都在等着总部的总命令，我们什么时候准备传达？”将军摆摆手：“只需要传达骑兵师坚决消灭土匪的命令就行了，其他三个特遣师按兵不动。”他转过头来对着副官，面带一丝微笑。“你跟了我这么久，还不知道我想要干什么？白宫的那位先生巴不得我立刻出击去消灭这些土匪，好趁机打压我们特遣军，他在之前不就借口过铁路系统故障，然后拖延了半年的装备补给，然后最后就送了一干条枪吗？不过就是些土匪叛军，一个骑兵师足矣，况且第四骑兵师是打击他们的老手，用不着这么大的阵仗。况且他们有坦克……。”潘兴滔滔不绝地阐述自己的想法，而在副官看来，这种聊天方式似乎与拉家常无异。\n\n“ 唉，正好，来试试这些法国人的坦克到底好不好用，看看他们在沙漠和山地中有几成作战能力。还有，你待会儿陪我去取文件，是关于特遣队参谋部改革的事儿的。”将军转过头来，走到防护墙边继续点了一根烟，但又不知想到了什么，把烟往下一扔一踩，就急匆匆的下楼去了，巴顿尾随其后。"
 USA.10003.a:0 "雄鹰悠闲漫步，寻找着下一个猎物"

 USA.10005.t:0 "人数"
 USA.10005.d:0 "夕阳无力的将最后一缕昏黄的光芒斜斜的投向小镇，勉强为这间因深处街角阴影的酒吧提供有些许光明的招牌。下班的工人三三两两的围坐，时不时痛饮一口兑水的威士忌以麻痹过度劳累的神经。如今经济下行，通用电气把电价抬高后，整个酒馆只开了两盏小黄灯。吧台上放着的那些已经发皱的报纸，上面的标题都是类似于“底特律暴乱已被平定”“注意身边可疑人员”这样毫无营养的通报。却让酒吧一改往日的喧嚣，吸引所有人的注意力。\n\n“烂牌，不打了。”见大家都没心思打牌，稍微年长些的领班随手将纸牌扔回桌上，“你们这群天杀的老财走狗，这回又他妈的杀了多少穷鬼小伙？几百个，千把个，啊哼？”一旁疲惫的工人接上话：“没那么夸张，那可是几百条人命啊，屠宰场一天能处理……指不定有些倒霉蛋今天晚上就能吃上。”另一个工人打断他的同伴：“别说，这次的动静大的可是咱们没法想的，听我舅舅说，他在被疏散出城前看见了全副武装的陆军车队，车上还有新鲜的弹孔!这说明城里头还有人在抵抗，还有，城市里还有骑士团的死人……”整个酒吧的讨论顿时沸腾起来，猜测的数字从虚张声势的几十到耸人听闻的上千浮动不止，有人不以为意，有人义愤填膺，有人惶恐不安，但唯独不见那几位平常最踊跃号召大家团结斗争的闹事者……酒保若无其事地听着，不一会儿便让弹琴者演奏的力度再大些，小酒馆欢快的琴声逐渐淹没了酒馆的喧嚣，响彻黄昏中的大街。\n\n酒吧的大门发出刺耳的呻吟声，一位工人模样的人吊着简单处理的左臂闪身进来，迅速带上门。“来杯杰克丹尼，要纯的。”望着有些呆住的酒保，“顺便把旧账结了，我的……还有吉米和弗兰克的。”酒保跟往常一样为他斟满最纯的威士忌，抬头问道：“他们……怎么叫你还钱？”成员一仰脖饮尽杯中苦酒，“死了，还能怎么样!”痛苦，悲愤，一切说的出，说不出的情感迸发在他的唇齿间，听起来，那么无力。"
 USA.10005.a:0 "夕阳洒落他来时的路，浸满血色"

 USA.10006.t:0 "南方一只仙人掌"
 USA.10006.d:0 "德克萨斯州的州长办公室，设计的既简洁又古典，桌子上趴着个人，面部观察年纪不算太大，但又满头白发，眼圈深陷。终于在太阳晒屁股的时候，他缓慢苏醒起来，并呼叫着自己的助理为一天的办公给予早餐与咖啡的补充。还好加纳算是勤劳的政府人员-他的勤劳甚至在迪克西党内部都是出了名的，因此他并不必烦恼如此一个既庞大又富饶的州给予它的大量文件。他得以在极度匮乏之时睡一个别人不敢睡的懒觉。\n\n他翻开早晨的报纸， 哎，又是一些北方无聊的反贼新闻。他将报纸放在一边，在脑海中幻想着威尔逊率领部队将底特律的工人们全部枪毙的情景；这位看起来文文弱弱的学者总统居然也有这么野性的一面，从现在起的仙人掌杰克对他倒是有些敬佩。不过随着时局发展，西部又开始渐渐动乱起来，现在就连西部的南方州都难保自身了，这位总统又有什么办法可以解决？“呵，美利坚合众国的总统就是这么对待自己的公民的，和当年林肯一个模样……”加纳不由的感慨当代的时局，随着南北矛盾的愈发凸显，作为迪克西中坚力量的他不得不将精力放在了与杨基党的斗争事务中，并渐渐忽视了德克萨斯州发生的翻天覆地的变化-直到最近几周他才知道德克萨斯州已经成为全美第三大州的事，且远远超过南方任何一州。不过说这些无聊的并没有什么用处，他现在要做的，就是趁着白宫如此混乱的局势，再让南方的小伙子们狠狠的添上一把火。\n\n“没错，新闻记者、电报、报纸甚至是收音机，都要有北方的新闻，让南方的人民们明白，北方就是一滩烂泥的怪兽。”"
 USA.10006.a:0 "“可是南方又何尝不是？”"

USA.10007.t:0 "诚意"
USA.10007.d:0 "1920年的春天，太平洋铁路中央线尤如科罗拉多河解冻一般开始慢慢恢复自己的生气-尽管这条线路经常被西部人戏称为“大科罗拉多河”。\n\n第一个迎接春天的并不是绿意盎然的山地植物或者从南方回到家乡的鸟儿，西部人所见，一节节装满着枪械弹药的火车车皮正飞速驶向圣弗朗西斯科，火车的车厢都得到了加固，顶部的机枪孔无时无刻在向车厢之外的一切事物展示出自己的火药味。随行的军官们一边在舒适的卧铺客车抽烟，一边又用那自以为敏锐的眼光看着车窗外，提防着未曾清剿干净的土匪发动进攻。\n\n这是一个老习惯，每当东海岸的物资和补充人员运到西部时，无论运输的多与少，潘兴总是会带着参谋和助手们亲自去迎接，以便给随火车而来的东海岸军官们留下一个好印象。今年，也不例外。当火车稳稳地停靠在站台前，将军与领头的军官亲切地握了手后，将军的副官吹起口哨，躲在站台后的随行部队立刻开始冲到火车前卸货，这阵仗经常把一些第一次来到西部的军官吓一大跳；随后便被潘兴安排到司令部交流，然后由潘兴亲自在火车站听取物资报告。他顺着士兵的手，接过了一把长枪，简单地比试比试。“总统先生看来下了血本了，士兵，在你眼前的这一把枪是春田的新式步枪。”潘兴微笑地对士兵说。随后又领着巴顿视察了新一批的坦克载具。\n\n他边走边说：“这次做的有些惊动华盛顿了，东海岸已经有不少家伙开始讨论我们的事情，估计这件事情我们都做的不太好；但至少总统明白了，我们在西部的重要地位，及时给我们送来了一批这么宝贵的补给。”潘兴突然停下脚步。“而且他们似乎没有察觉到电话线和电报线的事。”“我们特遣军帮助西部的地方部队、警察以及骑士团训练出了这么多的武装，东海岸的那帮老爷们居然对我们没有一点可怜之情。把我撤了无所谓，可是让小子们平白无故受苦，那……”将军又恢复了他那生硬的严肃表情。"
USA.10007.a:0"“如果他们还有诚意，那就继续保持下去。”"

USA.10008.t:0 "8月10日"
USA.10008.d:0 "“今天……今天应该是，8月10号吧。”罗斯.卡特斯在一间烧毁一半的食品店里自顾自嘟囔着。今天距离工人们开始暴动的日子已经过去17天了。17天了，底特律既没有听到罗斯预想中市民们的欢呼，也没有听到骑士团与军警们的哀嚎；他从萨尼亚一路战斗到摩根大通，一路上的街景是多么的触目惊心，这座五大湖旁的璀璨巨星此时已经显尽了他颓废的模样-但战斗不会停息。\n\n他缓缓地抬头向窗外望去，火焰燃烧的声音、枪炮声、呼喊声，宛如最激烈的交响乐在美利坚唱响，哪怕是5分钟歇停的时间都没有。罗斯再看看自己，左腰被步枪弹打伤，脚背被手枪弹打伤，最早还有四五处棍击；而这么多天，化学厂产出的医药用品都送到最前线去了，罗德斯已经10天没有得到有效的医治了。\n\n罗德斯挪动着自己的身体向窗边靠去，为什么接应救护小组还没有到，难道已经不是提前商量好的吗？他现在不想捋清楚这个问题，望着窗边已经尸体苍白的一位不知名工人，他先是用尽自己的力气将他从痛苦抽搐的动作中拉回来，然后从他手中抽出那只已经染尽鲜血的左轮手枪。威尔斯走了、杰克逊走了、现在这家伙也在痛苦中挣扎地死去了；罗德斯已经在这里待了5天了，这里的伤员就剩下了他一个。\n\n罗德斯从来没有学过军人的敬礼，他只是缓缓的低下头对着这位现在稍显平静的尸体沉默了几秒；然后再把背包从他的身后拽出来，数了数，几块已经烧焦的面包、混杂着血肉味发臭的绷带、不过居然还有一瓶看起来没多大破损的酒精、一个不知道从哪儿缴获的骑士团骑士徽章、零散的20多发手枪弹，这些应该已经够罗德斯一个人在这里应付的了。他面朝已经被烧穿的天花板，闭上眼睛，已经迟钝了的脑海又躁动了起来；但他的四肢躯干依然如前几天沉睡似的平静。仿佛他又在脑海中看见了中魂牵梦索的“胜利”……么；是啊，这个梦多么迷糊，多么让人捉摸不透，在现实与虚实的交换中，罗德斯已经沉浸在其中了。\n\n钢铁的轰鸣很快撕裂了迷幻的脑海，罗德斯心里一惊。他屈着腿半跪着，奋力伸着脖子想要往外探，-联邦陆军军旗在残垣断臂之上迎风飘展，随后而来坦克、飞机迅速穿过旗帜的方向前往激烈的战场。头戴英式钢盔的美国士兵并不在意这一点小角落上的罗德斯，从他的眼睛前直直的穿过。而他们的身后犹如绿棕色海洋般汹涌而至。\n\n阵阵热风吹过了他的面容。罗德斯面无表情，他紧紧地握着那支被暗红的左轮手枪，握着手里的最后一枚土炸弹。最后的审判随罗德斯的意志而来。"
USA.10008.a:0"天使重临人间，而随后便是地狱"

USA.10009.t:0 "南部的又一次冲突"
USA.10009.d:0 "1921年4月29日，德克萨斯州及德克拉荷马州政府突然发布官方公告，宣布两州将于5月1日起禁止联邦军队进入该州领地-这项信息得到了南方委员会南方代表的认可并再次发表。不过，南部联邦军队的撤离行动似乎并没有那么顺利。\n\n直至5月1号早晨，已经有大量的南部联邦公民与联邦军队发生了冲突，并造成了流血事件。联邦政府呼吁双方停止冲突，并质疑南方政府不通知联邦政府的突然行动。"
USA.10009.a:0"他们这是想要干什么……"

USA.10010.t:0 "我的工作！！！"
USA.10010.d:0 "11月14日，斯特朗悲伤无比的星期二，自从5年前自己第一次踏进弗里曼公司以来就从来没有离开过他温暖的灰色港湾，即使工作安排到凌晨都没有像今天一般无能狂怒。但事实便是如此，公司的裁员计划名单上将这位“优秀员工”排在了令人注目的头等位。斯特朗今天跟上次结业大会一样坐着地铁来到了公司，最令他哭笑不得的是，他这趟车费比公司给他家发邮件的运输费还贵。\n\n拿到通知单时的他按下了思考的暂停键，斯特朗整个人僵了好一会。“他妈的，火急火燎的……叫我来公司就是为了这个？”斯特朗手里拽着那张已经皱的像老木头一样的传单，破口了几句后便说不清楚话了。最后一次离开公司前，他本来还渴望着找到人事部的主任之后，能靠他三寸不断之舌批准他留下来，不过斯特朗的语言组织能力似乎不是太强；曾经的同事们堆在门口如观赏一部喜剧般看着他在办公桌前手舞足蹈，声泪俱下的模样。主任先是用骑士团警告他，然后再叫保安把这位不太稳定的已失业者从大门口抬了出去；他那甜蜜无比拿了半年的55美元月薪也像只野鸭一样飞回了这冰冷的大楼里。\n\n斯特朗走在熟悉不过的大街上，双眼早就飘到了天边，他不敢看周围熙熙攘攘的人群了-不只是出于自己的羞耻心理，全世界好像都知道斯特朗被扔出了自己的公司，好像所有人都在用冷漠但又戏虐的眼神看着他一样；在纽约的街头，至少在现在，斯特朗感受不到任何的悲伤与愤怒。一片空白的大脑失去了以往的方向感，他只想在一个全世界最小的角落里睡上从未有过的长觉，以便知道这是自己做的一个最恐怖的噩梦-直到被一个躺在地上的人绊倒才让他从梦魇中苏醒过来。\n\n斯特朗起身啪啪身子，扭头一盯-戴着一顶破个大洞不知道是什么款式的帽子、身上穿着估计一个月没洗的工装、右手上只有两根手指、在古典优雅的摩根图书馆映照之下，标准的乞丐模样。那乞讨者抬起头来用那浑浊但仍有生气的眼光瞄着斯特朗。好吧，总有人比我还不幸，斯特朗这么想；说也奇怪，斯特朗比平时更快的在兜里掏出钱包，浑身颤抖地将剩下的10美分零钱扔在了他残废的手上，唉，也得生活呀，伙计，两顿早饭的钱。斯特朗心里抱怨着。\n\n纽约城是一座拥有600万人口的大都市，斯特朗即便住在曼哈顿对岸，平时通行都是需要坐公交车或者地铁；不过这次，失业的刺激反而让他倒是想靠步行全方位看看这个熟悉又陌生的财富之都，一个对他不公的大都会。平时自己都是半夜才下班，这个城市最辉煌的一面他似乎从来没有正视过：摩登巨楼，高耸无边，久久凝视，望而生畏；似乎在代表着什么意志俯视人间，令斯特朗所感慨，不过又有些自我安慰：毕竟我斯特朗.贝格曼可是大学里头出来的高材生……偌大一个纽约城还容不下我？至于刚才那个人……"
USA.10010.a:0"毕竟，在没有工作的纽约，没有人能活得下去。"

USA.10011.t:0 "写给厄尔的信（1）"
USA.10011.d:0 "寄信点：南方 乔治亚州 亚特兰大市 桃树街455号21号公寓\n\n亲爱的厄尔，你们在北方一切可好？因为我的事实在是太忙啦，所以已经有很长一段时间没给你们沟通过了，在这里我表达我们的歉意。\n\n您也知道，我们这批人都是被北方的老板赶过来-他们在驱赶公民的时候，可真不讲民主人权。我们被驱赶过来的时候，可以说是没有哪怕一片面包，所有人也都是失业状态，我们漫无目的的流浪在南方的铁路线上，最严重的时候有几个家伙甚至去了火车站附近乞讨；而他们：福斯特、海伍德仍然对我这个老头仍然很尊重，对此我心怀感激。\n\n不过到了最近两年，我们的生活倒是安定下来了-南方这里的人口管制比北方松的多（除了黑人），大部分的青年都在南方的工厂找到了工作，可是这些地方的工作环境远远比不上北方，薪水也是如此，但是他们还是把我搬进了亚特兰大的一栋小公寓里。作为领导者，怎么能够白吃白喝的拿出他人的被压迫价值？于是我自己也找了份工作，就在亚特兰大的老火车站，当临时售票员和提灯检护，虽然工资也很少，但至少每天吃的面包不是白吃的。只是寄希望于骑士团的人不要来找我的麻烦（你也不要去接触他们！）。\n\n我们除了替人工作以外就没有什么经济来源，所谓的国际也不会批经费给我们-因为他们早已经把我们遗忘了，而他们除了个人以外也没什么钱。我记得那个什么比利时的代表曾经悲观的在报纸上发过言：说我这个老头和小伙子们已经被骑士团的人扔大海里了。只是可惜我不能发声，不然的话，我一定要在报纸上好好责骂他……\n\n先说说近两年来的工作状况：我们在南方已经发展出了几个团体，都是很团结的南方劳工和黑人劳工所组成的。我想我们的主张已经在南方开始生根发芽了，在此之前，南方似乎很少有这种激进的思想因素，而我们的到来也似乎改变了这一切。就说说亚特兰大，现在居然已经有工人组织敢上街抗议了-但我的建议是不要在这个紧张动乱的时候搞全面罢工。这并不是我这个老头软弱了，变保守了，南方不是芝加哥，因为他比当年的芝加哥还要残忍-事实证明，南方的工人力量仍然不强劲，但我们在北方是如此的困难重重，以至于我们需要去南方寻找新的天地……"
USA.10011.a:0"（翻开第二面）"
USA.10012.t:0 "写给厄尔的信（2）"
USA.10012.d:0 "再说说近两年的考察状况吧。先讲讲黑人群体，这里的黑人，尤其是乔治亚州，虽然名义上摆脱了奴隶的枷锁，但也仅仅只是在名词上。在我观察过的所有黑人劳动状况中，他们与当黑人或者农奴时期的状态没什么两样-因为他们本身不受南方各州的法律保护，他们所谓的公民权完全就是一片白纸，因为美国宪法中对北方黑人的法律规定，在南方甚至都不适用。大部分黑人在获得解放之后居然还要缴纳一笔所谓的赔偿费，而为了这所谓的赔偿费，黑人们也都如没有被解放之前替白人雇主干最累最脏的活-因为不少在其中加了利息，薪水奇少，有些人现在都没有还完这一笔债。\n\n就算是获得了所谓完全自由的黑人，各州也规定：没有各州县政府颁发的通行证，就不准去往北方，这一点联邦政府也没有阻止。难道我们的黑人兄弟有钱乘船回到非洲老家吗？这些践踏人权的规定不过是这些大财主们贪婪性格的本相毕露，他们就是想让黑人永远当他们的奴隶，赚取最大利益的金钱……（以下省略）虽然组织困难，但已经有一部分黑人团体拥有了团体，我们很高兴，黑人们也愿意欢迎我这个老头帮助他们。\n\n第二点，就是白人工人的问题。我相信很多北方人都没有到过南方，就连北方工人也大概不知道南方工人的真实样貌是什么样的。我可以告诉你，比北方还差，地位比北方还要低贱。南方这些大财主们也把管理奴隶的方法运用到了劳工身上。南方各州总有一些心怀不轨的人去宣传什么“民族既定论”、“美国分裂论”，说什么南北已经分化成了两个不同的种群和民族，要求南方人民与北方人民相互脱钩，甚至连来往都不行！南方的工人们时常就被这种躁动的情绪所调动，或者说被迫被所谓的民意调动，他们对北方包括企业在内的敌视反而忽略了他们自身的压迫，仿佛只是北方的到来，让他们陷入到了这种境地。我想哪怕是骑士团也不会接受这么荒谬的言论。但这个并不是主要的，白人劳工和黑人一样，绝大部分都身背着高额债务-这些大多数都是从80年代的南方危机中剩下来的遗留物，当时的平民百姓大量失业，只能向南方和外国财团的银行贷款-而他们收取的利息又比北方财团的银行高的惊人，当然我没有任何夸赞北方银行的意思，他们同样都是工人的吸血鬼。至少现在，我敢说南方的大多数劳苦工人的债务都可以压死自己。因此他们不能轻易离开南方，他们的受教育程度和经济状况也决定了他们离不开南方-因为北方财团早就已经把南方牢牢抓在自己手里了。\n\n北方的那些只手遮天的资本家在南方拥有惊人的力量-这对于这个分裂的合众国来说确实显得奇怪，但我可以说他们就是有这样的实力。南方70%的企业几乎都在北方手中，先前的大财主只不过剩下了自己的贷款行业，而土地以及实物资产被大肆收购兼并，在南方形成了一个个庞大的巨型工厂-像约翰这些人就犹如圈养牲畜一般把南方人往他们的工厂去赶，只需要开稍微高一点，或者与北方相同的工资，便能瞬间击垮南方那些落后的企业们，将金钱的通道牢牢掌控在自己的手中。南北的这几个团体在政治上争的赤面耳红，而在经济上却是北方一边倒的全盘吸收-南方早就离不开北方，却因为南方那些保守派资本家或者大财主们的利益受到了损害，所以他们要不顾一切，如疯狗一般发起对北方的进攻，但这对于他们来说似乎是无济于事……（以下省略）\n\n我代表在南方的伙伴们，表达对你们事业成功的祝贺!请让我再次表达我的歉意。"
USA.10012.a:0"格里特·托克维尔·斯巴达克 \n1919年12月15日"
USA.10013.t:0 "再一次写给厄尔的信"
USA.10013.d:0 "寄信点：南方 密西西比州 新奥尔良市 波旁街40号 国际码头邮件快递公司\n\n亲爱的厄尔，你们在北方一切可好？今天要向你问候的是一件急事，希望你能够尽快安排。\n\n你大概是知道我们那位欧洲的老朋友去世了的，已经决定了，由你来担任特别代表前往欧洲去参加葬礼，你的工作就由坎农暂时代理。\n\n记住，你要找一身还算体面的衣服-最好不让你们那边破费。然后随便坐什么船到法国的布雷斯特港，桥街区136号16号公寓。那里住着的先生是唯一认识我们的，让他带着你去见见组织。然后，说明我们的情况，别让他们以为我们早就全军覆没了。\n\n你的代号就是“热狗”，它的代号是“外国顾客”。到时候街头碰面，你说一声“热狗”，他回答一声“你是美国香肠先生吗？”，你要回答：“给我来6根！”，就对得上了。如果他先回答“你是美国香肠先生吗？”你要回答：“我是热狗”，那也对得上。\n\n从这封信收到的下一天起就立刻准备出发，可惜资金上的事我没法帮你安排（国际邮件真的太贵了！）。今年的独立日你估计只能在法国或者瑞士过了，务必请在7月10号之前赶到布雷斯特！\n\n就这样了，感谢。\n\n格里特·托克维尔·斯巴达克\n1922年5月15日"
USA.10013.a:0"这都是些什么……"

USA.10014.t:0 "法国，到了"
USA.10014.d:0 "哪怕是远方大陆战火四起，进出口贸易遭受严重打击的情况下，也掩盖不了布雷斯特，这个作为法国布列塔尼第一大港的繁华景象。一船又一船的煤炭进入了码头，无数的富有移民来到此地，法国海关依然赚的盆满钵满。\n\n在下船四处逛悠的水手中，德布斯的特使-厄尔·罗素·白劳德来不及给自己买午饭，就一路奔向“桥街区136号”去寻找他的联络人。白劳德虽然作为特使，但他自己的资金早就在纽约的救济活动中花的精光，那点微薄的薪水，根本不足以支持自己哪怕买到前往法国的二等船仓。还好纽约的地下工人会十分给力，动用连续将自己送上了运煤船-并且不用支付一分钱船票。只可惜德布斯先生的要求无法执行-运煤船的环境自然不必多说，哪怕是衣服放在行李箱里，拿出来都是附着一片片的煤灰，休闲装穿上去和工装没什么两样。所以在找到联系人后，得赶紧向他要件合适的服装去参加葬礼。\n\n好，桥街区136号，但他傻眼了-眼前哪有什么公寓，一栋掘地而起的“皮洛士”百货大楼摆在他的眼前。坏了，德布斯先生的地址怕不是旧地址吧？白劳德此时不禁冒出一身冷汗，但自己又总不能满大街的叫“热狗”、“烤肠”之类的词汇，但法国人大概听不懂英文……太阳已经向西边转去，将近下午3点，而此时的白劳德已经两天没有吃过任何东西了。他努力的用自己向水手学习的拙劣法语请叫路人哪里是餐厅，路人似乎看出了他是个美国人，手一指，指向了百货大楼里的一间小房间。\n\n“美国之家餐馆”？这下白劳德可找到老乡了，推开门一进-一位瘦高瘦高，穿着西装的服务员就走了过来。只见他开口就说：“你是……” 。“没错，我是“香肠”！”。白劳德打断他的话，又上前激动的握着他的手。“可算是找到了！”服务员先是诧异，然后又带着一丝尴尬的微笑说道：“您要多少？”“我要吃6个！”白劳德激动的说。随后，服务员将他领到餐桌上，他则在满怀期待的等着下一步计划的进行。\n\n然后，服务员拿了一个大盘子出来，上面满满当当的放了6个热狗。“请享用，亲爱的美国同胞！”。服务员彬彬有礼地说到。只留下了震惊并流出一丝口水的的厄尔·罗素·白劳德。“不错……至少我能在法国这破地方吃到美国的食品。”也不管怎么想，白劳德就先啃了起来，这是他在法国吃到的第1顿饭。"
USA.10014.a:0 "“什么，2法郎？我，我我……没有钱”"
