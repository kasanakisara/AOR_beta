 USA.100.t:0"第二次南北战争？"
 USA.100.d:0 ""
 USA.100.a:0"知道了"
 USA.10001.t:0 "必要"
 USA.10001.d:0 "威尔逊总统从暗红的桌面上拾起这份雪白的总统令，有那么一瞬间，他感觉自己是从尸山血海中拾起一具森然白骨。尽管他已经通读过这份文件不下数遍，但真正落笔生效它之前，多读一遍总不是坏事。“作为美利坚合众国时任第二十八届总统，我谨代表政府下达以下紧急命令……”威尔逊自嘲一笑，在美国这片荒谬的土地上，他又有多大的权力能代表政府呢？政府又有多大权力能代表公民呢？似乎他作为总统的唯一权利，就是可以调动军队去镇压美国人。“……鉴于目前以底特律为中心的五大湖地区暴动形势已经上升至公开叛乱的地步，我们绝不能允许这种公开分裂国家的恐怖主义暴乱继续在国内蔓延……”呵，回望自南北战争以来的耻辱，这分裂的，毫无荣耀的，不合的众国，又有什么资格来义正言辞的怒斥所谓分裂国家的行为呢？“……我颁布以下命令：美国各州进入紧急状态：威斯康星州、伊利诺伊州、印第安纳州……实行从命令发布24小时后至紧急状态结束以前的无限期宵禁，联邦陆军以及各州州警将维持各州秩序……必要时可使用致命武力……我在此呼吁劳动骑士团积极响应联邦政府的号召，对暴动地区采取必要措施。”威尔逊扪心自问：真的毫无回旋余地了吗？手足相残的惨剧又要在新大陆上重演了吗？他全力弥合的南北分裂，他千辛万苦让托拉斯和南方人施舍的手里的些许权力，他展望的未来愿景又会走向何方？所有的问题都没有答案，威尔逊落下笔尖，刷刷的签下自己的名字，向天主和救父祈祷，祈祷着这必要之恶，亦或饮鸠止渴能让美国社会顺利航向下一年的光阴。"
 USA.10001.a:0 "……代价几何？"
 USA.10002.t:0 "坏牛仔"
 USA.10002.d:0 "好天气，华盛顿哥伦比亚特区万里无云，太阳直照白宫大地。透过窗户，阳光将自己打在了几张苍白的纸上，同时也打在了威尔逊愈发苍白的脸上。“西部诸州匪徒活动愈发猖獗”，“夏延市遭到匪徒攻击”，“蒙大拿铁路瘫痪”……一连串的西部告急文件让威尔逊第一次感到自己在这总统的位置上完完全全的累了。一波未平，一波又起。虽然他早就有所预料西部的叛贼们会闻风而动，趁着联邦军队专注于五大湖事件的间隙发动破坏行动；可没想到这次的行动来的是如此猛烈，西部十一州几乎都同时向白宫发送了紧电。西部铁路系统大半瘫痪，部分城市的电报线与电话线甚至完全切断。整个西部仿佛又陷入到了20年前的那场危机之中。“20年前……那时我只是个学者。”在片刻中，威尔逊又开始怀念起自己的年轻时光，曾经写给政府关于西部老百姓的同情信，应该为自己拉了不少选票吧……当威尔逊站在这个高度上后，他才发现，什么所谓的人情，官场的人情仅限于官员与富人之间的人情，当他也融入其中时，之前的一切都可以弃之不用，这人情将自己锁死在了白宫之中。承诺可以在自己的良心中排空，只要自己还是总统，那就必然要为一些小人们服务，甚至于卑躬屈膝，为所有美国公民负责，只是宪法中的事；我承诺的西部政治改革做到了吗？并没有，经济改革做到了吗？也没有。但威尔逊明白一个道理：我现在还是美国总统。现在的他必须将自己的杂乱思维集中起来，去应对并处理美利坚国内的动乱状况。在短暂的思索后，他立刻吩咐人起草并签署了一份《修正西部紧急状态法》，并立刻颁布，力求在最短的时间内解决西部问题。把目光抛去遥远的西部，威尔逊心中只有两个王牌-潘兴将军的西部特遣军与西部最大的雇佣兵公司“西部联合力量”。威尔逊将稳定西部的希望寄托给了他们。对于后者这些听话拿钱的亡命徒，威尔逊实则感到厌恶。而对于直接由美国陆军改编而来的特遣军，威尔逊反而感到了一种深深的不放心，这是他在政治场合这么多年培养出来的一点敏感心理，但说不上来到底是什么。他转过头来，背对阳光。“把电话给我，接旧金山，特遣军司令部”"
 USA.10002.a:0 "“什么？电话线断了……”"
 USA.10003.t:0 "飞翔的雄鹰"
 USA.10004.d:0 "旧金山湾区在此时已经到了她最美丽的时节-阳光明媚，水天一色，碧浪涌向陆地，为炎热带来凉意爽气。可如今的人们并没有躺在沙滩上晒太阳的心情，随着西部新一轮动乱的不断蔓延，旧金山的大街上已经充斥着大量从东边的山区逃来的难民，就连现如今价格不菲的旅馆也因为住客数量过多而选择建造“帐篷套房”供人居住，这些简易的帐篷甚至从鲍威尔大街一直蔓延到市场街。在解决完一系列事件后，包括与旧金山市政府和劳动骑士团的沟通。潘兴长长的舒了一口气，但又感到不放心，于是侧过身子来问正在记着笔记的巴顿。“现在加利福尼亚州的电报和电话处理的怎么样了，哪里还有可以联络的地方？”“加利福尼亚的主要城市，包括旧金山、萨拉克门托、圣何塞、奥克兰、斯托克顿的与山脉以东相连的电话线基本上全部已经因为土匪袭扰而中断了。直接受土匪影响的大概有70%，剩下的30%就是我们和其他市政府和那些个公司领会过的，但市政府仍然留了自己的电话线。至于电报线，仍然有相当一部分可以正常运行，但是许多小城市的已经处于瘫痪状态了。”“很好，但应该再派人和这些市政府商谈，要求他们也要把自己的电话线给掐断，只能留下电报线。除了加州以外的其他州政府也可以商量，但不要过于刺激他们。”潘兴背靠在椅子上，定制的镀金肩章在窗外阳光的照射下闪闪发光；会议室的大桌子上摆满了烟灰缸，里头既放着烟，又被潘兴当做了他的沙盘推演工具，下面纷纷用各种城市的名字命名。他用手拿起了其中的一个“丹佛”，把他推到了巴顿的面前。“看看，我们的特遣骑兵师现在已经掌控了整条太平洋铁路，不过中部的这些蠢蛋居然没有察觉到我们有什么动作；如果东部的动乱再次加剧，那我们将直接派兵沿太平洋铁路东进，接管科罗拉多州与怀俄明州，到时候和威尔逊有更多的筹码，能为我们争取到更多的物资。”潘星又露出了他那奇怪的，显得幽默严肃、矛盾并存的微笑。“现在白宫那边应该已经察觉到我们在这边的动作了，那么我们现在就要加快动作，尽快将这些受干扰的铁路线全部占领。”"
 USA.10004.a:0 "“明白，长官”"
 USA.10004.t:0 "飞翔的雄鹰"
 USA.10003.d:0 "火车穿越广袤的大平原与层峦叠嶂的落基山脉，带着旅客们来到了遥远的西海岸-圣弗朗西斯科。除了需要提防路线上的土匪以外，这本就是西部再正常不过的事情。但在二十年前，乘坐一列列没有防护的火车到达西部，对于特遣军的老兵们来说，是记忆中不可磨灭的生死之交。旧金山梅森堡之中，西部特遣军的总部所在地。当总部的人员正慌慌张张的整理作战资料并向治安部队发布准备命令时，一位指挥官却站在梅森堡堡垒的天台上，慢慢悠悠的抽着烟卷，望着远方如波浪般的丛林思索。他的副官或许实在按耐不住了，便一下子从椅子上起来，对着他说：“将军，第三、第五特遣师、和第四特遣骑兵师已经准备就绪，第四特遣骑兵师是已经和大批来路不明的土匪团伙交火，现在所有军队都在等着总部的总命令，我们什么时候准备传达？”将军摆摆手：“只需要传达骑兵师坚决消灭土匪的命令就行了，其他三个特遣师按兵不动。”他转过头来对着副官，面带一丝微笑。“你跟了我这么久，还不知道我想要干什么？白宫的那位先生巴不得我立刻出击去消灭这些土匪，好趁机打压我们特遣军，他在之前不就借口过铁路系统故障，然后拖延了半年的装备补给，然后最后就送了一干条枪吗？不过就是些土匪叛军，一个骑兵师足矣，况且第四骑兵师是打击他们的老手，用不着这么大的阵仗。况且他们有坦克……。”潘兴滔滔不绝地阐述自己的想法，而在副官看来，这种聊天方式似乎与拉家常无异。“ 唉，正好，来试试这些法国人的坦克到底好不好用，看看他们在沙漠和山地中有几成作战能力。还有，你待会儿陪我去取文件，是关于特遣队参谋部改革的事儿的。”将军转过头来，走到防护墙边继续点了一根烟，但又不知想到了什么，把烟往下一扔一踩，就急匆匆的下楼去了，巴顿尾随其后。"
 USA.10003.a:0 "雄鹰悠闲漫步，寻找着下一个猎物"
 USA.10005.t:0 "人数"
 USA.10005.d:0 "夕阳无力的将最后一缕昏黄的光芒斜斜的投向小镇，勉强为这间因深处街角阴影的酒吧提供有些许光明的招牌。下班的工人三三两两的围坐，时不时痛饮一口兑水的威士忌以麻痹过度劳累的神经。如今经济下行，通用电气把电价抬高后，整个酒馆只开了两盏小黄灯。吧台上放着的那些已经发皱的报纸，上面的标题都是类似于“底特律暴乱已被平定”“注意身边可疑人员”这样毫无营养的通报。却让酒吧一改往日的喧嚣，吸引所有人的注意力。“烂牌，不打了。”见大家都没心思打牌，稍微年长些的领班随手将纸牌扔回桌上，“你们这群天杀的老财走狗，这回又他妈的杀了多少穷鬼小伙？几百个，千把个，啊哼？”一旁疲惫的工人接上话：“没那么夸张，那可是几百条人命啊，屠宰场一天能处理……指不定有些倒霉蛋今天晚上就能吃上。”另一个工人打断他的同伴：“别说，这次的动静大的可是咱们没法想的，听我舅舅说，他在被疏散出城前看见了全副武装的陆军车队，车上还有新鲜的弹孔!这说明城里头还有人在抵抗，还有，城市里还有骑士团的死人……”整个酒吧的讨论顿时沸腾起来，猜测的数字从虚张声势的几十到耸人听闻的上千浮动不止，有人不以为意，有人义愤填膺，有人惶恐不安，但唯独不见那几位平常最踊跃号召大家团结斗争的闹事者……酒保若无其事地听着，不一会儿便让弹琴者演奏的力度再大些，小酒馆欢快的琴声逐渐淹没了酒馆的喧嚣，响彻黄昏中的大街。酒吧的大门发出刺耳的呻吟声，一位工人模样的人吊着简单处理的左臂闪身进来，迅速带上门。“来杯威士忌，要纯的。”望着有些呆住的酒保，“顺便把旧账结了，我的……还有吉米和弗兰克的。”酒保跟往常一样为他斟满最纯的烈酒，抬头问道：“他们……怎么叫你还钱？”成员一仰脖饮尽杯中苦酒，“死了，还能怎么样!”痛苦，悲愤，一切说的出，说不出的情感迸发在他的唇齿间，听起来，那么无力。"
 USA.10005.a:0 "夕阳洒落他来时的路，浸满血色"
 USA.10006.t:0 "南方一只仙人掌"
 USA.10006.d:0 "德克萨斯州的州长办公室，设计的既简洁又古典，桌子上趴着个人，面部观察年纪不算太大，但又满头白发，眼圈深陷。终于在太阳晒屁股的时候，他缓慢苏醒起来，并呼叫着自己的助理为一天的办公给予早餐与咖啡的补充。还好加纳算是勤劳的政府人员-他的勤劳甚至在迪克西党内部都是出了名的，因此他并不必烦恼如此如此一个既庞大又富饶的州给予它的大量文件。因此他得以在极度匮乏之时睡一个别人不敢睡的懒觉。他翻开早晨的报纸， 哎，又是一些北方无聊的反贼新闻。他将报纸放在一边，在脑海中幻想着威尔逊率领部队将底特律的工人们全部枪毙的情景；这位看起来文文弱弱的学者总统居然也有这么野性的一面，从现在起的仙人掌杰克对他倒是有些敬佩。不过随着时局发展，西部又开始渐渐动乱起来，现在就连西部的南方州都难保自身了，这位总统又有什么办法可以解决？“呵，美利坚合众国的总统就是这么对待自己的公民的，和当年林肯一个模样……”加纳不由的感慨当代的时局，随着南北矛盾的愈发凸显，作为迪克西中坚力量的他不得不将精力放在了与杨基党的斗争事务中，并渐渐忽视了德克萨斯州发生的翻天覆地的变化-直到最近几周他才知道德克萨斯州已经成为全美第三大州的事，且远远超过南方任何一州。不过说这些无聊的并没有什么用处，他现在要做的，就是趁着白宫如此混乱的局势，再让南方的小伙子们狠狠的添上一把火。“没错，新闻、电报、报纸甚至是收音机，都要有北方的新闻，让南方的人民们明白，北方就是一滩烂泥的怪兽。”"
 USA.10006.a:0 "“可是南方又何尝不是？”"