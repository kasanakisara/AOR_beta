 CHI.1.t:0"袁大总统的国会演讲"
 CHI.1.d:0 "古俄毛纵横，强虏肆虐，血照西北，并呑国土，以壮其势。悠悠华夏，岂堪屈膝俯首，以维旧交，自当厉兵牧马，兴壮志，复故土，拓定边方，以复华夏荣光。今俄毛纷乱，同室操戈，望天下志士，从军报国，共伐俄毛。谁非黄帝子孙？涿鹿中原，会洗蚩尤兵甲。为玆要约曰： \n凡属中华民国之国民，其皆华夏子民，复中华故土，力破外敌，应吾等所为。义一。 \n后立外西北政府，遵民权口号，内外官职，皆由民选，以代表中华民国。义二。 \n罢除一切俄毛所立腐朽制度，以民国先进制度代之，护当地民众权力。义三。 \n兴华语，废俄文，以促汉化，固边疆民众之思想。修现代设施，应民愿，体现民生之精神。义四。 \n外派新军护卫边疆，以防俄毛反扑，内设警察总督等职，保外西北之稳定。内外皆稳，民众自当竭诚欢迎。义五。 \n 建此五义，奉以纲维。义师所指，意在复国土，攘外夷，国土既复，即刻停军护卫边疆。其有党恶朋奸，甘为逆羽，杀勿赦；抗颜行，杀勿赦；为间谍，杀勿赦；故违军法，杀勿赦。如律令。布告天下，迄于满、蒙、回、藏、青海、伊犁之域。: \n凡属中华民国之国民，其皆华夏子民，复中华故土，力破外敌，应吾等所为。义一. \n后立外西北政府，遵民权口号，内外官职，皆由民选，以代表中华民国。义二. \n罢除一切俄毛所立腐朽制度，以民国先进制度代之，护当地民众权力。义三. \n兴华语，废俄文，以促汉化，固边疆民众之思想。修现代设施，应民愿，体现民生之精神。义四. \n外派新军护卫边疆，以防俄毛反扑，内设警察总督等职，保外蒙之稳定。内外皆稳，民众自当竭诚欢迎。义五. \n建此五义，奉以纲维。义师所指，意在复国土，攘外夷，国土既复，即刻停军护卫边疆。其有党恶朋奸，甘为逆羽，杀勿赦；抗颜行，杀勿赦；为间谍，杀勿赦；故违军法，杀勿赦。如律令。布告天下，迄于满、蒙、回、藏、青海、伊犁之域。 \n大战以后，中华得胜，旧日阴霾亦应一并扫空，吾等无欲劳国民之筋血、增国事之多艰，以黩武而续战。然今日之赤俄，前承帝制之暴虐，后续而犯我之疆土，吾等虽抱诚恳之心，常以善面之，其不忍情，至今日已忍无可忍，让无可让，古人云：‘得一夕之安寝，而秦兵又至’，四境虽大，物产虽博，却绝无一地嫌广，一人觉多，吾若再馈人以资敌势必将为国际耻笑耳，今日‘东亚病夫’又欲立于国民头颅之上？\n今北上讨俄，不为弑人恶行，但求边土安宁。所望凡食民国之禄，事民国之事者，感激发天良，申兹大义，不惧困苦，踊跃报国，唯求成一海棠秋梦”。\n"                                                                                      ——《讨俄械文》袁世凯"
