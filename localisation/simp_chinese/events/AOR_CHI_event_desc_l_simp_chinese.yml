l_simp_chinese:

 CHI.1.t:0"袁大总统的国会演讲"
 CHI.1.d:0 "“纵古今，世界列强暴行无数，唯沙俄恶行最甚。自清以来，便展獠牙青面，侵我国土，扰我国民，而满清腐烂无力，竟屡以利之。若非聚民族之愤慨，以无畏牺牲造就革命，今朝之世早已再无中华可言。然其恶习未改，候吾国长河悲怮、山河怒号之时，便一展狼子野心，驱民葬海，来取山岳川河。其馀种种罪恶，更难尽书。\n大战以后，中华得胜，旧日阴霾亦应一并扫空，吾等无欲劳国民之筋血、增国事之多艰，以黩武而续战。然今日之赤俄，前承帝制之暴虐，后续而犯我之疆土，吾等虽抱诚恳之心，常以善面之，其不忍情，至今日已忍无可忍，让无可让，古人云：‘得一夕之安寝，而秦兵又至’，四境虽大，物产虽博，却绝无一地嫌广，一人觉多，吾若再馈人以资敌势必将为国际耻笑耳，今日‘东亚病夫’又欲立于国民头颅之上？\n今北上讨俄，不为弑人恶行，但求边土安宁。所望凡食民国之禄，事民国之事者，感激发天良，申兹大义，不惧困苦，踊跃报国，唯求成一海棠秋梦”。\n                                                                                      ——《讨俄械文》袁世凯"
 CHI.1.a:0"经此一役，梦可成矣？"
 
