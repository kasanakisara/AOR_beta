l_simp_chinese:

 CHI.1.t:0"袁大总统的国会演讲"
 CHI.1.d:0 "“纵横古今，世界列强无数。唯俄罗斯国恶行最甚。自清廷来，便展獠牙青面，侵我国土，扰我国民。若非聚民族之愤慨，今朝之世便再无中华。然其恶习未改，待长河悲怮、山河怒号，便一展狼子野心，驱民葬海，以取山岳川河。其馀种种罪恶，更难尽书。今中华为胜，往日阴霾亦应一并扫空，吾等无欲劳国民之筋血、增国事之多艰，以续战黩武。然俄罗斯者秉承恶性，蔑弃耻心，背食和约，视四万报国将士之性命于无物。故地难返，故人难逢，客死他乡之战士，竟永无归乡之时乎?‘以德报德，以直报怨。’今北上讨俄，但求故土安宁，不为弑人恶行。所望凡食民国之禄，事民国之事者，咸激发天良，申兹大义，成海棠秋梦！”—《讨俄械文》袁世凯"
 CHI.1.a:0"仅此一役，梦可成矣？"
 
 CHI.2.t:0"新年，新气象，新…"
 CHI.2.d:0 "登子不给我文案，记在小本本里了"
 CHI.2.a:0"新总统...?"
 
 CHI.3.t:0"民国的新时代"
 CHI.3.d:0 "登子不给我文案，记在小本本里了"
 CHI.3.a:0"扬帆起航！"