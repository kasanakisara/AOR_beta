SWE.1.t:0 "奥斯陆刺杀"
SWE.1.d:0 "怡人的风自由的穿梭在一座座楼房之间，鸟儿的啼叫声通过令人爽朗的空气传到了每个王国公民的耳中。今天的瑞典的空气是葡萄酒味的，整个国度都被粉刷匠们漆上了粉红色。当清晨的第一缕阳光照射入埃沃尔的宅邸的时候，埃沃尔正在与自己的妻子享用早餐，当埃沃尔咽下最后一片夹着草莓酱的吐司后，他们便手挽着手出门去了。\n\n这是一个难得的休假，埃沃尔正好利用这一“王国的情人节”来兑现他和妻子画饼了许久的约会。他们走上奥斯陆的大街，城里竟然罕见的和谐了起来，那些时常罢工的瑞典可怜虫们今天已经消失不见，用报纸做被的流浪汉们也被警察驱逐的一干二净。瑞典与挪威的国王!哈康七世即将巡视这做城市，并发表情人节演讲!埃沃尔看着广场上的告示，十分满意自己的这位国王是一位浪漫之人。在这个年头，能有这样的国王属实是个幸事：德意志人早就迷失在了内战之中，美利坚人还在为着自由和独立而战，而他们瑞挪联合王国的合并为国王的子民们带来了长久的和平，埃沃尔的报社生意也能继续做下去。想到这里，埃沃尔便喜悦到难以自己了，他的国王为他带来了多少惊喜啊!他赶快亲吻了一口自己的妻子，这时的她是那么的贤惠且端庄，就像八月的晚风一样迷人。绝对不出一年，埃沃尔的事业就可以更上一层楼，而他也可以带着孩子离开奥斯陆，去买一栋与世隔绝的大房子，对，就在冰岛!和他那孩子一起看日出日落，度过每一个难忘的瞬间……\n\n当埃沃尔从想象中抽身出来的时候，尊敬的哈康国王已经在他的视线中了。没错，他那伟大的国王正和他那动人的妻子一同乘马车过来，道路两旁是遍地的鲜花，人群们早就簇拥在街道旁观望着这位国王。埃沃尔马上就反应了过来，赶忙牵着妻子那布满老茧的手，挤到了人群的最内部。“我亲爱的子民们!大家情人节快乐!在这美好的一天中，与自己的所爱之人尽情的相拥吧!”哈康挥舞着帽子，笑容满面的看着两侧的人们，随后便深深拥抱了自己的妻子，再加以浪漫的法式湿吻，人群中传来巨大的欢呼声与喝彩声，整座城市都洋溢着幸福。埃沃尔一把搂过自己的爱人，无声的笑着，埃沃尔敢打包票，这绝对是他最开心的一天之一。\n\n一声枪响。\n紧接着是稀稀拉拉的无数声。\n\n人群中的欢呼声突然变成惊恐的尖叫声，这个联合王国的国王在亲吻他妻子的一瞬间被一颗子弹传颅而过。有人开始不断的向人群中射击，人们四散而逃，浪漫的歌舞剧突然在此刻变成了一部烂俗的恐怖片。\n\n埃沃尔看着自己血肉模糊的胸口，在看看自己惊恐到面部已经扭曲的妻子。他到底该说些什么好呢？他努力回想自己妻子的名字，可好像怎么也想不起来了。他将因关心而扑向她的妻子一把推倒，转而向哈康的方向奔去，他没多少力气了，重重的倒在了半路上，在丧失意识前的最后一秒，他的视线与哈康对上了。\n\n哈康呆滞着看着埃沃尔的尸体，随后转身看向自己的妻子，深深的吻了下去。"
SWE.1.a:0 "永别了，吾爱。"
SWE_Hakoon_Death_tt:0 "§R随着哈康之死，瑞典最混乱的时代拉开序幕······§"
SWE.2.t:0 "我们的新王"
SWE.2.d:0 "鲁普雷希特·维特尔斯巴赫的生命之中，从来没有像现在一样如此兴奋，虽然他此刻正端坐在幕布后方，聆听着宰相的演说，脸上的神情如同被冻结了一般。身穿着厚重的王袍，手握着象征权力的手杖，似乎历史的使命已经赋予在了他的肩头之上。而他颠簸流离半生，从未像此刻一般如此恐慌。\n这一切都将从头说起。世界大战爆发的那一天起，鲁普雷希特就明白他的国家正在走向崩溃。和英法奥的全面交战几乎是不可能胜利的，而事实也证明确实如此。革命爆发了，他父亲的巴伐利亚王国灰飞烟灭，自己也被迫躲藏在奥地利的一家小酒馆里躲过追捕。那时的他荣光尽损，失去了旧日的荣华才让他立下志愿，自己将会铲除这世上所有的布匪。后来他辗转多个国家，在英国他被首相召见，英国政府希望他出任瑞典·挪威联合王国的国王，以此缓和当前瑞典的局势，避免左翼夺权。但此后瑞典的外交政策需要由英国所左右。\n鲁普雷希特沉思甚久，这时首相说道：“不用担心，我们会保证您的安全，也会为剿灭布匪提供足够的援助，请您支持我们。” \n\n“以一个国家的自由为代价，这值得吗？” \n“这要看您怎么说了。” \n\n后来，他在那份协议上签下了自己的名字，成为了瑞典王位的继承人。与他沉思之时，一位王室佣人走到他面前，说道：“时间到了，陛下。”鲁普雷希特怔了一下，这是他第一次被别人称为“陛下“。但他整理了自己的衣冠，说道：“我准备好了。”接着大踏步走出了幕布后方，就像军人一样。\n他此刻已经了然自己内心所想，那份心意自从他在伦敦签下那份协议之后就已明确："
SWE.2.a:0 "“我将保卫联邦，直至生命结束。”"
SWE_Rupprecht_desc:0 "鲁普雷希特一世，蒙上帝洪恩的瑞典-挪威联合王国国王、巴伐利亚国王、法兰克尼亚和士瓦本公爵和莱茵行宫伯爵，已经降临世间。\n作为曾经的维特尔斯巴赫家族公子，鲁普雷希特的青年是在养尊处优的巴伐利亚王宫里度过的。他在成年后成为了德军总参谋部的一位将军，挫败了法军试图收复阿尔萨斯-洛林的“第十七号计划”，因此也被誉为“世界大战中最伟大的王室将军”。\n可是就在帝国风光无限时，可恶的布尔什维克分子发动了革命，摧毁了帝国。鲁普雷希特和一些维特尔斯巴赫家族成员逃离了巴伐利亚，开始在欧陆流浪。他们先后逃到了荷兰、法国，最后是英国。在这段期间，鲁普雷希特坚定了他的志向：摧毁世界上所有的赤色分子，重新赢回那本应属于他的王位。如今他受到邀请，成为了瑞典的国王，他的夙愿也实现了一半。\n\n§R是时候毁灭这帮无法无天的家伙了!§!"
SWE_Destruction_tt:0 "§Y随着以布兰亭为首的紧急委员会宣告终结，瑞典陷入无休止的战争和黑暗之中。北欧雄狮，低下了它的头颅。§\n\n§R感谢您游玩Aurora of Red:rise from ruins，正义和秩序已经背离瑞典，无数恐慌的民众将自生自灭。\n\n下一次，还是不要毁灭的好。§"
SWE_Anarcho_tt:0 "§R计划失控，安那其分子已经掌控了奥斯陆······§"
SWE_Absolutism_tt:0 "§R这帮农民······§"、

SWE.3.t:0 "瑞典向我们寻求签署贸易协定"
SWE.3.d:0 "瑞典-挪威联合王国大使近日向我国外交部长提出了一项请求，请求通过签署一份贸易协定的方式使得两国的关系更加紧密，包括双方共同科研，贸易关税减少等。"
SWE.3.a:0 "这是一份划算的合同。"
SWE.3.b:0 "我们不是现世的伯多禄主教。"
SWE.4.t:0 "英国同意支持我们"
SWE.4.d:0 "英国方面已经和我们达成协定，双方将共同合作发展。"
SWE.4.a:0 "好耶！"
SWE.5.t:0 "法国同意支持我们"
SWE.5.d:0 "法国方面已经和我们达成协定，双方将共同合作发展。"
SWE.5.a:0 "好耶！"
SWE.6.t:0 "英国否决提议"
SWE.6.d:0 "英国方面称因为自身国情原因，很遗憾不可以向我国提供任何帮助。"
SWE.6.a:0 "很遗憾。"
SWE.7.t:0 "法国否决提议"
SWE.7.d:0 "法国方面称因为自身国情原因，很遗憾不可以向我国提供任何帮助。"
SWE.7.a:0 "很遗憾。"

SWE_orz_tt:0 "还没做好orz，移步别的国家游玩吧~~"
SWE.7777.t:0 "子夜"
SWE.7777.d:0 "坦克的履带声碾过废墟的寂静，对于一场发生在城市腹心的暴动，这可真算得上大手笔。但是血腥的巷战战局依旧没有明显改观，峡湾两岸，整座曾经名为奥斯陆的废墟在燃烧。\n显然隶属于王室正规军的坦克部队正从峡湾东南平坦的政府控制区沿着瓦砾遍地的街角巷尾向西部推进，无政府主义者正依靠西部密布的公园与整齐划一的街道与政府军展开周旋。每一栋房屋，每一片灌木都可以成为杀人者的藏身之处。巷战的血腥表现的淋漓尽致，火光与厮杀遍布每个十字街口。人力，人人都知道政府军目前兵员捉襟见肘，为了减少伤亡，履带声逐渐响起，这些钢铁巨兽不惜倾巢而出，以它们的钢铁身躯保卫宝贵的士兵，而对于极度缺乏重火力的无政府民兵来说，这些钢铁巨兽就是他们终结的宣告。\n“轰!”强大的直射火力彻底拔掉了对面那栋楼，垮塌的砖石房屋激起巨大的烟尘，又一片区域要被突破。无政府民兵根本没有统一的指挥，他们的理论自相矛盾，他们的战斗力一盘散沙，被彻底剿灭不过是时间问题。\n正当此时，瓶子碎裂的声音在坦克顶响起，火光瞬间吞噬了钢铁巨兽，缺乏步兵掩护的坦克无助的转动炮塔，只有阵阵浓烟和不断舔舐的火舌从观察窗透过。坦克部队被迫狼狈的退出一线，但争夺废墟的巷战仍在继续，直到日出，鲜血染红奥斯陆街道之时，无政府军队才会终结这一切。"
SWE.7777.a:0 "这不是结束，甚至不是结束的开始，这是开始的结束。"
SWE.7778.t:0 "雪夜"
SWE.7778.d:0 "“他们不过是一群走投无路的农民罢了。”皇家步兵师瑞典营的上士皮尔换班警戒着阵地对面的“叛军”——一群主要武装为草叉和斧头的瑞典村民。越发冷酷的冷战铁幕下，明面上恪守中立的瑞挪粮食储备难以为继，北欧严寒的冬季更是肆无忌惮的摧残秸秆重压下的农民。又是一个阴雪连绵的糟糕天气，疲敝交加的步兵师被迫又一次面对手足同胞。这次，也许温热的鲜血才能驱散雪地的寒气。\n“打倒挪威国王!瑞典是瑞典人的瑞典!”“不为挪威人上税!”“瑞典至高无上!”村民们又一次在军队的封锁前高喊口号，草叉和斧头破开一道又一道铁丝网封锁。士兵们徒劳的对空警告射击反倒像是在纵容农民们越发激进的行为。皮尔上士身旁的士兵径直端起步枪，瞄准带头的村民就要扣下扳机。“你疯了？“皮尔一把打掉即将吐出索命火舌的栓动步枪。”都是瑞……“看见陌生士兵彰显身份的挪威营徽，皮尔上士剩下半句话梗在了喉咙里。双方的争吵几近立刻升级为了蹩脚的互相侮辱，谁也说服不了谁的双方逐渐形成了对峙的两派，说挪威话的和说瑞典话的面对面。枪尖对枪尖。\n农民们显然注意到了这异常的骚动。“你们站在谁那边？”有人高喊。"
SWE.7778.a:0 "“站在你们这边。”"
SWE.Destruction.t:0 "最后的时分"
SWE.Destruction.d:0 "无论如何，斯德哥尔摩算是完了，北方威尼斯曾经优雅的街道与桥梁铺上了纵横交错的街垒与战线，宛如道道撕碎城市的伤疤。但埃里克的人生还不算完，在瑞挪政府摸爬滚打了多年累积的交情与真金白银的有力“说服”下，斯德哥尔摩紧急委员会疏散的机票给他留了个位置。望着跑道上闪耀着王冠金狮之徽的运输机，哪怕上气不接下气，一丝释然的弧度还是在埃里克嘴角扬起。\n“要我说，陛下简直是胡搞。”拥挤的机舱里，埃里克旁边的财务大臣的牢骚自从埃里克挤进飞机便没停过。“都什么年代了还妄想以一个君主的身份绑死两个民族，甚至妄图染指更多权力。”“是啊，现在还害得我们被暴民像撵狗一样撵出首都，还得给他擦他臭烘烘的屁股!”说到这个，大伙群情激愤起来，“军队呢？军队在哪里？”“忙着镇压什么无政府主义者和瑞典的暴民呢!”“天杀的挪威猪!”“你说谁？瑞典蠢驴……”沙丁鱼罐头般拥挤的机舱里爆发了如国会往日般的吵闹，真是可笑。\n埃里克受够了这一切，望向窗外后退的越来越快的跑道，心想着起飞时的颠簸说不定才能让他们闭嘴。钢铁巨鸟摇摇晃晃的升空，巨大的颠簸和明显超载的机舱让所有人歪七扭八的挤作一团。“至少安全了“埃里克长叹一口气。\n密集的炮火声骤然响起，埃里克眼角撇见机场橘黄色火球在附近的树丛中咆哮，飞曳而来的防空弹幕粉碎了运输机机翼上闪耀的王冠金狮。埃里克随即失去意识，只感觉天旋地转，大地与天空绞作一团不定形的漩涡。"
SWE.Destruction.a:0 "永别了，世界"

#AOR_news_event.txt
SWE.destruction.t:0"[Get_title_news_header]瑞典-挪威联合王国内战[Get_title_news_pic]"
SWE.destruction.d:0 "根据最新的消息，在瑞典紧急摄政委员会主要成员乘坐的飞机全数坠毁后，瑞典已经陷入无线电静默。在此前，紧急摄政委员会已经宣布“将对所有的反对派进行清剿，以求达到保卫联邦的目的。”目前瑞典已经陷入的彻底混乱和全面内战中。"
SWE.destruction.a:0 "最后的避风港，消亡了？"

#country_information.txt(scripted_localisation)
SWE_country_information_loc:0 "瑞典-挪威联合王国，拿破仑战争的产物，一个畸形的联合体。哪怕在挪威人民的愤怒宣言之下，这脆弱的联合仍然躲过了解体的大劫，同时也躲过了世界大战的风暴。根据妥协的《林雪平条约》，哈康七世作为君主统治瑞典-挪威两地，挪威也赢得了一定的“平等”。但当成燎原之势的赤色极光自东方升起，封建势力将会不惜一切代价保卫自己。在这世界的十字路口，沉默之狮将会做出他的抉择：是觉醒，还是死亡。\n\n“生活的目的究竟是什么？是生活本身!除把生命维持到死以处不会再有其他任务。人因此而获得维持生命的力量。”———— 斯特林堡"