SWE.7.a:0 "很遗憾。"
SWE.8.t:0 "会面"
SWE.8.d:0 "斯德哥尔摩的会客厅，灯火通明，爱萨克森正在等待着一位特殊的客人。客人久久不至，爱萨克森有些焦急了。他低下头来，看着自己的腕表。\n瞬时，门开了，一位高雅的绅士走进了门，摘下自己的圆顶礼帽，欠了欠身向爱萨克森致意。爱萨克森也微微低下头，说到：\n“您来了。”\n“那么，我希望直入主题。”绅士并不寒暄，直截了当地说道，“您对我们在那场会议上提出的议案思考得如何了？”爱萨克森不禁苦笑了一下。\n“您是每天都在这么干吗？前往每一个参与了那场会议的人的家中，向他们挨个询问？我们的政府或许真的要完了。”\n来者冷冷一笑，说道：“如果您在公开场合说出这种话，我可以向您承诺，您的政治生命就结束了。不过先不要聊这种话题吧！您此时很清楚，如果您不签署这一协定，将会对您和您的产业带来怎样不可挽回的影响！”\n爱萨克森站了起来。“在我的一生中，我还从未如此被他人胁迫，即使我面前的人是哈康国王的特使！这种违反自由主义思想的事情，我想我还是做不来！签署这份协定，就相当于把我的自由彻底的扔到波罗的海里！”\n来者依然不动。“和一个国家的政治力量作斗争，我想您做不到吧。我也做不到。请再想想。”\n他起身就要走。临行前，他又一次回头，说道："
SWE.8.a:0 "“自由主义？那是什么垃圾。”"
SWE.9.t:0 "一天"
SWE.9.d:0 "“现代人的生活总是不变的，至少主体上不变。”\n\n正如往常任何一天，安德里亚斯吃完早饭就出门上班了。虽说他所做的工作毫无变化，但周围的环境或多或少会有改变，而今天格外的多。\n\n街景有了不少变化，之前在街心被蒙上布的雕像终于揭幕了，金属制的雕塑在太阳下映映生辉，两个分别身着挪威与瑞典国旗图案衣服的男性搂着对方的肩膀，笑盈盈的迎着朝阳，而下面用双语写着“我们是兄弟”。周围有几个小孩子在旁边又蹦又跳，十分激动。安德里亚斯笑了笑，走入了办公楼。\n高楼原本秃秃的墙面现在不少换上了颇有美感的宣传画，比如挪威冰封千里的峡湾。宁静的景色下标着诸如“人民平等”一类的字眼，给人以极好的心情。安德里亚斯如往常一般买了份报纸，除了新闻，报社还特别邀请了一位评论员写文章，对未来的经济与平等问题进行了良好的展望……\n安德里亚斯把报纸放到一边，自语道："
SWE.9.a:0 "“嘛，起码现在看来不错.”"
SWE.10.t:0 "焚毁禁书"
SWE.13.t:0 "酒会"
SWE.14.t:0 "小记"
SWE.15.t:0 "一封急电"
SWE.15.d:0 "“斯德哥尔摩向莫斯科急电，急电！”\n\n大清早的大街上，昨夜的狂风暴雨打落的无数梧桐叶毫无生气的躺在路面上，如同遍地的死去已久的腐尸。\n苏俄驻瑞典临时代表处的电报员别列诺夫对这些死尸印象可是很深刻的。昨日在王国的两个最大城市，奥斯陆和斯德哥尔摩的街道上，成千上万的左派分子被审判，被处决。哈康自己主持了在斯德哥尔摩的审判，而且（似乎是充满了挑衅意味地）邀请临时代表处的全体人员参会。别列诺夫去了，接着属实被恶心到了。\n首先是囚徒们入场，从斯德哥尔摩广场的东方走入审判席，周围是无数的狱卒施虐地鞭挞着他们。他们脸上的笑容如同阿鼻地狱的看守，他们手上的皮鞭如同卡提卡刀。而囚徒们，或许用“如同丧家犬一般”形容，程度都太轻了。他们中被羁押久了的，骨瘦嶙峋，如同刚刚从《巴黎圣母院》里面爬出来的卡西莫多；而那些小年轻们则像喝醉了酒一样脚步飘忽不定，实质上是已经被打瘸了，或者踝骨断裂。他们都是在一个又一个狂风大作的晚上被突然轰开了家门，连和自己的家眷告别都来不及，就被投入了渣滓之中。至于台上的哈康，如同圣母玛利亚一样慈祥，又如同被蒙面的安拉变幻莫测。\n接着是一个接一个的审判。随着一声又一声的惨叫和皮鞭抽打在上皮组织上的清脆声响，囚徒们一个接一个被叫到台前，然后连辩护的工夫都没有，直接被宣告了他们的罪行：叛国。当然这是一般的，如果仅仅全都是叛国未免不能符合观众们的兴趣，于是各种各样的附加罪名也被填了上去，强奸，杀人，纵火，抢劫，就好像嫌王国的罪犯还不够少。\n大多数人的命运都是被枪决。别列诺夫亲眼见证了一场枪决：囚徒们被蒙上眼睛，如同茨威格将要写下的陀思妥耶夫斯基一样，被捆绑在柱子上。然后士兵们也站成一排，扣下扳机，子弹正中心脏，囚徒顿时血肉模糊地倒下，如同兔子湿润的卵巢，又如同被逼迫吃下手稿的眼球。红色的鲜血流淌，流到别列诺夫的脚下，于是一切又开始融化，融化在十三黑日之中。\n\n“冷静。你只是写新闻稿而已。”别列诺夫终于从回忆中惊醒，又开始写急电剩余的内容。\n\n窗外梧桐照旧。"
SWE.15.a:0 "罪有应得。"
SWE.16.t:0 "一如既往"
SWE.17.t:0 "阳台之上"
SWE.18.t:0 "戏剧性反讽"
SWE.18.d:0 "“我看着演讲席上的议员发表着自己的观点，虽说没有必要，但我还是听下去了。”\n\n斯德哥尔摩的静夜，一位不知名的军官坐在军营里，静静地写着日记。\n世界是如此安静。\n\n“‘这是有效果的，没有必要叫嚣。关于此项法案，还有一个要点…，我要告诉你们如何指定错误。’”\n“‘我们在应对方面和你们一样努力！’底下有人高声喊，听上去格外刺耳。”他揉了揉自己的太阳穴，似乎是感到了一些疲倦，但随即继续写了下去。\n“‘必须制定一个新政策，来应对这场……’他并没有理会这些反对意见，接着往下说。”\n“‘我们没有请求你提出一个新政策，保持之前的就好了！’”另一个议员拍着桌子喊。其他反对党派鼓掌热烈的掌声，在议会放大声音的建筑结构下震耳欲聋。看到演讲席上的人停顿了，他大喊，“‘真的不用这么好心！’”\n“议会的大厅里随即响起一阵哄堂大笑。”\n“演讲者很明显进行不下去了，演讲稿散作一片片，飘到地面，使他不得不做出滑稽的动作来抓，可支持者也空前的愤怒了.随即各种辱骂使得议会变成战场，两排人先是混乱的互骂，然后走出席台开始撕扯，甚至有人趁乱举出挪威旗帜，随即被旁人大喊一声叛国，将其扑倒……”\n\n真是混乱，他如是想到。不过这场混乱也该结束了。\n\n“‘长官，各部队已到达预定位置。’旁边的士官小声说到。”\n“‘不用听废话了啊。’我喃喃道。”\n他得意地继续写作。毕竟，接下来是他的主场。\n\n“我一脚踹开后门，鉴于形势混乱，没人注意到我，我朝天开了一枪。”\n“砰！”\n\n“议员们先是震惊，然后怪叫着，四散而逃，部队则突然出现，有序的堵住去路。最后议员们挤作一团，议会空前的安静，正因如此，一些微小的动静也如此刺耳。”\n“嚓，嚓。”\n“我回头，却看到之前的演讲者瘫倒在地，徒劳的后退，却被自己的演讲稿所出卖，只能够龟缩在地上。”\n\n“我笑了。”"
SWE.18.a:0 "如此滑稽，不值一提。"

SWE.22.t:0 "瑞典向我们请求贸易准许"
SWE.22.d:0 "我们西方的邻居瑞典-挪威联合王国申请通过一项双边贸易协定，旨在达成两国之间的农业-工业贸易，打破此前近乎冰封的贸易关系。此举并不符合一般的意识形态要求，但是明显有利可图。我们需要和他们开展这一贸易协定吗？"
SWE.22.a:0 "我们没有理由拒绝。"
SWE.22.b:0 "还是让他们自生自灭吧。"

SWE.23.t:0 "苏联同意协定"
SWE.23.d:0 "苏联方面的消息报告，苏联政府已经同意这一协定，两国边界上的芬马克口岸已经开始熙熙攘攘的贸易了。"
SWE.23.a:0 "不错。"

SWE.24.t:0 "苏联否决协定"
SWE.24.d:0 "这些顽固的布尔什维克否决了这一协定，他们似乎要闭关锁国，直到有人用武力敲开他们的国门。"
SWE.24.a:0 "这是他们的损失。"

SWE.26.t:0 "瑞典请求和我国签署军事合作协定"
SWE.26.d:0 "瑞典申请和我国建立一系列的合作关系，包括工业建设和军事工业的发展。我们是否要同意这一协定？"
SWE.26.a:0 "我们没有理由拒绝。"
SWE.26.b:0 "这只不过是虚伪的面具。"

SWE.27.t:0 "[FROM.GetName]同意协定"
SWE.27.d:0 "[FROM.GetName]同意了和我国的贸易协定，我国的经济将得到进一步的发展，同时他们的军工产业也将有一定进步。"
SWE.27.a:0 "这不错。"
SWE_Trade_decision_tt:0 "将解锁扩大合作的决议。"

SWE.28.t:0 "[FROM.GetName]否决协定"
SWE.28.d:0 "[FROM.GetName]否决了和我国的贸易协定，他们十分粗暴地拒绝了这一要求。"
SWE.28.a:0 "这是他们的损失。"

#联邦和平解体事件
SWE.11.t:0 "震撼世界的七日"
SWE.11.d:0 "奥斯陆几乎被纸张淹没了。\n无论是宣扬挪威独立的政治传单，还是针对主要挪威独立运动领导人的通缉令，都已经几乎遍布这座大西洋明珠的每一个角落。奥斯陆市长西格约比恩几乎要被着无限的混乱所强行窒息。他的市政厅的大多数官员几乎都已经上街游行，整个政府机构已经停摆，并且他还要面对着近乎无穷无尽的抗议人群————他们正在砸他办公室的门，威胁这位奥斯陆的知名人物，要求他签署一份命令承认运动的合法性，否则就扔一发炸弹进去轰死他。见此情况，西格约比恩只能叹一口气。谁叫他是这倒霉的政府机关的首脑呢？\n“难道警察和军队不能够阻止他们吗？”西格约比恩的妻子坐在他旁边，难以置信地看着快要撑不住的门，有气无力地说道。毕竟这位来自哥德堡的美丽夫人没有经历过如此场面，西格约比恩并未置评。他的幕僚则向前走了一步，说道：“很明显，军队什么的是站在他们那一边的。您就不用指望外援了，开门吧。”\n西格约比恩同样不予置评。\n\n门在颤抖。\n\n所有人都在颤抖。\n\n世界在颤抖。\n\n轰的一声，门倒塌了。一排卫兵迅速冲进了办公室，包围了西格约比恩。但是他们的枪口对准的不是所谓“暴徒”，而是他们的长官。\n“先生，请立刻做出决定。”为首的士兵用生硬的书面语说道。\n\n于是西格约比恩颤抖着拿起一支钢笔，看着足足一个小时前就被塞进来的宣言草稿，颤抖着拧开钢笔的笔盖，低下了他的头。"
SWE.11.a:0 "世界在等待"
SWE.12.t:0 "永恒的一小时"
SWE.12.d:0 "“先生，您不能在这里过境。”\n“可是我不能回家吗？！”\n\n\n瑞典的一座边境小镇上，一个老人举起拐杖，指着自己面前的卫兵，破口大骂。“我就住在你们现在建起的这座愚蠢的墙的另一侧不到500米的地方，然后你们这些母狗养的私生子就要阻止我回到属于我的温暖的家，难道你们不是应该被处决，然后扔到波罗的海里面喂鱼吗？！”\n“先生，这是命令。您嘴中所提到的‘联邦政府’已经在今早十时整解体了，现在您是挪威公民，如果您要离开瑞典王国的地界，请徒步一小时到最近的口岸。”\n“即使直线距离只需要走五分钟？！”\n“我想是的，先生”\n“那就让这口岸见鬼去吧！我要准备破门了！”\n老人忽地举起拐杖，击打向了面前的卫兵。“你妈的，这种不合理的条约就不应该存在！老子活了六七十年了，一辈子都是联邦的公民，你他妈的怎么敢的，居然敢阻挡我通过！我告诉你，妈的，我在瑞典这片土地上走过的路比你吃过的盐还多！”\n老人就这么抽打了卫兵足足一个小时。他感受得到这时间的漫长，一股气前所未有的愤怒和无力感同时裹挟了他，使他不能正常的做任何事，只能抽打面前的这个人。\n\n过了好久，老人终于结束了抽打，深呼吸了一口气，对着面前的卫兵说道：“很抱歉，我失态了。”\n“但不要再管我了！因为......”"
SWE.12.a:0 "“我们的时代，结束了。”"
SWE_11_tt:0 "§R哦，不······§!"
SWE_Norweign_Independence_boom_tt:0 "§R一切都完蛋了。§!\n\n§Y感谢您游玩AOR瑞典-挪威联合王国，联邦已经解体，有关后续的内容将在未来更新。在此，谨代表AOR全体组员对您的游玩再次表示由衷的感谢！§!\n§Y如果您对本mod有任何建议，欢迎访问我们的官方Bilibili和知乎账号！§!"

#挪威独立运动行动
NOR_Axis.1.t:0 "奥斯陆的游行"
NOR_Axis.1.d:0 "一群挪威独立运动支持者煽动了许多奥斯陆市民在奥斯陆市中心的大街上进行游行。目前警察已经参与维持秩序。"
NOR_Axis.1.a:0 "不必多虑。"
NOR_Axis.2.t:0 "奥斯陆的暴力游行"
NOR_Axis.2.d:0 "一群挪威独立运动支持者煽动了许多奥斯陆市民在奥斯陆市中心的大街上进行游行，并且打砸抢街旁的店铺，在大街上点燃燃烧弹，甚至向市政府内投掷燃烧瓶。目前特警和军队已经参与维持秩序。"
NOR_Axis.2.a:0 "剿灭这些乱民！"
NOR_Axis.3.t:0 "对哈康陛下的刺杀未遂"
NOR_Axis.3.d:0 "今早王宫内传来消息，有一个挪威独立运动极端分子闯进王宫内，试图暗杀睡梦中的哈康陛下，所幸宫内的警察迅速反应并逮捕了这个叛徒。同时，奥斯陆的许多人发动了一场叛乱，试图推翻现有政权。"
NOR_Axis.3.a:0 "消灭这些叛徒！"

#开局事件链
Tosca.1.t:0 "自新大陆"
Tosca.1.d:0 "“啊。”\n\n新任的美驻瑞典-挪威联合王国奥斯陆领事，伟大的法尔豪森先生今日在骂了好几句脏话后从一艘游轮上缓缓步入他忠诚的奥斯陆。\n坐上领事馆的车后，他一直在思考这“大西洋明珠”究竟有什么魅力，让上一任领事仅工作了三天就愤而请辞，并在辞呈之中大骂瑞典的政府工作不力，指责“这狗一样的王国政府养这些狗娘的私生子都在干嘛！”对于一个有良好素养的使节而言，这实在是太不文雅了。\n不知不觉间，汽车已经驶到了领事馆前。秘书立刻把法尔豪森领进了领事馆里。法尔豪森见惯了整洁的大厅，见到面前充满了构成主义之美的会客厅还是不禁吓了一跳：四脚朝天的办公桌，四处乱飞的传真纸，和墙上用红油漆写下的大大的美式脏话，居然让这个场景意外的和谐。法尔豪森出神时，天花上摇摇欲坠的吊灯又突然掉了下来，玻璃渣子四溅开来，更是让整个图景更为美丽。\n\n于此优雅协和之景色之中，法尔豪森先生的心情居然以外的愤怒——原因无他，不过一个燃烧瓶。趁着混乱，似乎有一个二十出头的小伙子随手把一个瓶子扔进了会客厅里。不得不说这是很现代的创意，毕竟能往1782年红酒瓶里面装汽油的人在伟大的领事看来多少沾染了过多的现代气息。\n如同天主亲自摇动手风琴一般，整个会客厅开始燃烧，纸张在上升气流的作用下满房间乱飞，如同扑火的飞蛾，点燃会客厅里的几乎一切物件，包括一瓶近一升的纯酒精。“砰”的一声，酒精爆炸开来，法尔豪森高贵的燕尾服突然燃烧起来。真是有趣！\n\n半个小时后，这场欢愉的大火终于被扑灭，秘书又一次把法尔豪森领进了领事馆，只是空气有所不同，气温略微升高。\n“先生，您有什么嘱咐吗？”秘书弱弱地说。\n\n法尔豪森沉思良久，说道：“我要辞职。”\n“什么？”秘书不敢相信自己的耳朵。\n“我要辞职，他妈的辞职！你还听不懂吗，混蛋！”法尔豪森摔下这么一句话，随即摔门而去。"
Tosca.1.a:0 "创纪录的时长：一小时二十二分。"
Tosca.2.t:0 "混乱的间隙"
Tosca.2.d:0 "在托尔看来，今天真是混乱的一天。\n\n一大早托尔就起了床赶着去超市买菜，避免遇上讨人厌的游行队伍——然而没有用。游行队伍似乎知道托尔的打算似的，早上五点起就开始在市中心游行，往超市的门口扔番茄，向政府的大楼泼硫酸。的亏托尔事先做好了准备，带了一把伞，不然都没有办法活着讲述这个故事了。\n当托尔回到家的时候，他想不到这还只是劫难的开始。首先是有人往他的门锁里灌注了胶水，让他不得不千里迢迢重新换了一把锁；接着在他晾衣服的时候，楼下有人往楼上泼水，正好泼到托尔的衣服上，害的已经半干的衣服必须回炉重造；最后，不知道是哪个缺德的人，每隔十分钟给他打骚扰电话，要求他加入“挪威独立运动”组织的游行。托尔毕竟还要忙，已经说了很多次“非常抱歉，我的时间不允许”，可这电话依然每隔十分钟准时准点响起，让人想拔了电话线骂人。如是磨难，托尔竟经受了一天，真让人感叹于他的坚毅，或是麻木。\n\n夜深人静的凌晨两点，世界终于安静下来，托尔静静地坐在客厅里，给自己泡了一杯中国同事邮寄过来的茶，一饮而尽。望着四周黑黢黢的夜空，托尔叹了口气，说道："
Tosca.2.a:0 "“算了。”"
Tosca.3.t:0 "托斯卡之吻"
Tosca.3.d:0 "“此事必须完成。你明白的。”\n“嗯。”\n\n秋雨如注。\n奥斯陆国家剧院的幕后，托斯卡·布伦希尔德女士静静地坐在一把直被木椅上，望着窗外飘落的红叶。宽大的服装正好适合塞两把自动步枪。\n今天是普契尼《托斯卡》在国家剧院的首演，这部伟大的歌剧可谓是经久不衰。似乎是作为一种政治宣传的必要，哈康国王也将会落座这次首演的观众席。\n\n这对于等候已久的托斯卡而言是一个好机会。聚光灯下，她是一个优秀的歌剧演员，清亮优雅的女高音总能在每次演出时让人神魂颠倒。然而很少人知道的是，她也是一位挪威独立阵线成员。在演唱之外，她的枪法也毫不逊色。今天是一个好机会，组织已经给他下定了任务，要求在这次汇演中暗杀哈康国王。\n托斯卡没有一点犹豫，随即答应了。她也累了。在王国生活30多年，她不在感到任何生命的活力。接到这个任务时，她只有一个请求：给她一张去俄罗斯的船票，投奔这黑暗世界的大光明。这将是一场最盛大的落幕，一切都将会就此结束。\n托斯卡深呼吸了一口气。\n\n第二幕的尾声。\n斯卡皮亚把托斯卡搂在了自己的怀里。而托斯卡此刻拔出自己衣服里藏着的两把自动步枪，大吼一声：\n\n“Questo è il bacio di Tosca!”\n\n随即，她一手举着一把步枪，开始扫射。由于出席观演的主要都是瑞典高官，因此她已无所顾忌，一边唱着“为艺术，为爱情”的咏叹调，一边跳入观众席，精确地扫荡剩余的目标。\n她已是如此绝情，她已是如此悲愤，一如得知卡瓦拉多西之死的托斯卡。"
Tosca.3.a:0 "何其悲惨，何其不幸。"
Tosca.4.t:0 "俄耳甫斯的回头"
Tosca.4.d:0 "“不！你不能再这样了！”\n“可是这难道不是我们共同的目标吗？为了挪威人民的解放？”\n“但是你怎么下得去手！”\n\n奥斯陆一处不知名的码头。\n海因里希抓着托斯卡的裙摆，死死地盯着自己面前的这个朋友，眼中的悲痛和愤怒近乎要溢出来。\n“托斯卡，我不敢相信你居然能干出那种毫无人性的举动！你难道可以眼睁睁地看着那五十几个人在你的枪口下死去而毫不愧疚吗！那是活生生的五十几条生命！\n“而你的理由，居然也是如此的虚伪：为了所谓的解放？这么个解放居然值得你去杀死这么多人？你岂非不知道他们背后的责任，他们在世界上是如此不重要，以至于你杀死他们的时候连颤抖都没有！\n“托斯卡，卡瓦拉多西的情人之名，你真的不配冠有这个名字，而应当被称作美杜莎！我曾经觉得你的歌喉是上帝的恩赐，但如今只能感觉到你是冷冷冰的机器。”\n“那么你要怎么办？”托斯卡不为所动。\n“你居然还会问我！”海因里希又生气又想笑，“如果你愿意，我将拉着你去警察局，但我想你已经不再愿意了。我只是祈望你还能抱有一点来自人性深处的良心！”\n\n良久的沉默。\n“好。”托斯卡的声音突然响起。\n“什么？”\n“我会和你去警察局。但我有一个要求。请你不要在路上回头，否则你将会永远失去我。”托斯卡生硬地说道。\n“为什么？”\n“请不要问。”\n\n于是海因里希走在前方，托斯卡走在后方，两个人向着警察局走去。\n起初，海因里希的思想十分复杂。他不知道自己该不该回头，也不知道自己做的事情到底对不对。\n他为什么要听他身后这个残暴的女人的话呢？他难道不知道这个人很有可能直接在路上给他的脑袋来上一枪吗？但是一种本能驱使着他前进，或许是对生的渴望，或许是对死的渴求。\n但这种怀疑从未消失。\n灯火渐熄。终于行到了市中心，海因里希突然心一紧——万一托斯卡已经走了呢？万一这个诡计多端的人已经埋伏起来，准备给他死亡的一击呢？如同命运的指引一般，海因里希蓦然回首，只见托斯卡依然跟在他身后，似乎十分诧异。\n海因里希顿时感到了历史的重演，如同俄耳甫斯在冥界的边境上的回头一样，自己将彻底失去她——\n\n并且不止她。\n托斯卡黑洞洞的枪口已经指向了她的卡瓦拉多西。"
Tosca.4.a:0 "“再见，海因里希。”"
Tosca.5.t:0 "今夜无战事"
Tosca.5.d:0 "“什么东西！”\n\n火光冲天的奥斯陆，漆黑的夜空被接连不断的巨大爆炸照得犹如白昼。西格约比恩只能坐在市政厅里，望着窗外火光冲天苦笑。\n这些抗议不只是独立示威的，还有反独立示威的，比如前几天的国家剧院事件，已经被定性为了恐怖袭击，但是有人赞成有人反对：有的反对者觉得这是一场正常的示威，有的反对者觉得将这定性为恐怖袭击太轻了，应当定义为苏俄对王国的战争行为，更有甚者赞成直接干预苏俄内战。当然更多的人都不清楚自己站在哪一方，只是为了游行而游行。这些人目的各不一致，有的还互相反对，但是他们唯一的共同诉求就是反政府，这甚至可以让红旗，联邦旗和挪威旗在一起挥舞。政府这是犯了天条吗，西格约比恩不禁苦笑了笑。\n\n好累啊。\n有的人说政府不负责任，但是政府已经在尽力搜捕凶手了，不管他是谁。西格约比恩足足一个星期没有睡觉了——不是因为什么愚蠢的责任心，而是单纯的睡不着，毕竟这帮工作人员也太有责任心了，每半个小时给他打一通电话，想睡觉也睡不着。\n转过头来，看向自己面前的政府工作报告。目前可以确定的是凶手已经逃向了苏俄，调查工作也只能告一段落。\n\n真是不知道该在“指导意见”上写什么，毕竟自己什么都没干呢。可以确定的是，能在上面用同一批复："
Tosca.5.a:0 "“已阅。”"

## 门户开放
SWE.25.t:0 "门户开放政策成果！"
SWE.25.d:0 "又一个月过去了，我国的经济欣欣向荣，又取得了一系列可喜可贺的成果。相信这一定能帮助我们更快推进联邦梦的进程！"
SWE.25.a:0 "万岁！"

