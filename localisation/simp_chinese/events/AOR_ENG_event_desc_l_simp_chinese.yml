ENG.23.t:0"金钱滚滚来"
ENG.23.d:0"亲爱的玛丽\n当我踏上那艘前往埃及的轮船时，我便知道这是一趟成功的旅途，上帝保佑，这场旅途的一切都很顺利，在经历数天的海上航行后，我的眼前便出现了埃及的土地。\n进入开罗，我便住在了当地的一家豪华旅馆，开始商办建厂的事宜，我原先交的几个朋友都很不错，他们给了我忠实的建议。可以这么说，我的工厂乃至我的成功是在他们的帮助下建成的。\n接着该说说我们的工厂了，工厂目前运转顺利，源源不断的英镑从生产线里面流出，比起开办一座普通的工厂，我更像是在开一座英镑的印钞厂。廉价的工人，便宜的原料，还有低到难以想象的税率，我敢保证，当你了解到他们的价格时，会惊掉你的下巴。\n但事物总是两面的，工人们常常消极怠工，有不满就大呼小叫，整天要求着什么十小时工作制与娱乐时间，老天啊，能有每天的休息时间，他们就该知足了。\n不过他们的政府是理解我们的，毕竟我们也向他支付了一笔钱，虽然没有曼切斯特的那么多，但也足以让这些埃及人亲吻我的靴子了，为了保证我的生产，他们甚至还派警察过来保护我的工厂，你敢想象吗？几位荷枪实弹的警察，保护着我这座工厂，我甚至不用花钱来雇我的安保人员（他们并不可靠）。\n在这我终于理解到帝国的广播中所谓的“互惠互利”是什么意思了？源源不断的金钱，自我的工厂流出，一部分流入他们的政府，一部分流入我的口袋，我还为当地修了一条笔直的路，专门用来运送我的产品。\n但最近的日子不是很好过，一些煽动分子溜进了埃及，用他们的花言巧语蛊惑了民众，有一段时间我的工厂里充斥着“独立”和“权利”但警员们仍然可靠的将他们处理了，为此，我不得不停工几天，以招募新的工人。\n再过一个月，工厂就能继续保持着稳步运转，那时我将踏上回来的航班，要不是因为最近的变动，我现在就想离开庄园，回到曼彻斯特，我的猎犬们，他们一定憋坏了。\n你的丈夫\n约翰伯顿"
