 ENG.30.t:0"新漫画《当临街22号》出版"
 ENG.30.d:0"近期，一本名叫当临街22号的漫画开始刊登于《笨拙》杂志，作者以诙谐的语言，与独特的漫画风格及其内部充斥的讽刺意味赢得了伦敦乃至全不列颠人的共同喜爱。\n\n故事阐述了在一个名叫布拉顿斯（Bratons）的虚拟国度中，漫画的主人公埃德蒙顿由于近期的选举（选举方式为古希腊式的抽签）成功当选为布拉斯顿的新任首相，并在他挑选的大臣———爱德华与温斯顿的共同辅佐下，以一种啼笑皆非的方式，处理一系列他们所遇到的政治难题。\n\n作为文艺作品，当临街22号的影响力是无与伦比的，他已经逐渐渗透到不列颠人的语言中，漫画里面的经典桥段，如“我们知道的那是对的，我们也知道那是好的，但这不是我们应该做的。”也早已成为大不列颠市民喜闻乐见的谈资。\n\n此类文艺作品的出版，很大程度上依赖于最近的《不列颠出版物法》的修订，他带来了战时所未有的宽松的政治环境，使得人民与创作者得以畅所欲言，但同时也使政府内阁，这一法案的修订者，遭受到了前所未有的攻击，据一位著名的时事评论家所说：“一份以幽默作为语言的不信任议案正在等待议会的表决。”\n\n同时，这场风波还席卷了其他国度，使得一些人远在海外的英国人，也了解到了这份作品。“我非常痛恨有人创作了这篇漫画，为此，我有必要做出声明，我热爱我所生活的土地，然热爱这片土地上生活的人们！。”一位生活在西班牙的英裔移民说道。"
 ENG.30.a:0"“温斯顿，我们该怎么办？” “听天由命吧。”"