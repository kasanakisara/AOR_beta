 #无政府主义子意识形态#
 anarchism:0 "安那其主义"
 anarchism_desc:0 "无政府主义包含了众多哲学体系和社会运动实践。它的基本立场是反对包括政府在内的一切统治和权威，提倡个体之间的自助关系，关注个体的自由和平等；其政治诉求是消除政府以及社会上或经济上的任何独裁统治关系。对大多数无政府主义者而言，“无政府”一词并不代表混乱、虚无、或道德沦丧的状态，而是一种由自由的个体自愿结合，以建立互助、自治、反独裁主义的和谐社会。"
 syndicalism:0 "革命工团主义"
 syndicalism_desc:0 "革命工团主义思潮兴起于20世纪初期，其追随者主张由工会或工人委员会领导国家，并由委员会直接将剥削制度下的生产资料私有制转变为直接可供工人组织使用的生产资料公有制。革命工团主义者们反对政党以及先锋队政治，他们将总罢工视为最有力的革命武器。革命工团主义者们力图在旧世界中建立新的制度，呼吁不分国籍、种族和性别的工人大联合，建立起一个以工人自治为基础的新社会。"
 new_syn:0"新大陆工团主义"
 new_syn_desc:0"新大陆工团主义是革命工团主义的一种独特衍生形态。大批自西班牙，法国，意大利移民来到美洲的工人们将工团主义传播开来，并将其理论与美洲独特的社会结构相适应，最终形成了这一特殊的思潮。支持者们通常在革命工团主义之上更进一步，通常呼吁直接行动，打倒政府，粉碎宗教特权，最终力图实现一个平等且自由的工人社会。"
 new_ten:0"温和新大陆工团主义"
 new_ten_desc:0"温和新大陆工团主义者努力在新大陆工团这种本土化特色主义与原教旨的工团主义之间寻求平衡，力求做到调和折衷，并尝试与共产主义者们保持正常的外交关系，给予工人之外的从业者一定权力。"
 new_ref:0"改革新大陆工团主义"
 new_ref_desc:0"改革新大陆工团主义者在新大陆工团主义之上着手进行改革以适应地区国情，吸纳委员会共产主义的部分理论，使总工会逐渐演变为一个专职的中央工会来领导地区工会。并同时领导农民委员会，科学院工会，艺术协会等多种异于传统意义的工会组织。为实现平等而不断斗争。"
 
 
 #革命社子意识#
 revolutionism:0 "革命马克思主义"
 revolutionism_desc:0 "马克思主义是一套关于阶级斗争的学说，争取人类解放的学说。要实现人类解放，就要消灭私有制，而这以无产阶级革命为手段。革命马克思主义者力求用武器的批判来贯彻马克思主义的革命性——彻底的批判性。"
 leninism:0 "马克思列宁主义"
 leninism_desc:0 "列宁主义，是帝国主义和无产阶级革命时代的马克思主义。是革命伟大导师列宁同志在领导俄国十月革命的实践中，坚持马克思主义和新的历史时代的无产阶级革命运动相结合，深入研究了资本主义发展到帝国主义阶段的规律，总结了无产阶级和资产阶级斗争的新经验，概括了20世纪初期社会科学、自然科学发展的最新成果，创造性地运用和发展了马克思主义，从而使马克思主义理论达到了一个新阶段，即列宁主义阶段。"
 stalinism:0 "斯大林主义"
 stalinism_desc:0 "虽然斯大林一直以列宁的学生自居从未使用过这个名词，但斯大林上台后的一系列政策作为对马克思列宁主义在政治上的继承和发展，被卡冈诺维奇称为斯大林主义。斯大林主义重视快速工业化与集体化，以及一个强而有力的社会主义国家去肃清一切反革命分子。"
 trotskism:0 "托洛茨基主义"
 trotskism_desc:0 "托洛茨基主义是由托洛茨基提出的马克思主义理论，托洛茨基主义坚持独立的工人运动与阶级斗争理念，坚持工人阶级民主与无产阶级专政这两个实现社会主义的理论。支持苏联的民主权利，倡导工人民主和政治自由，反对与帝国主义势力进行损害国际工人阶级利益的政治交易，反对秘密外交，主张世界革命。"
 committee:0 "委员会共产主义"
 committee_desc:0 "委员会共产主义是工人阶级进行斗争和革命的理论，它认为工人委员会将是工人们用来对抗资本主义、推翻资本主义、建立和管理共产主义社会的手段。"
 luxemburgism:0 "卢森堡主义"
 luxemburgism_desc:0 "卢森堡主义是一种马克思共产主义、自由意志主义、反战、激进女权主义和极其进步的意识形态。它认为马克思主义提出的无产阶级专政应该由民主的工人委员会和工会管理，而不是社会党。此外，妇女权利对她至关重要。"
 PRC_county:0"中国革命思想(土地革命派）"
 PRC_county_desc:0"最早接触到马克思主义的中国人是从俄国人身上知道的，大规模了解马克思主义也是由俄国人带来的。与其他国家不同，马克思主义在中国最早的大范围传播是在战场上，来自五湖四海和不同阶级的青年士兵被马克思主义的思想内核和美好的愿景感染，决心与马先生和恩先生为伴，作为解放中华民族和万千穷苦百姓的理论武器。参与一线工作的人员很深刻的明白在中国人数最多的阶级是农民，而农村比城市多太多，同时中国作为一个农业国家，整个国家基本依赖广大的农村地区提供人力、资源、粮食，因为如此，有人提出中国革命工作重心应该放在农村，和广大的农民组成工农联盟，对农民阶级进行深入的宣传、教育、领导，从而走向革命胜利。"
 PRC_urban:0"中国革命思想(城市中心派）"
 PRC_urban_desc:0"最早接触到马克思主义的中国人是从俄国人身上知道的，大规模了解马克思主义也是由俄国人带来的。与其他国家不同，马克思主义在中国最早的大范围传播是在战场上，来自五湖四海和不同阶级的青年士兵被马克思主义的思想内核和美好的愿景感染，决心与马先生和恩先生为伴，作为解放中华民族和万千穷苦百姓的理论武器。城市中心论是由党内长期工作在城市的党内人员提出。由于一战期间列强对中国压迫减轻，加上扶持中国军工产业，不少城市工业有了不少的发展，工人阶级的力量由此大幅提升。作为社会主义政党不会忽视这股日益发展的进步力量，提出要到各发达城市领导先进的工人阶级，同时进行城市暴动，夺取生产资料和生产工具，进而夺得全国政权。"
 PRC_pioneer:0"中国革命思想(先锋队理论）"
 PRC_pioneer_desc:0"最早接触到马克思主义的中国人是从俄国人身上知道的，大规模了解马克思主义也是由俄国人带来的。与其他国家不同，马克思主义在中国最早的大范围传播是在战场上，来自五湖四海和不同阶级的青年士兵被马克思主义的思想内核和美好的愿景感染，决心与马先生和恩先生为伴，作为解放中华民族和万千穷苦百姓的理论武器。与军政府不同，先锋军主义不会否定党的意义和作用，同时部队内会不断宣传革命思想，并以此作为自身的理想和目标。由于是士兵群体最先学习和传播马克思主义，本土的社会主义组织、理论和构想不可避免的带有军事色彩，加上中国面对列强的围堵、贫弱的实力、落后且不全面的工业，在和反革命势力进行战争时，不少人提出国家需要进行军事化来面对外部战争和内部的反动势力的反扑。"
 REV_soc:0"革命社会民主主义"
 REV_soc_desc:0"革命社会民主主义一词，来源于俄国社会民主工党的前身-俄罗斯马克思研究小组的研究中，一些针对激进主义的称呼。而这个词最终则被引用回马克思的故乡德国，并赋予了新的含义。\n\n在政治上，革命社会民主主义者被视作广义上的激进社会主义-这些社会主义者中包含着原先德国社会主义阵线的马克思派、拉萨尔派与其他大大小小非马克思学说的激进社会主义，又包含着俄国的社会民主工党以及第二国际的左派组织。但是具体到“革命”一词，如今的革命社会民主主义者，专指那些接受了马克思主义的指导或接受了马克思主义的大体思想，既坚持议会斗争，又坚持且绝不放弃暴力革命的社会主义者。他们有区别于当今列宁的布尔什维主义，因此他们又有另外一个称呼“古典马克思主义”。\n\n但无论怎么称呼，革命社会民主主义最显著的一点在于坚持阶级斗争且不放弃暴力革命路线，反对阶级调和。如今从美国的加利福尼亚的矿井到西伯利亚的原野，信奉革命社会民主主义的政治家以及群众们愈发增多，他们即将转换为社会主义者追求的世界革命不可或缺的一环。"
 
 
 #温和社子意识#
 councilism:0 "议会社会主义"
 councilism_desc:0 "议会社会主义者并不认同马克思暴力革命的主张，他们认为，进行议会选举，通过民选的方式实现共产党对政权的夺取，既能避免暴力革命中对人民的伤害，也能获得最高的合法性。"
 demsoc:0 "民主社会主义"
 demsoc_desc:0 "民主社会主义是英国工党和其他国家的右翼社会党理论家所宣扬的一种现代改良主义思潮。它反对无产阶级革命，鼓吹超阶级的国家观点，视混合经济为社会主义，主张以渐进的改良措施来达到社会主义。"
 
 
 #宗教社子意识#
 liberacion:0 "基督教社会主义"
 liberacion_desc:0 "基督教社会主义 ，又称僧侣社会主义，是十九世纪中叶欧美教会人士把基督教的社会原则运用到现代工业生活的思潮或运动。基督教社会主义者认为，基督教及其道德是社会进步的主要动力，应把基督教的平等、博爱、慈善原则弘扬普世，使社会主义基督教化；鼓吹人们彼此相亲相爱，反对私有制和国家权力；谴责资本主义的贱买贵卖、多取少予违反基督教教义原则；对当时工厂和工场工人的悲惨处境表示同情，反对这种非基督教精神。他们主张以“真正的基督教友爱精神”，依靠国家和上层开明人士的资助，建立生产协作社摆脱资产阶级的经济剥削，改善工人的处境。马克思、恩格斯指出基督教的社会主义，只不过是僧侣用来使贵族的怨愤神圣化的圣水罢了，僧侣的社会主义也总是同封建的社会主义携手同行的。"
 islamsocialism:0 "伊斯兰社会主义"
 islamsocialism_desc:0 "伊斯兰社会主义(Islamic Socialism)在调和伊斯兰教义与社会主义思想的基础上而创造的一种思潮。穆斯林中的社会主义者认为，《古兰经》和“穆罕默德圣训”中的思想与社会主义中追求社会平等和财富再分配的原则存在相通之处。§7信道而且行善，并谨守拜功，完纳天课的人，将在真主那里享受报酬，他们将没有恐惧，也不会忧愁。§!"
 
 
 #农业社子意识#
 revoway:0 "革命路线"
 revoway_desc:0 "面对农民对少数人垄断土地的不满，革命派农业社会主义采取马克思主义所提倡的暴力革命的方式，通过武装斗争将土地从地主富农手中解放出来实现土地农民所有制。"
 counway:0 "议会路线"
 counway_desc:0 "面对农民的诉求，议会派农业社会主义者采用议会斗争的路线，争取选票赢得大选，通过政策的方式限制地主富农对土地的垄断，将土地逐渐转化为农民所有制。"
 rad_san:0 "激进三民主义"
 rad_san_desc:0 "激进三民主义是以廖仲恺为核心的左翼国民党人在广泛汲取社会主义的思想并结合中国的国情，提出的一种偏向激进的三民主义派生思想。他们分析认为中国最大的问题是农民问题，主张工农同盟来进行革命。"
 
 
 #保守民子意识#
 conservatism:0 "保守主义"
 conservatism_desc:0 "保守主义是自由主义的相对面，资产阶级保守主义的概念形成于法国大革命。其描述的适用性可以概括如今的大半个欧洲，甚至于半个世界。\n\n在政治上，保守主义者一般对政治改革比较敏感，而是更求于政治体制运行的稳定。保守主义下的资本主义政权或其他形式的政权仍然采用资产阶级代议制的政体保证国家运行，但其选举方式则更加倾向于古典主义者所提倡的资格选举制，即通过对个人保有的财产或社会地位来授予公民选举权，这样可以保证公民有足够的能力治理国家，但其选举制度明显的限制了公民参与政治的人数与渠道。\n\n在经济上，保守主义者并不反对市场经济，但其对于经济改革也同样敏感，因此保守主义者治理下的同级别市场存量往往基数不大，且市场资金流通相较自由主义不利。对外，保守主义者奉行对本国的贸易保护政策，提倡高关税，且抗拒外国商品流入本国，这阻碍了世界市场的发展。\n\n但保守主义由于其稳妥的特征，仍然受到了资本主义世界的极大欢迎，同时也是部分新生国家寻求进步的良好途径。"
 federalism:0 "英式保守民主主义联邦"
 federalism_desc:0 "保守主义的形式有多样，而英帝国的保守主义则是资产阶级保守主义中最有代表性且最为独特的一个。\n\n英国作为拥有古老议会制传统的国家，以及后来成为光荣革命中《权利法案》所缔造的新生国家，其一开始就在君主立宪制的框架下运行-这创造了英国独特的政治氛围，即从诞生之初就偏向保守的资产阶级代议制。上院的保留和下院新贵族的大量涌入，辉格党的壮大及其霸据议会的50年，低效的选举以及严苛的投票资格，让这种氛围迅速感染了整个英国政界，直到20世纪，无论是英国的保守派还是激进派政坛，所表现出的政治氛围依旧是不明觉厉的保守-即对于英国以外政治、经济新事物的抵触。\n\n真正将其发扬光大的是大英帝国的扩张，英联邦民主主义以英国君主立宪制为蓝本，在英联邦国家中广泛使用。英联邦民主主义将蕴含着英国本土的法律，政治，哲学，经济思想在全世界铺展开来，极大影响了英语世界以及英国殖民地世界的发展历程。\n\n但当英国的经济车轮停下脚步时，原先可以用黄金掩盖的落后政治体制便会全如火山般爆发出来，以英国为代表的政体再不进行符合战后时代的改革，那么他们的政治或许就要在战后的泥潭中逐渐消亡了……"
 
 
 #自由民子意识#
 liberalism:0 "自由主义"
 liberalism_desc:0 "“自由主义”一词在资产阶级国家诞生的几百年间不断的被各种政府滥用，这导致它早已失去了原来的单纯含义-即尊重公民发展的权利，保障公民利益。\n\n如今的自由主义作为资本主义的代言词，其外在更多表现为政治与经济两部分。在政治上，自由主义者们宣称公民权利自由，普遍采用资产阶级代议制政体统治国家，并采用资格选举制或普选的选举方式保障公民的政治权利。在经济上，国家对于商业活动的开放持支持态度，政府本身也在鼓励商业活动，并减少政府工作的开支，使社会治理更加依赖经济活动运转。在国际上呼吁减少贸易保护主义，建立开放自由的全球市场。\n\n但自由主义的定义并不是一成不变的，对于强国来说，自由主义是他们进行海外扩张的有利工具，而对于弱国来说，实现自由主义则是实现国家进步的有利途径，尽管多数时候的自由主义经常给其他不稳定国家带来无穷无尽的治理问题。"
 sanminism:0"旧三民主义"
 sanminism_desc:0"国民党内保守派依然信奉着旧三民主义。民族主义，反对清朝封建专制和列强的侵略，打倒与帝国主义相勾结之军阀，求得国内各民族之平等，承认民族自决权。民权主义，实行为一般平民所共有的民主政治，而防止欧美现行制度之流弊，人民有选举、罢免、创制、复决四权以管理政府，政府则有立法、司法、行政、考试、监察五权以治理国家。其核心观念强调直接民权与权能区分，亦即政府拥有治权，人民则拥有政权。民生主义，其最重要之原则有两个，一为平均地权，二为节制资本。"
 
 #威权民子意识#
 authoritarianism:0 "威权民主制"
 authoritarianism_desc:0 "威权民主主义从来与政治家口中的独裁政治并无关系，更不能单纯的归纳于保守主义，而是资产阶级代议制的异化成果。\n\n从广义上看，这是一种高度集权，且限制了多数公民参与政治活动的资本主义政体。在政治的表现中，威权民主主义政府信奉集权政治，认为统一而高效的资产阶级国家机关是资产阶级国家运行的最有利方式。为达到这个目的，威权民主主义者会鼓励吸纳国家精英进入政府工作，且录用有利于国家政府工作的公民作为行政人员，同时会以某种形式间接或直接地阻止没有“经验”的公民参与政治活动，威权民主主义者认为这是对秩序的稳定措施。\n\n在经济上，威权主义者并没有明确的经济概念，无论是自由主义经济或保守主义经济，都可以被威权主义者所采纳-且不用受到议会机制所带来的干扰，国家经济可以在一个政府或少数政治团体所组成政府的干预下运行，这是威权民主主义者认为威权民主主义最大的好处。\n\n为了维持威权民主主义政体，其支持者大多会采用相对强硬或带有强迫性质的手段规范社会秩序，包括反对自由言论。镇压游行示威，宣扬国家认同的价值观等等。但无论如何，威权民主主义并没有做到真正意义上的独裁统治，仍然有一套可以运行的资产阶级代议制作为国家的中枢机构运行，相对来说，它是限制了公民一部分权利的民主主义。"
 patriarch:0 "家长制政府"
 patriarch_desc:0 "顾名思义，政府就像大家长一般保护着公民，但同时。这个“家长”所带来的不仅仅只是慈爱，还有严厉打下的棍棒。\n\n家长制政府所表现出来的最大特征就是如同威权民主主义一般的政治体制，甚至要比威权民主主义的集权程度更进一步，相对来说，家长制政府已经破坏了传统资产阶级政治的代议制，更多的倾向于一个团体或几个团体的政治操盘。\n\n虽然家长制政府的权力是如此的高度集中，但家长治政府的另外一个特点则是坚持对公民的负责-这些所谓的负责包括维护私有财产不可侵犯的权利、对公民的生命提供保障、国家有义务保障公民的正常生活以及活动安全。在种种条件的加持下，家长治政府需要在社会经济层面对公民作出巨大的让步，通过加强政府的干预增进公民的福祉，提高公民的生活待遇。 在家长制政府的治理下，公民的一般生活保障要高于其他资本主义国家，且拥有一定的生活选择空间。\n\n但同时，家长制政府也是社会秩序的坚定捍卫者。家长制政府通常在社会层面上采用各种强制性的手段以及严厉的刑罚规范公民的权利与义务，并限制了公民一部分的自由权利以及政治权利。家长制政府会毫不犹豫地清除社会的不稳定因素，以维护社会的正常运行。家长式政府通常会宣扬与有利于维系政府与公民关系的国家价值观，以宣扬政府认同的思想与价值，鼓励公民更好的为个人以及国家服务。"
 oligarchy:0 "寡头政治"
 oligarchy_desc:0 "寡头政治指由少数人掌握政权的一种统治形式，原指少数人掌握的政权，后通指由一小撮反动统治者操纵一切的政治制度。不仅是在政府之事务中服从少数人之统治的政治，而且在任何团体，诸如一个教堂、工会、学校，或者任何其他机关中，由少数人所管治者，均可称为寡头政治。"
 confuism:0"新儒学"
 confuism_desc:0"在中国这片土壤上，儒家和儒学已经存在了上千年。儒家思想早已浸透了这片土地的每个角落。想长久而稳定的统治这片土地，就绕不开儒学和儒家。显而易见的是，这个延续千年，致力于维护封建帝制的体系，如今已难以满足如今时代的要求。但这并不意味着我们要把它完全摒弃，只需要适当的修饰和改造，它仍然能成为最符合中国国情的治理方法。作为晚清少数留德武官的一员，段祺瑞在德意志接触到了容克和他们的思想。军功与土地、垄断资本主义、以及还在发展中的社团主义思想，对他产生了极大的影响。如今，面对波涛汹涌的国内局势，段祺瑞和他的僚属，提出这样了一个全新的“复古”理念。政治上，是基于传统儒学的礼义纲常，又融合近代西方政治思想的中央集权和精英阶层有限民主政治；军事上，是借鉴自普鲁士容克，但被称作“秦之故智”的军功爵与军功授土制度；而经济上，则是诞生于西方，如今仍然在发展，但被牵强附会为“明之遗计”的资产阶级垄断和社团主义制度。"
 uni_san:0 "联合三民主义"
 uni_san_desc:0 "联合三民主义是以陈其美为首的右翼国民党群体所提倡的对三民主义的修改思想。他们几乎完整保留了大部分旧三民主义内容，主张联合进步军阀统一中国。"
 limited:0"有限民主主义"
 corporatism:0"合作主义"
 
 
 #伊斯兰民主子意识#
 constitutionalismv:0 "伊斯兰君主立宪制"
 constitutionalism_desc:0 "伊斯兰国家的君主立宪力图用宪法的准绳将神权加持下的王权约束起来，剥夺君主的宗教权力和世俗权力。君主仍是国家的元首但失去了绝对的权力，需遵循伊斯兰教法的指引及世俗宪法的规定。§G谁服从真主和使者，真主将使谁入那下临诸河的乐园，而永居其中。这是伟大的成功。§!"
 islamdemcratic:0 "伊斯兰式民主制"
 islamdemcratic_desc:0 "伊斯兰式民主希望在民主的框架下将伊斯兰教的原则应用在不同的政治决策及公共政策中。他们的主张有三点：政治领袖应该由人民选出，选出的领袖应该遵循伊斯兰教法的指引，以及领袖不能独裁行事。但在不同国家和不同教派中有着不一样的理解。因此，执行的不同导致伊斯兰教法对不同国家的人民的日常生活有不同的影响。§G对于漠视真理、视信仰为儿戏之人，大可不必理会他们，你应当劝诫他们，但他们的结局，交由真主掌控。§!"
 
 
 #进步主义子#
 socialism:0 "社会民主主义"
 socialism_desc:0 "社会民主主义力图依靠改革来建立一个平等的社会主义国家，其目标是废除或者削弱资本主义从民众手中摄取的权力。"
 unionism:0 "工联主义"
 unionism_desc:0 "工联主义是国际工人运动中一种改良主义思潮。 因最早出现于英国工人联合会而得名。在雇佣劳动制度范围内改善工会工人的经济条件和法律地位，不要求推翻资产阶级的统治。 工联主义主张阶级调和，宣传资本家和工人的利益是协调一致的。 主张进行纯经济的斗争。 注重工人眼前的和暂时的利益，忽视工人阶级的整体利益和最终目的。"
 meliorism:0 "改良主义"
 meliorism_desc:0 "改良主义是一种试图以非革命手段解决资本主义社会矛盾的资产阶级和小资产阶级思潮。这种思潮宣扬阶级合作，主张在保存资本主义制度的前提下，实行局部的微小的社会改良；反对暴力革命和无产阶级专政，主张通过法令和立法途径实行社会改革，变资本主义为普遍福利社会。"
 newdemism:0 "新民主主义"
 newdemism_desc:0 "新民主主义是一种特殊的意识形态，并非社会主义，也区别于传统的保守民主主义。是社会主义革命的前阶段。"
 surrenderism:0 "右倾社会主义"
 surrenderism_desc:0 "右倾社会主义是变质的社会主义，又称投降主义。右倾社会主义产生自对资本主义思潮所腐化侵蚀的社会主义者，他们不够重视无产阶级专政的做法或想法，过分靠近或依赖非无产阶级，延缓公有化进程。包括机会主义、投降主义、逃跑主义。"
 PanAfricanism:0"泛非主义"
 PanAfricanism_desc:0"泛非主义是全世界黑种人反对种族歧视和殖民统治的一个声势浩大的思潮.泛非主义积极致力于非洲文化复兴和民族自觉，在相当程度上唤醒了非洲人民的民族意识和民族尊严，塑造了非洲大陆特有的区域意识和历史使命感。"
 lianshengism:0 "联省主义"
 lianshengism_desc:0 "联省主义是一种中国本土化的改良主义思潮。对内主张运用联邦制度调和央地关系，颁布联省宪法保障国家统一，授权文官政府进行国家治理。对外则主张修约废约，摆脱不平等条约的束缚，保护本国工商业。联省主义希望通过发展民族资本主义，实现中国社会的变革和民生的改善。"
 new_san:0"新三民主义"
 new_san_desc:0"新三民主义是以孙文为首的老国民党核心人物与国民党少壮派所提倡的,介于社会民主主义与新民主主义之间。是孙中山对其三民主义思想作出的改进，是联俄联共、扶助和依靠农工的思想体现。新三民主义有了明确的反帝反封建内容，并且同联俄联共扶助农工三大政策结合起来，民权为平民所共有和节制资本的口号。这表明对三民主义建立资本主义社会和资产阶级专政的思想，采取了批判的态度。“反对帝国主义”和“耕者有其田”的口号，使它有明确的反帝反封建的政治内容。"
 social_liberalism:0"社会自由主义"
 
 
 #法西斯主义子意识#
 strasser:0"斯特拉瑟主义"
 strasser_desc:0 "斯特拉瑟主义是纳粹主义中一股较纳粹主义更为激进、以工人和群众行动和为基础的国家社会主义思潮。这股思潮建立在强烈的反犹太主义的民族主义立场上，反对金融资本主义。斯特拉瑟主义一词来源于斯特拉瑟兄弟格雷戈尔·斯特拉瑟和奥托·斯特拉瑟。"
 fascio:0 "原始法西斯主义"
 fascio_desc:0 "法西斯主义是一种结合了社团主义、工团主义、独裁主义、极端民族主义、中央集权形式的军国主义、反无政府主义、反自由放任的资本主义、和反共产主义政治哲学。有着强烈的民族主义、经济的社团主义，一个权力极大的军事领导者，将民族、国家、集体的地位置于个人或团体之上的特征。"
 NSDAP:0 "纳粹主义"
 NSDAP_desc:0 "纳粹主义滋生于国家社会主义德国工人党，并非社会主义政党。其意识形态的精神是“属于一个民族”，纳粹主义的基本理论包括：种族优秀论，“优等种族”至上；一切领域的“领袖”原则，“领袖”是国家整体意志的代表；反对英法资本主义体系以及共产主义思想体系，抵制共产主义理论。"
 nationalism:0 "极端民族主义"
 nationalism_desc:0 "极端民族主义乃源自对世界主义的厌恶。极端民族主义指在政治上特别强调用牺牲其他国家的利益和不顾其他价值观念，如戒绝杀戮，遵守国际法以及通过双边或多边条约维持国际合作，以此寻求本民族的利益。"
 troopism:0 "军国主义"
 troopism_desc:0 "军国主义异化了军队与国家的关系，军国主义者认为，国家应该服从于军队的需要，而这种异化的实现主要是通过军人干政的方式实现。军国主义有着民族主义，沙文主义，扩张主义，帝国主义的成分，也同样具有极大的反动性。"
 nationalsoc:0 "国家社会主义"
 nationalsoc_desc:0 "国家社会主义强调：国家是绝对物，所有个人和集团都是相对的，国家是个人真正的理性和自由意志的体现，个人必须绝对服从国家。虽然在某些方面与社会主义相似，但其本质仍然是法西斯主义的派生。"
 wangism:0 "汪氏极端三民主义"
 wangism_desc:0 "汪氏极端思想是汪精卫自日本归来后，以旧三民主义为蓝本，加入其个人对日本制度思考与学习的的一种极端思想。"
 szegedism:0"塞戈德思想"

 #专制主义子#
 miliciagov:0 "政府独裁"
 miliciagov_desc:0 "从遥远的奴隶制到如今的军阀，独裁政治所表现的形式可以说是横贯古今，多种多样。并为后人一遍又一遍的复制使用着。\n\n关于独裁政府的定义极其广泛，包括了从奴隶制时期的国王独裁，封建时代的封建君主独裁，近代与现代的军政府独裁亦或是接受改良的君主独裁。但在欧美以外的其他地区，仍然有不少国家，亦或是受外国统治的殖民地政权保留了这种落后的制度。\n\n独裁政府通常由极少数团体或军人组织组成。君主独裁制度中的君主掌握着国家的绝对权力，并且国家组织体系带有浓重的封建气息，通常采取世袭制的方式统治国家。军人独裁制度则是由军政府来控制国家，其政治体系完全破坏了资产阶级代议制，政府组织者由军人担任，执行者由少部分文官担任，依靠军事管制控制国家。在部分资产阶级国家中，由于受到自身或外部的历史因素影响，其采取的资产阶级代议制也遭受了独裁政治的严重破坏，几乎由极少数的团体统治国家，并通常采用文官独裁的方式治理国家，就算是拥有资产阶级代议制，其公民投票权也遭受了极其严格的限制。\n\n尽管野心家们独裁政府的甜头仍然不减，但随着民族风潮的席卷，越来越多的独裁政体被推翻，相信在不久的将来，他们自己就会被迫做出改变。"
 warlord:0 "军阀联省思想"
 warlord_desc:0 "军阀的联省主义在本质上就是一种军阀体制,产生自中华地区的各个军阀头子，他们的思想千奇百怪，统称为军阀联省思想。"
 despotism:0 "个人独裁政治"
 despotism_desc:0 "个人独裁政治将国家各方面的最高权力归属到国家的领导者上，使国家机器为统治者一人服务，从而达到统治者的目的。"
 soltanism:0 "伊斯兰君主制"
 soltanism_desc:0 "伊斯兰国家的君主拥有的权力涉及行政与宗教，有的伊斯兰国家君主是政教合一的领袖而有的伊斯兰国家的君主只有世俗权力。不同地区在继承方面存在不同，一些国家的继承人由部落族人推举产生，也有国家通过各个部落联盟选举产生或世袭产生，部分国家由宗教领袖来担任君主。§G谁违抗真主和使者，并超越他的法度，真主将使谁入火狱，而永居其中，他将受凌辱的刑罚。§!"
 monarchism:0 "君主专制"
 monarchism_desc:0 "君主制是人类历史上最古老、最普遍的政体形式。它不仅是奴隶制国家和封建制国家的主要政权组织形式，还被少数资本主义国家所采用。君主制的具体形式并不单一，也不是一成不变的。其中最常见的为世袭君主制。"
 
 
 #非传统子意识#
 revengism:0 "复仇主义"
 revengism_desc:0 "复仇主义由民众强烈的爱国心，民族主义情绪，对软弱政府的失望以及对战胜国的愤怒组成。力图通过一切手段将自己曾遭受的苦难让施加苦难的人体会到，以此来达到复仇。"
 nazboh:0 "民族布尔什维克主义"
 nazboh_desc:0 "民族布尔什维克主义受到俄国十月革命影响，主张把德国一切民族主义分子，包括资产阶级在内，都吸引到共产党方面来，在“民族布尔什维克主义”的旗帜下，同协约国作战。但又反对国际主义，主张民族主义，将民族的利益放在世界革命的利益之上。"
 militarism:0 "先军主义"
 militarism_desc:0 "先军主义将先军政策融会贯通到了各个方面。先军主义者提倡国家为军事服务，发展依靠已经或未来将要发生的战争的经济体系，在政治上排斥文官统治主张军人参政施政，将沙文主义与民族主义融合并力图用武力征服的方式实现本国利益。"
 mysticism:0"神秘主义"
 mysticism_desc:0"神秘主义的基本信条就是世上存在着秘密的或隐藏的自然力，能够理解并操作神秘的自然力的人，必须接受过神秘知识的教育，富有浓重唯心主义色彩。"
 Megacorp:0"企业国家"
 Megacorp_desc:0"“巨型企业”一词来源于中美洲人对巴拿马公司的形象调侃：Canal caudillo.\n接踵而至的法国公司，使得该词使用范围逐渐扩大化，并最终波及到了中美洲国家本身的特质。\n在政治上，巨型企业者奉行公司化的精英主义和威权主义，通常将资本公司的运作方式与当地的政治体系相结合，强调利用技术官僚建设经济服务型政府，并推动企业型社会的常态化管理；巨型企业者通常以强硬手段肃清体系中的不稳定因素。\n在经济上，巨型企业者认同社会达尔文主义，强调社会内的自由竞争，巨型企业者认为政府与国民是一种有机形态， 将政府与国民看作是同一个经济体制中的上下行关系；与之相对应的，政府与企业具有统一性，因此常常会用贸易保护政策维护本国政府的稳定统治，同时也会用极端暴力的手段去管理非统治阶层，以确保这套一体化经济体制的有效运行。"




