l_simp_chinese:
 BEL_prepare:0"雄狮方案"
 BEL_prepare_desc:0"当年比利时政府流亡非洲之时，仅携少数王国卫队一同前往。而在非洲的日子里，政府为缓解财政上的赤字，王国卫队又被反复精简和不断撤裁，最终在一战结束后全部编为警察组织§!。\n英国人的背叛让我们仍需要在刚果执政数年，为了应对以后一切可能发生的情况，我们需要重新开始重整军备，恢复荣光。\n§Y比利时绝不是一条道路，建设强军，剑指低地！§!"
 Reorganization_the_Royal_Navy:0"重组比利时王国海军"
 The_only_access_to_the_sea:0"扩建刚果出海口"
 Radical_Naval_Studies:0"激进海军研究"
 Why_we_fight:0"扩大征兵宣传规模"
 Maximize_the_use_of:0"加强本地警察训练"
 War_Plans_Department:0"王国战争计划部"
 Inclusion_of_wise_people:0"调度科研人才"
 BEL_Belgian_Griffon:0"建设“狮鹫”"
 BEL_Albert:0"王国内政"
 BEL_Albert_desc:0"根据§Y《比利时宪法》§!的93与94条：比利时联邦议会可以在国王无能力继续进行统治时进行§Y摄政§!——而“无能力”的具体解释权则掌握在议会手中。\n目前，首相卡尔东·德维亚尔和他所代表的§C天主教党§!已经占据了两院的§Y绝对话语权§!，只要他执意发起投票，他便可以以此种方式来结束阿尔贝的统治，彻底的掌握大权。\n但国王对此也并不是束手无策——只要他能够在接下来的时间内促进其他党派组成§Y政党联盟§!，对§C天主教党§!发动§Y不信任投票§!，一切就尚还有转机。\n\n§Y倒计时已经开始，比利时又会走向何方？§!" 
 AOR_BEL_GUI_1:0"王国内政"
 BEL_keep_war:0"保持战时状态"
 BEL.gui.1.tt:0"只要比利时不停止战时状态，就算是国王也无法对宪法进行更改。"
 
