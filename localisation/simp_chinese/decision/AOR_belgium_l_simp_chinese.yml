 BEL_prepare_desc:0"当年比利时政府流亡非洲之时，仅携§Y少数王国卫队§!一同前往。而在非洲的日子里，政府为§Y缓解财政上的赤字§!，王国卫队又被反复精简和不断撤裁，最终在一战结束后全部编为§Y警察组织§!。\n英国人的背叛让我们仍需要在刚果执政数年，为了应对以后一切可能发生的情况，我们需要重新开始重整军备，恢复荣光。\n§Y比利时绝不是一条道路，建设强军，剑指低地！§!"
